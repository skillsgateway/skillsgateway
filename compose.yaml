# Local run of the packaged gateway image against PostgreSQL.
#
#   ./mvnw -Pnative -DskipTests native:compile
#   docker build -t skills-gateway:local .
#   docker compose up
#
# The OIDC variables default to the build-time placeholders; point them at a
# real IdP (SGW_OIDC_*) to log in to the web/admin surface locally.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: skillsgateway
      POSTGRES_USER: skillsgateway
      POSTGRES_PASSWORD: skillsgateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsgateway"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    image: ${SGW_IMAGE:-skills-gateway:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skillsgateway
      SPRING_DATASOURCE_USERNAME: skillsgateway
      SPRING_DATASOURCE_PASSWORD: skillsgateway
      SGW_OIDC_CLIENT_ID: ${SGW_OIDC_CLIENT_ID:-change-me}
      SGW_OIDC_CLIENT_SECRET: ${SGW_OIDC_CLIENT_SECRET:-change-me}
      SGW_OIDC_AUTHORIZATION_URI: ${SGW_OIDC_AUTHORIZATION_URI:-https://idp.invalid/authorize}
      SGW_OIDC_TOKEN_URI: ${SGW_OIDC_TOKEN_URI:-https://idp.invalid/token}
      SGW_OIDC_JWK_SET_URI: ${SGW_OIDC_JWK_SET_URI:-https://idp.invalid/jwks}
      SGW_OIDC_USER_NAME_ATTRIBUTE: ${SGW_OIDC_USER_NAME_ATTRIBUTE:-sub}
      SGW_OIDC_SCOPE: ${SGW_OIDC_SCOPE:-openid}
      SKILLSGATEWAY_OIDC_ISSUER: ${SKILLSGATEWAY_OIDC_ISSUER:-}
      # Git storage. The default is the filesystem backend, which needs nothing
      # here. To run against object storage instead, start the `object-store`
      # profile below and set SGW_STORAGE_BACKEND=object-store.
      SKILLSGATEWAY_STORAGE_BACKEND: ${SGW_STORAGE_BACKEND:-filesystem}
      SKILLSGATEWAY_STORAGE_OBJECTSTORE_ENDPOINT: ${SGW_STORAGE_ENDPOINT:-http://floci:4566}
      SKILLSGATEWAY_STORAGE_OBJECTSTORE_REGION: ${SGW_STORAGE_REGION:-eu-north-1}
      SKILLSGATEWAY_STORAGE_OBJECTSTORE_BUCKET: ${SGW_STORAGE_BUCKET:-skills-gateway}
      SKILLSGATEWAY_STORAGE_OBJECTSTORE_CREDENTIALS_MODE: ${SGW_STORAGE_CREDENTIALS_MODE:-static}
      SKILLSGATEWAY_STORAGE_OBJECTSTORE_CREDENTIALS_ACCESSKEYID: ${SGW_STORAGE_ACCESS_KEY_ID:-test}
      SKILLSGATEWAY_STORAGE_OBJECTSTORE_CREDENTIALS_SECRETACCESSKEY: ${SGW_STORAGE_SECRET_ACCESS_KEY:-test}
    ports:
      - "8080:8080"

  # A local S3-compatible store, off unless asked for:
  #
  #   SGW_STORAGE_BACKEND=object-store docker compose --profile object-store up
  #
  # Floci is the same emulator the build's object-store suites run against, so
  # what is developed against and what is tested against are the same store.
  # The bucket must exist before the gateway starts; create it once with any S3
  # client pointed at http://localhost:4566.
  floci:
    profiles: ["object-store"]
    image: docker.io/floci/floci:1.7.0
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
