# yaml-language-server: $schema=https://raw.githubusercontent.com/reqstool/reqstool-client/main/src/reqstool/resources/schemas/v1/requirements.schema.json

metadata:
  urn: skills-gateway
  variant: microservice
  title: Skills Gateway
  url: https://github.com/skillsgateway/skillsgateway

requirements:
  - id: GW_0001
    title: Marketplace registration
    significance: shall
    description: The system shall allow an administrator to register an upstream git skill marketplace by its clone URL.
    rationale: Registration is the entry point for governance; only registered upstreams are ever fetched.
    categories: ["functional-suitability"]
    revision: 0.1.0

  - id: GW_0002
    title: Immutable snapshot ingestion
    significance: shall
    description: The system shall fetch a registered marketplace's default branch into a quarantine area and record an immutable snapshot identified by the upstream commit SHA.
    rationale: Pinning to commit SHAs is the basis for vetting, provenance, and rug-pull protection; the quarantine area is never served.
    categories: ["functional-suitability", "security"]
    revision: 0.1.0

  - id: GW_0003
    title: Local-only plugin sources
    significance: shall
    description: The system shall reject a snapshot whose marketplace manifest declares any plugin source other than a relative path within the marketplace repository.
    rationale: External sources (github, url, git-subdir, npm, archive) let installs fetch content that was never vetted (threat T4); the MVP fails closed instead of resolving them.
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0004
    title: Snapshots held until approved
    significance: shall
    description: The system shall not serve any snapshot until it has been explicitly approved; upstream changes shall never automatically alter served content.
    rationale: Mutable git refs enable rug pulls (threat T3); the approval gate between quarantine and published content is the core control.
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0005
    title: Manual approval decision
    significance: shall
    description: The system shall allow an authorized reviewer to approve or reject a held snapshot and record the decision, reviewer identity, and timestamp.
    rationale: The MVP vetting connector is human approval; the decision record is the start of the provenance trail.
    categories: ["functional-suitability", "security"]
    revision: 0.1.0

  - id: GW_0006
    title: Git smart-HTTP facade
    significance: shall
    description: The system shall serve approved snapshots as read-only git repositories over HTTP such that standard git clients (including claude plugin marketplace add) can clone and fetch them.
    rationale: Speaking the client's native protocol means zero client modification and no bespoke tooling to distribute.
    categories: ["functional-suitability", "compatibility"]
    revision: 0.1.0

  - id: GW_0007
    title: Only approved content fetchable
    significance: shall
    description: The facade shall expose only approved refs and objects; quarantined or rejected snapshot content shall not be fetchable.
    rationale: Serving the raw mirror would leak unvetted branches, tags, and history to clients.
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0008
    title: Fetch audit log
    significance: shall
    description: The system shall record every facade fetch with client source address (and identity when available), repository, ref, commit SHA, and timestamp in an append-only audit log.
    rationale: Inventory and blast-radius questions (threat T6) reduce to a query over the fetch ledger.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0009
    title: Snapshot provenance record
    significance: shall
    description: The system shall record for each approved snapshot the upstream URL, upstream commit SHA, approver, and approval timestamp, and keep the record retrievable after the fact.
    rationale: Compliance must be able to answer exactly what was served, from where, and who approved it.
    categories: ["security", "maintainability"]
    revision: 0.1.0

  - id: GW_0010
    title: Administrative interface
    significance: shall
    description: The system shall provide an administrative HTTP interface to register marketplaces, list snapshots and their states, and approve or reject held snapshots.
    rationale: Administrators need a single operational surface; this interface is the seed of the portal.
    categories: ["functional-suitability", "interaction-capability"]
    revision: 0.1.0

  - id: GW_0011
    title: Web authentication via OIDC
    significance: shall
    description: The system shall require an authenticated OIDC (OAuth2) session for all web and administrative HTTP interface access; unauthenticated requests shall be redirected to the identity provider for login.
    rationale: Enterprise SSO is OIDC-only by decision (ADR 0002); the app acts as its own BFF so tokens never reach the browser.
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0012
    title: Git client authentication via personal access tokens
    significance: shall
    description: The system shall require personal access token authentication on the git facade and shall reject unauthenticated or invalid-token fetches; the authenticated identity shall be recorded in the fetch audit log.
    rationale: Git clients cannot perform interactive OIDC; token auth over the standard credential-helper flow is the only workable mechanism, and it upgrades the audit ledger from IP-level to identity-level (GW_0008).
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0013
    title: Personal access token management
    significance: shall
    description: The system shall allow an authenticated user to create and revoke personal access tokens; tokens shall be stored only as cryptographic hashes and the cleartext value shall be shown exactly once at creation.
    rationale: Tokens are credentials; hash-at-rest and show-once are the baseline expected of an enterprise security product.
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0014
    title: SBOM endpoint
    significance: shall
    description: The system shall expose its own CycloneDX software bill of materials over an HTTP endpoint.
    rationale: A supply-chain security product should demonstrate supply-chain transparency for itself; Security teams can inventory the gateway with the same tooling the gateway advocates.
    categories: ["security", "maintainability"]
    revision: 0.1.0

  - id: GW_0015
    title: Container distribution
    significance: shall
    description: The system shall be distributable as an OCI container image running the GraalVM native binary and deployable via a provided Helm chart.
    rationale: Enterprises deploy to Kubernetes; a container image plus chart makes the gateway installable without bespoke packaging, and the native binary keeps the image small and fast to start.
    categories: ["flexibility", "maintainability"]
    implementation: configuration
    revision: 0.1.0

  - id: GW_0016
    title: Marketplace URL scheme allowlist
    significance: shall
    description: The system shall reject registration of a marketplace whose clone URL scheme is not on the configured allowlist (default http and https); scheme-less or unparseable URLs shall be rejected.
    rationale: "Git URL schemes such as ssh, file, and C-git's ext:: family are an injection surface; failing closed at the registration boundary keeps every later fetch inside vetted transports even as the transport set grows."
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0017
    title: Gateway-pinned ingestion ref
    significance: shall
    description: The gateway shall determine the git ref that is ingested (the upstream default branch); a registration request that supplies a ref other than the default branch shall be rejected with HTTP 400.
    rationale: Allowing consumers to choose refs would bypass the vetting pipeline's single-lineage guarantee (one quarantined default-branch history per marketplace) and reopen the mutable-ref rug-pull surface (threat T3).
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0018
    title: Portal marketplace and snapshot administration
    significance: shall
    description: The system shall provide a browser portal, served by the gateway itself behind the OIDC session, where an administrator can register marketplaces, trigger ingestion, list snapshots with their states, and approve or reject held snapshots.
    rationale: The administrative interface (GW_0010) needs a human-usable surface; serving the portal from the gateway keeps the app its own BFF (ADR 0002) so tokens never reach the browser.
    categories: ["functional-suitability", "interaction-capability"]
    revision: 0.1.0

  - id: GW_0019
    title: Portal token self-service
    significance: shall
    description: The system shall provide a portal page where an authenticated user can create and revoke personal access tokens, with the cleartext value shown exactly once at creation.
    rationale: Token lifecycle (GW_0013) must be usable without raw HTTP calls; show-once in the UI preserves the hash-at-rest guarantee end to end.
    categories: ["functional-suitability", "security"]
    revision: 0.1.0

  - id: GW_0020
    title: Snapshot content inventory
    significance: shall
    description: The system shall expose, for any snapshot, the plugins declared by its marketplace manifest and the skills found under each plugin's source tree.
    rationale: Reviewers must see what a snapshot actually ships before approving it, and future per-plugin or per-skill limiting needs this inventory as its policy surface.
    categories: ["functional-suitability", "security"]
    revision: 0.1.0

  - id: GW_0021
    title: Forge metadata at registration
    significance: should
    description: On registration of a marketplace hosted on a supported forge (GitHub, GitLab, Bitbucket Cloud, Bitbucket Server/Data Center, Azure DevOps, Gitea/Forgejo), the system should retrieve and store the project name, description, and last upstream update time; registration shall succeed regardless of whether the lookup does.
    rationale: Forge metadata gives administrators provenance context at a glance; being best-effort keeps registration independent of forge availability.
    categories: ["functional-suitability"]
    revision: 0.2.0

  - id: GW_0022
    title: Administrative actions are audit-logged
    significance: shall
    description: The system shall append administrative actions — marketplace registration, snapshot ingestion, approval decisions, and token creation/revocation — to the append-only audit ledger with the acting identity and timestamp.
    rationale: Compliance questions cover who changed the governance state, not only who fetched content; one ledger answers both.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0023
    title: Snapshot lifecycle event webhooks
    significance: shall
    description: The system shall deliver a snapshot lifecycle event (ingestion, approval, rejection) by HTTP POST to every registered webhook subscriber whose event filter includes that event, and to no other subscriber.
    rationale: Downstream systems must react to vetting decisions when they happen instead of polling the gateway; per-subscriber filtering keeps each receiver's blast radius to the events it asked for.
    categories: ["functional-suitability", "interaction-capability"]
    revision: 0.1.0

  - id: GW_0024
    title: Signed webhook payloads
    significance: shall
    description: The system shall sign every webhook request with an HMAC-SHA256 over the exact request body using the subscriber's secret, transmitted in a signature header, and shall return the subscriber secret in cleartext exactly once at subscriber creation.
    rationale: A receiver must be able to prove a delivery came from the gateway and was not tampered with; show-once mirrors the personal access token contract (GW_0013) so secrets are never re-readable from the API.
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0025
    title: Webhook delivery retry with backoff
    significance: shall
    description: The system shall persist every webhook delivery and retry a failed delivery with exponential backoff up to a configured maximum number of attempts, recording the outcome of each attempt and marking the delivery failed when the attempts are exhausted.
    rationale: Receivers are transiently unavailable; durable deliveries with bounded backoff make delivery reliable without letting a dead endpoint retry forever or lose the record of what happened.
    categories: ["reliability", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0026
    title: Portal webhook administration
    significance: shall
    description: The system shall provide a portal page, behind the OIDC session, listing the registered webhook subscribers with their event filters and the recent delivery attempts with their state, attempt count, and response status.
    rationale: Webhook integrations fail silently; an operator needs to see which subscriber is failing and why without querying the database.
    categories: ["functional-suitability", "interaction-capability"]
    revision: 0.1.0

  - id: GW_0027
    title: Audit ledger streaming export
    significance: shall
    description: The system shall expose an authenticated endpoint that streams audit ledger entries as newline-delimited JSON in ascending ledger sequence, accepting a cursor that excludes every entry up to and including that sequence and a bounded page size, and returning the sequence to resume from.
    rationale: Compliance evidence belongs in the organisation's SIEM, not only in the portal; a newline-delimited stream with an explicit cursor lets an external collector ingest the ledger incrementally without holding the whole table in memory.
    categories: ["functional-suitability", "security"]
    revision: 0.1.0

  - id: GW_0028
    title: Audit export sinks with at-least-once delivery
    significance: shall
    description: The system shall support registering audit export sinks, each tracking its own position in the append-only ledger, and shall deliver the entries after a sink's position to that sink at least once, advancing the position only after the delivery has been durably recorded.
    rationale: A push consumer must never silently miss a ledger entry; making the durable delivery record precede the position advance turns a crash into a duplicate rather than a gap, and per-sink positions keep consumers independent of each other.
    categories: ["functional-suitability", "reliability", "security"]
    revision: 0.1.0

  - id: GW_0029
    title: Audit export cursor replay
    significance: shall
    description: The system shall allow an administrator to set an audit export sink's position to any earlier ledger sequence, after which the entries following that sequence are delivered to the sink again.
    rationale: A consumer that lost or corrupted its copy of the ledger needs the gateway to re-send history; expressing replay as a position reset keeps one delivery path instead of a separate replay mode.
    categories: ["functional-suitability", "reliability"]
    revision: 0.1.0

  - id: GW_0030
    title: Portal audit export surface
    significance: shall
    description: The system shall provide, on the portal audit page behind the OIDC session, a control that downloads the ledger export stream and a listing of the registered audit export sinks with their target and current ledger position.
    rationale: An operator must be able to hand an auditor a ledger extract and to see whether each configured sink is keeping up, without database or raw HTTP access.
    categories: ["functional-suitability", "interaction-capability"]
    revision: 0.1.0

  - id: GW_0031
    title: Snapshot retention policy evaluation
    significance: shall
    description: The system shall evaluate snapshots against a retention policy, configurable globally and per marketplace, that selects a snapshot held in quarantine longer than a configured age and a non-approved snapshot superseded by a later approved snapshot of the same marketplace, and shall exclude any snapshot served through the git facade within a configured idle period.
    rationale: Quarantine grows with every upstream commit; stated criteria let an operator reclaim snapshot rows and git storage predictably instead of by hand, and per-marketplace policies keep a high-churn marketplace from dictating the retention of the rest.
    categories: ["functional-suitability", "maintainability"]
    revision: 0.1.0

  - id: GW_0032
    title: Snapshot soft delete with restore window
    significance: shall
    description: The system shall delete a snapshot selected by retention, or by an administrator, by marking it deleted with the reason and the time after which it may be purged, leaving its vetting state unchanged, and shall restore the snapshot on request at any time before that purge time.
    rationale: Deletion driven by a policy must be recoverable; marking the snapshot instead of removing it makes a wrong criterion a reversible mistake, and keeping the vetting state means the record of what was held, approved, or rejected survives the deletion.
    categories: ["functional-suitability", "reliability"]
    revision: 0.1.0

  - id: GW_0033
    title: Approved snapshots are never eligible for deletion
    significance: shall
    description: The system shall never select an approved snapshot for retention deletion and shall refuse an administrator's request to delete one, so that content published to the git facade cannot be removed by any retention path.
    rationale: The gateway's core promise is that served content is an approved, SHA-pinned snapshot; a retention policy that could reach published content would break clones and the provenance of what consumers already fetched.
    categories: ["security", "reliability", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0034
    title: Scheduled hard-delete compaction
    significance: shall
    description: The system shall run a scheduled compaction that permanently removes each soft-deleted snapshot whose restore window has elapsed, deleting both its record and the pinned commit reference in the marketplace's quarantine repository so the unreachable git objects are reclaimed, and shall leave soft-deleted snapshots whose window has not elapsed untouched.
    rationale: Soft deletion alone reclaims nothing; separating the permanent removal into its own pass is what makes the restore window meaningful, and reclaiming git storage is the point of retention.
    categories: ["functional-suitability", "performance-efficiency"]
    revision: 0.1.0

  - id: GW_0035
    title: Retention actions are audit-logged
    significance: shall
    description: The system shall append every retention action — the outcome of a policy evaluation, a soft deletion with its reason, a restore, and a permanent removal — to the append-only audit ledger with the acting identity, the marketplace, and the snapshot commit SHA.
    rationale: Deletion is the most consequential thing the gateway does to its own content; an auditor must be able to reconstruct what was removed, why, and on whose authority.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0036
    title: Portal snapshot deletion surface
    significance: shall
    description: The system shall show, on the portal page listing a marketplace's snapshots behind the OIDC session, whether a snapshot is deleted together with the time until which it can be restored, and shall offer controls to delete a snapshot and to restore a deleted one.
    rationale: An operator who sees a snapshot vanish from the retention pass needs to recognise a mistake and undo it within the window without database access.
    categories: ["functional-suitability", "interaction-capability"]
    revision: 0.1.0

  - id: GW_0037
    title: Ordered vetting connector chain at ingestion
    significance: shall
    description: The system shall run, at ingestion of a snapshot, an ordered chain of vetting connectors against the quarantined content pinned to the snapshot's commit SHA, and shall record for that chain run each connector's verdict together with its findings, each finding carrying a rule identifier, a severity, a location and a message.
    rationale: Vetting must be evidence attached to the exact bytes a reviewer decides on; running the chain at ingestion against the SHA-pinned quarantine content and recording a verdict per connector and run makes the evidence reproducible, comparable between snapshots, and reusable by a later re-run.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0038
    title: Fail-closed vetting chain aggregation
    significance: shall
    description: The system shall aggregate a chain run to a cleared outcome only when every connector in the chain returned a passing or warning verdict, and shall aggregate to a blocked outcome otherwise, counting a connector that fails, that reports an unfinished verdict, that raises an error, or that exceeds its time limit as blocking, and counting a snapshot with no recorded chain run as blocked.
    rationale: A vetting chain whose failure mode is to let content through is worse than none; treating a crash, a timeout and an absent run as blocking removes every path by which a snapshot reaches the facade without evidence.
    categories: ["security", "reliability"]
    revision: 0.1.0

  - id: GW_0039
    title: Secret scanning connector
    significance: shall
    description: The system shall provide a built-in vetting connector that scans the textual content of a snapshot for credential material — including cloud access keys, private key blocks, forge and messaging service tokens, and assignment-shaped high-entropy values — and returns a failing verdict with a finding located at the offending path for each match of high severity.
    rationale: Credentials committed into a skill repository are exfiltrated to every developer who installs it and are the most mechanically detectable class of harmful content, so they are the first thing the chain should catch.
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0040
    title: Prompt-injection heuristic connector
    significance: shall
    description: The system shall provide a built-in vetting connector that scans a snapshot's Markdown instruction content for known prompt-injection markers — including instruction-override phrasing, attempts to disclose the system prompt, references to credential file locations, instructions to conceal actions from the user or reviewer, and invisible or bidirectional control characters — and returns a failing verdict with a finding located at the offending path for each match of high severity.
    rationale: Skill instructions are prose that executes with the agent's privileges (threat T1); pattern heuristics cannot prove content safe but reliably surface the known markers a reviewer would otherwise have to find by reading every file.
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0041
    title: Approval gate on the vetting outcome
    significance: shall
    description: The system shall refuse to approve a snapshot whose effective vetting outcome is blocked, shall name in the refusal both the connectors that blocked and every blocking finding that no active waiver covers, and shall approve such a snapshot only once an active waiver covers each of those findings.
    rationale: Recording verdicts without acting on them turns vetting into decoration; requiring an active, scoped waiver per blocking finding makes accepting a blocked snapshot a deliberate act aimed at exactly what was found, so a finding nobody examined can never ride along with one that was justified.
    categories: ["security", "functional-suitability"]
    revision: 0.2.0

  - id: GW_0042
    title: Portal vetting surface
    significance: shall
    description: The system shall show, in the portal behind the OIDC session, each snapshot's effective chain outcome together with every connector's verdict and its findings, marking each finding a waiver currently suppresses, and shall refuse approval of a snapshot whose effective outcome is blocked.
    rationale: The reviewer is the control the whole gateway rests on; the evidence and the consequence of ignoring it must both be in front of that person at the moment of the decision, not in a log.
    categories: ["interaction-capability", "security"]
    revision: 0.2.0

  - id: GW_0043
    title: Vetting actions are audit-logged
    significance: shall
    description: The system shall append every chain run outcome and every connector verdict to the append-only audit ledger with the marketplace, the snapshot commit SHA, and the acting identity.
    rationale: An auditor asking why a snapshot with findings is being served must be able to answer it from the ledger alone, without reading the vetting tables or trusting the portal.
    categories: ["security", "functional-suitability"]
    revision: 0.2.0

  - id: GW_0044
    title: Scoped, expiring vetting waivers
    significance: shall
    description: The system shall allow a reviewer to record a waiver that accepts one vetting finding rule identifier on one marketplace, scoped either to a single snapshot commit SHA or to a path within the marketplace, and shall reject a waiver that omits a justification, an approving identity, or an expiry instant in the future.
    rationale: An accepted risk that is not narrow, attributed, justified and temporary is indistinguishable from a disabled control; refusing an unbounded or unexplained waiver at the point of creation is what keeps every acceptance reviewable.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0045
    title: Waivers suppress findings in the effective vetting outcome
    significance: shall
    description: The system shall compute a snapshot's effective vetting outcome from its latest recorded chain run with every finding covered by an active waiver excluded from the verdict it belongs to, shall leave the recorded run itself unchanged, shall report the outcome as cleared-with-waivers rather than cleared whenever a waiver suppressed a finding of that run, and shall keep a non-clearing verdict that carries no findings blocking.
    rationale: Waiving a finding must change the gate, not the record; deriving the outcome rather than rewriting the run keeps the raw evidence intact for an auditor, and naming the waived case separately stops an accepted risk from reading as a clean chain.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0046
    title: Waiver expiry and revocation restore the block
    significance: shall
    description: The system shall decide whether a waiver is active at the instant a snapshot's effective vetting outcome is computed, and shall treat a waiver whose expiry has passed or that has been revoked as suppressing nothing, so that the snapshot's effective outcome reverts to blocked and approval is refused again without any scheduled pass having to run.
    rationale: An exception that outlives its justification is a permanent hole; evaluating expiry at decision time makes the reversion unconditional rather than dependent on a scheduler that may be disabled, delayed, or missing.
    categories: ["security", "reliability"]
    revision: 0.1.0

  - id: GW_0047
    title: Portal waiver management surface
    significance: shall
    description: The system shall let a reviewer, in the portal behind the OIDC session, create a waiver for a specific finding from the snapshot review surface by supplying a justification, a scope and an expiry, and shall list a marketplace's waivers with their rule, scope, justification, approver, expiry, and whether each is still active.
    rationale: A waiver that can only be written through the API is a waiver nobody reviews; putting creation next to the finding it accepts and the list next to the content it affects is what makes an accepted risk visible to the next reviewer.
    categories: ["interaction-capability", "security"]
    revision: 0.1.0

  - id: GW_0048
    title: Waiver lifecycle is audit-logged
    significance: shall
    description: The system shall append to the append-only audit ledger the creation of every waiver with its rule, scope and expiry, the revocation of a waiver, the first observation that a waiver has expired, and every waiver that suppressed a finding for an approval, each with the marketplace and the acting identity.
    rationale: An auditor asking why a snapshot with a critical finding is being served must be able to read the accepted risk, who accepted it, and until when, from the ledger alone.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0049
    title: Continuous re-vetting of approved snapshots
    significance: shall
    description: The system shall re-run the vetting chain over already-approved snapshots on a configurable schedule, selecting the snapshots whose most recent chain run is oldest in bounded batches so that no pass re-vets the whole estate, shall record each pass as a new chain run carrying its trigger and the identity and version of every connector in the chain, shall leave the snapshot's own state unchanged by the run itself, and shall additionally re-vet a named snapshot or every approved snapshot of a named marketplace on demand.
    rationale: An approval is a judgement made against the evidence of one day; connectors gain rules and acceptances lapse, so an estate whose approvals are never re-examined slowly becomes a set of unverified assertions. Oldest-first bounded batches make the cost proportional and the coverage fair, and the on-demand pass is how an updated scanner rule set is turned into fresh evidence now.
    categories: ["security", "reliability"]
    revision: 0.1.0

  - id: GW_0050
    title: Auto-quarantine of a violating approved snapshot
    significance: shall
    description: The system shall, when a re-vetting run's effective outcome computed against the waivers active at that instant objects to the content of an approved snapshot and the configured re-vetting mode is enforcing, move that snapshot to a revoked state, remove every published git reference through which its content was reachable so that the git facade no longer serves it, leave the quarantined copy untouched, and refuse to serve or re-publish it again until a fresh approve decision is recorded against it through the ordinary approval gate.
    rationale: Content that has become unacceptable must stop being served without waiting for someone to notice, and the retraction must be an explicit state rather than a silent deletion so that a consumer's next fetch fails loudly instead of quietly returning stale content; requiring a fresh decision to republish is what stops an automatic retraction from being undone automatically.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0051
    title: Warn-only re-vetting mode
    significance: shall
    description: The system shall provide a re-vetting mode, and shall use it by default, in which a re-vetting violation on an approved snapshot is recorded and announced in full but the snapshot keeps its approved state and its published references, so that no snapshot is ever unpublished while that mode is in force.
    rationale: Auto-quarantine retracts content every consuming team already depends on, so an upgrade must never start doing it; a mode that produces the same evidence without acting lets an operator measure the blast radius of a policy before granting it the power to take content away.
    categories: ["reliability", "security"]
    revision: 0.1.0

  - id: GW_0052
    title: An inconclusive re-vetting run never revokes
    significance: shall
    description: The system shall distinguish a re-vetting run that blocks because a connector objected to the content from one that blocks only because a connector errored, timed out, has not answered, or produced no verdict at all, shall record the latter as inconclusive and leave the snapshot approved and served whatever the re-vetting mode, and shall continue to treat every such run as blocking for the purposes of approving, re-approving or publishing that snapshot.
    rationale: A broken connector is evidence about the scanner and not about the content, and treating it as grounds for retraction would let a single scanner outage revoke an entire estate at once — turning a scanner bug into an outage of exactly the content the gateway exists to serve. Nothing is weakened, because fail-closed still governs every path that publishes.
    categories: ["reliability", "security"]
    revision: 0.1.0

  - id: GW_0053
    title: Re-vetting violations are announced with their affected consumers
    significance: shall
    description: The system shall emit a lifecycle event when a re-vetting run finds a violation on an approved snapshot and a further lifecycle event when a snapshot is revoked, and shall report, from the append-only fetch ledger, every authenticated identity that received that snapshot's content through the git facade together with how often and when it last did.
    rationale: A retroactive violation is only actionable if the operator can see who already has the content; the ledger has recorded exactly that since the first fetch, so the blast radius is a report rather than an investigation, and an event is what lets a receiver act without polling.
    categories: ["security", "interaction-capability"]
    revision: 0.1.0

  - id: GW_0054
    title: Re-vetting and revocation are audit-logged
    significance: shall
    description: The system shall append to the append-only audit ledger the outcome of every re-vetting run with its trigger, each retroactive violation with the objecting connectors, the rules behind it and the mode in force, one entry per identity affected by that violation, and every revocation and unpublication with the acting identity and the marketplace.
    rationale: A retraction of content that was previously approved is the most consequential thing the gateway does on its own; an auditor must be able to read what was found, when, under which policy, who was affected and what was taken away, from the ledger alone.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0055
    title: Portal re-vetting and revocation surface
    significance: shall
    description: The system shall show, in the portal behind the OIDC session, that a snapshot has been revoked and why, the findings of the re-vetting run that revoked it, the identities that had fetched its content, and a control that re-vets a snapshot on demand.
    rationale: A retraction nobody can see the reason for is indistinguishable from an outage; putting the violation, its findings and the affected identities on the page that shows the snapshot is what lets a reviewer decide between waiving, rejecting and re-approving without leaving the portal.
    categories: ["interaction-capability", "security"]
    revision: 0.1.0

  - id: GW_0056
    title: Per-marketplace sync mode
    significance: shall
    description: The system shall record for every marketplace exactly one sync mode of on-demand, scheduled, or webhook, shall default a newly registered marketplace to on-demand, shall let an authorized operator change the mode at any time, and shall route every sync-triggered ingestion through the same quarantine pipeline as a manual one, so that a snapshot lands held or rejected and no sync mode can approve, publish, or otherwise bypass the approval gate.
    rationale: How content arrives is an operational policy per upstream, but what happens to it once it arrives is the trust model; separating the two is what lets automation be added without widening any boundary.
    categories: ["functional-suitability", "security"]
    revision: 0.1.0

  - id: GW_0057
    title: Scheduled upstream polling
    significance: shall
    description: The system shall, on a configurable interval that an operator can disable, ingest the marketplaces whose sync mode is scheduled in bounded batches ordered by the least recently attempted first, shall stamp every attempt whether it succeeded or failed so one unreachable upstream cannot monopolize the batch order, shall continue the batch when one marketplace's ingestion fails, and shall retry a failed marketplace on a later pass.
    rationale: An estate of many upstreams goes stale unless polling is the gateway's job; oldest-first bounded batches make the cost proportional and the coverage fair, and per-attempt stamping keeps one dead upstream from starving the rest.
    categories: ["functional-suitability", "reliability"]
    revision: 0.1.0

  - id: GW_0058
    title: Webhook-triggered ingestion
    significance: shall
    description: The system shall expose, for a marketplace whose sync mode is webhook, an inbound endpoint that a forge push webhook can call, shall authenticate each request solely by an HMAC-SHA256 signature of the exact raw request body verified in constant time against a per-marketplace secret that the gateway generated and returned exactly once when the mode was enabled, shall treat a valid signature only as a trigger to ingest the registered upstream URL's default branch and never read a URL, ref, or commit from the request payload, shall bound the accepted body size, and shall reject a request with a missing or invalid signature, for an unknown marketplace, or for a marketplace not in webhook mode without ingesting anything.
    rationale: A push event removes polling latency, but the endpoint is reachable without an OIDC session, so its authentication must be cryptographic and its authority must be nil — the worst a forged-but-signed request can cause is a fetch of the already-registered upstream into quarantine, which the schedule would have done anyway.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0059
    title: Upstream outage resilience
    significance: shall
    description: The system shall serve the last approved snapshot through the git facade regardless of upstream health — a scheduled or webhook-triggered ingestion that fails because the upstream is unreachable shall be logged and retried later, and shall not alter any snapshot state, any published reference, or the outcome of any concurrent facade fetch.
    rationale: The gateway exists so consumers depend on vetted copies rather than on upstream availability; automation that polls upstream more often must not couple serving to upstream uptime.
    categories: ["reliability", "security"]
    revision: 0.1.0

  - id: GW_0060
    title: Sync activity is audit-logged
    significance: shall
    description: The system shall append to the append-only audit ledger every sync mode change with the acting identity and the new mode, and every sync-triggered ingestion with the snapshot SHA and a trigger identity that distinguishes the scheduler and the webhook from a human operator, and shall emit the ordinary snapshot-ingested lifecycle event for every sync-triggered ingestion.
    rationale: Automation must not make ingestion less accountable than a click; an auditor must be able to read from the ledger alone which content arrived, when, and on whose or what authority.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0061
    title: Global virtual catalog
    significance: shall
    description: The system shall synthesize and serve through the git facade, under a configurable reserved name, a catalog repository whose tree contains the currently served snapshot of every marketplace under a subdirectory named after that marketplace, together with one merged marketplace manifest whose plugin names are prefixed with their marketplace's name and whose plugin sources are all relative paths into those subdirectories, and shall compose the catalog exclusively from content each marketplace's published repository is serving at that moment, so that nothing held, rejected, or revoked can appear in it.
    rationale: One URL for the whole governed estate is the largest consumer-experience win available, and deriving it strictly from what is already published means the catalog can never widen what the approval gate allows.
    categories: ["functional-suitability", "security"]
    revision: 0.1.0

  - id: GW_0062
    title: Catalog freshness on publication changes
    significance: shall
    description: The system shall regenerate the catalog when a snapshot is published by an approval and when a snapshot's published references are removed by a revocation, without operator action in either case, shall keep every earlier catalog composition unreachable from the catalog's advertised references so that retracted content stops being fetchable from the catalog as well, shall serve a catalog with an empty plugin list rather than nothing when no marketplace is serving, and shall additionally regenerate on demand, with a regeneration failure never failing the approval or revocation that triggered it.
    rationale: A catalog that lags a retraction re-serves exactly the content the retraction removed, so freshness on unpublication is a security property and not a convenience; an empty catalog must stay distinguishable from a broken gateway.
    categories: ["security", "reliability"]
    revision: 0.1.0

  - id: GW_0063
    title: Catalog provenance, audit, and the reserved name
    significance: shall
    description: The system shall record in each catalog revision the marketplace name and upstream commit SHA of every constituent and answer them through the API for the revision currently served, shall record fetches of the catalog through the git facade in the append-only ledger under the catalog's name like any marketplace, shall append manual catalog regenerations to the ledger with the acting identity, and shall refuse to register a marketplace under the catalog's reserved name.
    rationale: An aggregate is only trustworthy if what exactly it contains, and who fetched it, remain answerable from the gateway's own records; the reserved name keeps the catalog's facade path from ever being claimable by a registrant.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0064
    title: Marketplace-scoped access tokens
    significance: shall
    description: The system shall let a personal access token carry a list of marketplace names — the virtual catalog's name being a valid entry — shall validate every scope against the registered marketplaces and the catalog name when the token is created, shall refuse a git facade request from a scoped token for any marketplace outside its list with an answer indistinguishable from that for a marketplace that does not exist, and shall treat a token without scopes as granting every marketplace, so that existing tokens keep their behavior.
    rationale: A leaked CI token limited to one marketplace is an incident contained to that marketplace; answering out-of-scope exactly like not-found keeps a scoped token from doubling as a directory of what else the gateway governs.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0065
    title: Access token expiry
    significance: shall
    description: The system shall let a token carry an expiry timestamp, shall refuse an expired token at authentication time exactly as it refuses a revoked one, deciding by comparing the stamp to the current instant with no scheduled process involved, shall let an operator cap the maximum lifetime accepted at creation through configuration, and shall refuse a creation request beyond the cap rather than silently shortening it.
    rationale: A credential that dies on its own bounds the window a leak matters; deciding expiry by comparison at use means no sweep can be late and no scheduler outage can keep a dead token alive, and refusing rather than clamping keeps the issued grant exactly what was asked for.
    categories: ["security", "reliability"]
    revision: 0.1.0

  - id: GW_0066
    title: Access token rotation
    significance: shall
    description: The system shall let a token's owner, and only its owner, rotate a live token — producing a new secret returned exactly once while keeping the name, the scopes and the same expiry deadline, revoking the old token before the new one is issued so a failure between the two steps leaves no live secret rather than two, recording which token the new one replaced — and shall refuse to rotate a revoked or expired token.
    rationale: Rotation exists so a possibly-exposed secret can be retired without renegotiating the grant; it must therefore be able to change only the secret, or it becomes a privilege-escalation and lifetime-extension path wearing a hygiene feature's name.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0067
    title: Per-token fetch attribution
    significance: shall
    description: The system shall record, in every git facade entry of the append-only ledger, the identity of the token that authenticated the request alongside the principal, shall carry that attribution through the ledger listing and the audit export, and shall append token creation, revocation and rotation to the ledger with the acting identity, the token's name and its scopes.
    rationale: A principal with several tokens is several distinct credentials; an auditor tracing a leak needs to know which one fetched what, and the lifecycle entries are what let the trace end at when that credential was born, rotated, or killed.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0068
    title: Scoped admin roles with deny-by-default enforcement
    significance: shall
    description: The system shall provide three delegated-administration roles for the web surface — a global admin, an approver scoped to one marketplace, and a read-only auditor, composing upward so an admin may do everything either other role may — behind a configuration switch that defaults to off with every authorization check passing, and shall, once the switch is enabled, refuse with an authorization error every REST API mutation and every audit-ledger and operational-listing read to a session holding no applicable role, while leaving the browsing surface and a session's own token management open to any authenticated session.
    rationale: The portal's login was the only privilege there was, so delegating curation needs rights that are granted rather than implied by authentication; defaulting the switch to off means an upgrade can never lock an existing deployment out of its own gateway, and deny-by-default once enabled means a privileged endpoint added without a classification fails shut rather than open.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0069
    title: Per-marketplace approver scoping
    significance: shall
    description: The system shall scope an approver grant to exactly one marketplace and accept from its holder ingestion, approval, rejection, re-vetting and waiver operations only for content of that marketplace, resolving the owning marketplace on the gateway's side from the addressed snapshot or waiver where the route carries an id rather than a marketplace name, and shall refuse the holder the same operations for any other marketplace.
    rationale: Delegation is only containment if the boundary holds on every route; resolving the marketplace from the addressed resource rather than trusting the route shape closes the confused-deputy path where an approver of one marketplace reaches another's content through a bare snapshot or waiver id.
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0070
    title: Auditor read-only guarantee
    significance: shall
    description: The system shall accept from an auditor reads of the append-only ledger, its export stream, the webhook subscriber, delivery and audit sink listings, and the retention candidates, and shall refuse an auditor every REST API mutation.
    rationale: Compliance review needs to see everything that happened without being able to change what happens next; a read-only role that can mutate anything at all is an escalation path wearing an oversight badge.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0071
    title: Audited role grants with configuration-bootstrapped admins
    significance: shall
    description: The system shall store role grants in its database and let only admins read and manage them through the API while enforcement is enabled, shall require an approver grant to name a marketplace registered at grant time and forbid admin and auditor grants from naming one, shall refuse a duplicate grant, shall append every grant and revocation to the append-only ledger with the acting identity, the target principal, the role and the marketplace, shall additionally treat principals listed in configuration as admins that no API call can revoke, and shall report a session's effective roles and whether enforcement is enabled through the session identity endpoint.
    rationale: Who may do what must be answerable from the gateway's own records, and changing it must not need a redeploy; the configuration-listed admins are the escape hatch that survives any bad grant edit, so the API must not be able to take them away, and the identity endpoint is how the portal and CLI adapt to what the caller may do.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0072
    title: Container image publication by digest
    significance: shall
    description: The system's release automation shall publish the smoke-tested container image to the project's public registry namespace addressable by immutable digest, tagging main-branch builds with the commit SHA and a moving latest tag and tagged releases with their version, shall publish only from push events so that scheduled and manually dispatched builds can never move a published tag, shall surface the pushed image digest in the build output, and shall attach the build's CycloneDX SBOM to the published image as a registry attestation.
    rationale: Downstream platforms mirror images into their own registries pinned by digest, so an unpublished image is an undeliverable product; publishing only what the same workflow just smoke-tested, only from push events, keeps every published digest traceable to a reviewed commit, and the attested SBOM lets consumers verify the inventory of exactly the bytes they pinned.
    categories: ["security", "flexibility"]
    implementation: configuration
    revision: 0.1.0

  # GW_0073 and GW_0074 are reserved by an in-flight change on another branch.

  - id: GW_0075
    title: Adoption reporting from the fetch ledger
    significance: shall
    description: The system shall answer, from the append-only fetch ledger alone and without recording anything new, an adoption report aggregating the facade fetches of a caller-chosen bounded time window into, per marketplace, the number of content-transferring fetches, the number of distinct fetching identities, the time of the most recent fetch, and a per-snapshot-SHA breakdown carrying the same measures with each SHA marked as the currently served tip or not, counting only entries that transferred content and attributing by the authenticated identity the ledger records, and shall restrict the report to callers permitted to read the ledger.
    rationale: The ledger has held the answer to "who runs what, and how much" since the first fetch; aggregating it read-only turns compliance data into an operator dashboard without touching what is recorded, and gating it like the ledger keeps identity enumeration inside the same authorization boundary. The gateway has no team concept — identity-to-team mapping is the identity provider's knowledge — so attribution is by identity and token, deliberately.
    categories: ["functional-suitability", "security"]
    revision: 0.1.0

  - id: GW_0076
    title: Staleness reporting against the served tip
    significance: shall
    description: The system shall report, from the append-only fetch ledger and the published repositories' currently served references, every identity whose most recent content-transferring fetch of a marketplace received a commit SHA that is not that marketplace's currently served tip, including — with an absent tip — identities whose most recent fetch is of a marketplace that is no longer serving at all, each entry carrying the identity, the marketplace, the SHA last received, when it was received, and the served tip it diverges from, and shall restrict the report to callers permitted to read the ledger.
    rationale: A consumer pinned to a superseded or retracted snapshot is running exactly the content a later approval or revocation moved away from, and the served reference the facade answers from is the only tip the report can never disagree with; naming the identities is what makes a retraction actionable, which is why the read is gated like the ledger itself.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0077
    title: Always-recorded gateway metrics and observations
    significance: shall
    description: The system shall record, through its metrics and observation registries and regardless of whether telemetry export is enabled, an ingestion timing observation tagged with its outcome, an approval-decision observation tagged with the decision taken, and a facade fetch counter tagged with the fetch event kind, all named under the skills_gateway prefix and carrying only fixed-vocabulary tags, so that enabling OpenTelemetry export in a deployment publishes them without any code or configuration change to the gateway itself, and shall not attempt any telemetry export unless a deployment explicitly enables it.
    rationale: Instrumentation that must be added at incident time is instrumentation that is missing at incident time — recording always and exporting opt-in gives every deployment the same numbers the moment it turns on a collector, while fixed-vocabulary tags keep an estate of any size from exploding a time-series backend, and the export default keeps builds and tests free of OTLP attempts.
    categories: ["functional-suitability", "reliability"]
    revision: 0.1.0

  - id: GW_0078
    title: Adoption page in the admin portal
    significance: shall
    description: The system's admin portal shall present, on a page of its own, the adoption report — the windowed per-marketplace fetch measures with their per-snapshot-SHA breakdown, over a caller-selectable window — and the staleness report of identities not on the served tip, each with explicit loading, empty and error states, so that an operator can read both without leaving the portal.
    rationale: The reports exist to be acted on by the operator already working in the portal; a dashboard that requires the API is a dashboard the retraction decision is made without.
    categories: ["functional-suitability", "interaction-capability"]
    revision: 0.1.0

  - id: GW_0079
    title: Client setup wizard
    significance: shall
    description: The system's portal shall offer, on a marketplace's detail page, a client setup wizard that composes for that marketplace the client marketplace-add command, a git credential-helper configuration block and a personal-access-token usage snippet, deriving every URL from the browsing origin and the marketplace's facade clone path with no additional server configuration, shall let the user mint a personal access token from inside the wizard through the existing show-once token flow with the cleartext substituted into the snippets only while the wizard remains open, and shall never display the secret of any previously issued token.
    rationale: A consumer's first contact with the gateway is copy-paste, and composing the exact commands from where the browser already is removes the transcription errors a hand-assembled URL invites; holding the show-once line inside the wizard keeps convenience from becoming a second place secrets live.
    categories: ["interaction-capability", "security"]
    revision: 0.1.0

  - id: GW_0080
    title: Snapshot file inspection
    significance: shall
    description: The system shall let a reviewer read, for any snapshot, the file tree and individual file contents of exactly the commit the snapshot pins, resolved through the quarantine repository's object store with paths addressed only within the pinned commit's tree, shall bound the tree listing and mark it when cut, shall return a file exceeding a fixed size limit truncated with an explicit truncation marker and a file detected as binary as metadata without text content, shall answer a path absent from the tree — including any traversal-shaped path — with not-found, and shall, while role enforcement is enabled, refuse these reads to a session that is neither an admin nor an approver of the snapshot's marketplace.
    rationale: Approval is a content decision, so the reviewer must see the exact bytes the pin names rather than any working tree or upstream state; addressing reads through the commit tree removes the filesystem traversal surface entirely, the caps keep a hostile upstream from weaponizing the reviewer's own browser, and the reads expose held quarantine content, which is precisely the material the approver role scopes.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0081
    title: Snapshot diff against the served baseline
    significance: shall
    description: The system shall report, for any snapshot, the difference between the commit it pins and the marketplace's currently served commit as resolved from the published repository's served tip — the added, modified and removed paths, and for text files a per-file textual diff subject to the same size and binary limits as file inspection — shall report, when the marketplace serves nothing, the absence of a baseline and every path as added, and shall apply the same role rule as file inspection.
    rationale: A reviewer deciding a successor snapshot is deciding a delta, and the honest baseline is what consumers actually receive — the served tip — not a database reconstruction that can disagree with the wire in exactly the retraction cases that matter; reporting no baseline outright beats fabricating an empty diff.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0082
    title: Reviewer preview pane in the portal
    significance: shall
    description: The system's portal shall present, for a snapshot on the marketplace detail page, a preview pane with the snapshot's file tree, the content of a selected file — rendering Markdown, including a skill's SKILL.md and the marketplace manifest, without interpreting embedded HTML and without executing or navigating into any fetched content — explicit indications for truncated and binary files, and a diff view against the served baseline distinguishing added, modified and removed paths and stating when no baseline is served, presenting loading, empty and error states throughout.
    rationale: The vetting chain's verdicts are evidence about the content, not the content; a reviewer who can walk the actual tree and the actual delta decides on what will ship rather than on a summary — and because the pane exists to inspect hostile content, it must render inertly by construction.
    categories: ["interaction-capability", "security"]
    revision: 0.1.0

  - id: GW_0083
    title: Declarative estate reconciliation
    significance: shall
    description: The system shall accept a declarative configuration block naming marketplaces, role grants, webhook subscribers and audit export sinks, shall reconcile the running estate to that declaration at application startup — after schema migration and before the web surface serves requests — and on demand through an administrative endpoint, shall apply only the differences between declared and actual state so that reconciling a converged estate performs no writes and appends nothing to the ledger, shall never delete, deregister or revoke an object absent from the declaration, and shall append every applied change to the append-only ledger under the same event name as its API equivalent, attributed to a distinct reconciler actor identity.
    rationale: A deployment defined entirely as code needs the estate to be part of that code, and a reconciler that converges rather than replays keeps the ledger meaningful — an operator reading it can tell declarative changes from interactive ones by actor, and a boot of an already-converged estate leaves no noise for export sinks to re-deliver; never touching undeclared objects means a lost configuration line can never retract content teams depend on.
    categories: ["security", "flexibility"]
    revision: 0.1.0

  - id: GW_0084
    title: Declared marketplaces pass the registration trust boundary
    significance: shall
    description: The system shall register a declared marketplace through the same validation as the administrative API — the marketplace name rules, the reserved catalog name, and the URL scheme allowlist — with the ingested ref remaining the gateway's decision because the declaration cannot express one, shall accept a declared sync mode of on-demand or scheduled applied through the same audited path as the API and refuse webhook mode as an entry failure, shall leave the stored sync mode untouched when the declaration omits one, and shall treat a declared marketplace whose stored upstream URL differs from the declared URL as a reconciliation failure rather than an update.
    rationale: Registration is the trust boundary and a second copy of it would drift into a hole, so the declaration must be another caller of the same gate; webhook sync mode is excluded because its inbound HMAC secret is generated and shown exactly once, which has no declarative form; and refusing URL drift keeps a configuration edit from swapping the supply chain underneath already-approved snapshots — a power the API itself deliberately does not have.
    categories: ["security"]
    revision: 0.1.0

  - id: GW_0085
    title: Declared role grants through the audited grant path
    significance: shall
    description: The system shall apply declared role grants through the same validation and the same audited path as the grants API — the role vocabulary, approver grants scoped to exactly one marketplace that exists at reconcile time whether declared in the same configuration or registered through the API, and global roles forbidding one — shall treat a grant whose marketplace does not exist as an isolated entry failure, and shall never revoke a grant absent from the declaration.
    rationale: Grants decide who may approve what, so the declarative path must be the audited path or the ledger stops answering who granted what; accepting API-registered marketplaces keeps adoption incremental instead of demanding the whole estate move to configuration at once, and additive-only means a trimmed declaration can never strip a working deployment of its administrators.
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0086
    title: Operator-supplied secrets for declared receivers
    significance: shall
    description: The system shall require a declared webhook subscriber or audit export sink to carry an operator-supplied signing secret, refusing a blank secret or one shorter than sixteen characters as an entry failure, shall never write a declared secret value to the log, the ledger, the reconciliation report or any API response, shall update the stored secret idempotently when the declared value changes — recording the rotation on the ledger without the value and making no write when the value is unchanged — and shall set an audit sink's ledger cursor only at creation, never on a later reconciliation.
    rationale: The API generates receiver secrets and shows them once, which has no declarative form, so the declarative form inverts the direction — the operator supplies the secret by reference and the gateway must treat it as write-only; the length floor keeps a typo from silently weakening every delivery signature, and leaving the cursor alone keeps a redeploy from re-delivering the entire ledger to a sink that had already caught up.
    categories: ["security", "reliability"]
    revision: 0.1.0

  - id: GW_0087
    title: Reconciliation failure isolation and reporting
    significance: shall
    description: The system shall start and serve even when a declared entry fails validation, shall continue reconciling the remaining entries when one fails, shall report each failed entry with its reason in the application log and as an entry on the append-only ledger for every reconciliation run in which it fails, shall answer the most recent reconciliation report — per entry, what was created, updated, unchanged or failed and why — through the API to auditors and admins, and shall restrict the on-demand reconciliation trigger to admins under role enforcement, recording each trigger on the ledger with the acting identity.
    rationale: A gateway's job is serving already-approved content, so a typo in a declaration must never take a working estate down in a crash loop — but a declaration that cannot converge is drift an operator has to see, so the failure is loud on every run in the ledger and the report rather than swallowed; the trigger is an administrative mutation like any other and is gated and recorded as one.
    categories: ["reliability", "security"]
    revision: 0.1.0

  - id: GW_0088
    title: Served webhook event registry
    significance: shall
    description: The system shall answer, read-only and without recording anything, the registry of snapshot lifecycle event names a webhook subscriber may filter on — exactly the set the dispatcher can emit, excluding the audit export event that only an export sink provisions — restricted to callers permitted to read webhook administration, and the system's portal shall compose a subscriber's event filter by selection from that served registry rather than free text, offering selection of every event at once and a type-ahead narrowing of the list, submitting the existing wire format unchanged, and shall mark a stored filter naming an event the registry does not contain.
    rationale: The filter is a membership test against a closed vocabulary the server owns and already rejects violations of, so the cost of a text box is not a wrong filter but an unusable form — the vocabulary can only be learned by guessing and reading the refusal, which is precisely the interaction the portal's disabled-until-valid rule exists to forbid. Serving the vocabulary lets the client mirror the server exactly, keeps the portal correct as the event set grows, and keeps the export event out of lifecycle subscriptions by construction rather than by comment.
    categories: ["functional-suitability", "interaction-capability"]
    revision: 0.1.0

  - id: GW_0089
    title: CEL policy deny rules as managed, declarable estate objects
    significance: shall
    description: The system shall manage named policy deny rules — each a name, a description, a CEL expression and an enabled flag — through an administrative API restricted to admins for mutation and to auditors and admins for reading, shall parse and type-check every submitted expression against the documented evaluation variables and refuse with a validation error any expression that does not compile to a boolean so that a non-compiling expression is never stored, shall refuse a duplicate rule name, shall append every rule creation, update and deletion to the append-only ledger with the acting identity, and shall accept declared policy rules in the declarative estate configuration reconciled additively and idempotently through the same validated, audited path as the API with a non-compiling declared expression isolated as an entry failure.
    rationale: A prohibition that lives in reviewers' heads is enforced unevenly and leaves no record, so rules must be data with an audited lifecycle; compiling at write time moves the failure to the operator who can fix it instead of the reviewer who cannot, and joining the declarative estate keeps a GitOps deployment able to define its whole policy surface as code without weakening the additive-only reconciliation contract.
    categories: ["security", "flexibility"]
    revision: 0.1.0

  - id: GW_0090
    title: Fail-closed CEL policy gate at approval
    significance: shall
    description: The system shall evaluate every enabled policy rule at the moment an approval is requested — after the vetting gate and before any state transition — over the snapshot's facts comprising its metadata, its file inventory, and its plugin and skill inventory including each skill's declared tools parsed from SKILL.md frontmatter, shall refuse the approval when any enabled rule evaluates to true, when any enabled rule fails to evaluate, or when the facts cannot be built — including malformed skill frontmatter and a file inventory exceeding its bound — naming every deciding rule in the refusal, shall leave a refused snapshot held and publish nothing, shall never let a disabled rule decide, and shall bound evaluation so that no expression or content can make the gate run unbounded.
    rationale: A deny rule is a standing organizational decision, so it must gate the decision moment itself rather than only content ingested after the rule existed; every error path must deny because an attacker who can provoke an evaluation error — hostile frontmatter, hostile content shape — would otherwise be switching the rule off, which is precisely the fail-open this gate exists to prevent, and the deliberate cost that a broken rule blocks approvals until fixed or disabled is made bearable by naming the rule in the refusal.
    categories: ["security", "reliability"]
    revision: 0.1.0

  - id: GW_0091
    title: Policy decisions recorded in provenance
    significance: shall
    description: The system shall append, for every approval refused by the policy gate, one entry per deciding rule to the append-only ledger naming the rule, the snapshot's commit SHA, the marketplace, the acting reviewer, and whether the rule matched or failed to evaluate, so that an auditor can answer from the ledger alone why an approval was refused and which rule decided it.
    rationale: Rules that decide invisibly cannot be audited, contested or tuned; the append-only ledger is the product's single provenance surface, and recording the deciding rule with its outcome distinguishes a policy match from a broken rule — the difference between "this content is prohibited" and "this rule needs fixing".
    categories: ["security", "functional-suitability"]
    revision: 0.1.0

  - id: GW_0092
    title: Read-only policy rule playground
    significance: shall
    description: The system shall evaluate, for callers permitted to approve the named snapshot, an arbitrary submitted CEL expression against a real snapshot's facts and answer whether it matched or why it failed to compile or evaluate, shall persist nothing, append nothing to the ledger and change no snapshot, rule or served state in doing so — on success and on every error path alike — and shall never echo snapshot content in the answer beyond the match outcome and the error description.
    rationale: The safe way to author an enforcing expression is to test it against the content it will judge before it can block anything, and the playground can only be trusted for that if it is provably inert — a playground that wrote state or leaked quarantined content would be a second, unaudited surface into the very content the gate quarantines.
    categories: ["security", "interaction-capability"]
    revision: 0.1.0
