# yaml-language-server: $schema=https://raw.githubusercontent.com/reqstool/reqstool-client/main/src/reqstool/resources/schemas/v1/software_verification_cases.schema.json

cases:
  - id: SVC_GW_0001
    requirement_ids: ["GW_0001"]
    title: Register a marketplace via the admin interface
    verification: automated-test
    description: |
      GIVEN a running gateway with no registered marketplaces
      WHEN an administrator registers a marketplace clone URL
      THEN the marketplace is listed as registered with that URL
    revision: "0.1.0"

  - id: SVC_GW_0002
    requirement_ids: ["GW_0002"]
    title: Ingest a marketplace into a held snapshot
    verification: automated-test
    description: |
      GIVEN a registered marketplace whose repository has a valid manifest
      WHEN ingestion runs
      THEN a snapshot identified by the upstream head commit SHA exists in state held
    revision: "0.1.0"

  - id: SVC_GW_0003
    requirement_ids: ["GW_0003"]
    title: Reject manifests with external plugin sources
    verification: automated-test
    description: |
      GIVEN a marketplace whose manifest declares a github, url, git-subdir, npm, or archive plugin source
      WHEN ingestion runs
      THEN the snapshot is rejected with a policy violation and cannot be approved
    revision: "0.1.0"

  - id: SVC_GW_0004
    requirement_ids: ["GW_0004"]
    title: Upstream changes never alter served content
    verification: automated-test
    description: |
      GIVEN an approved snapshot being served and a new commit pushed upstream
      WHEN ingestion fetches the update
      THEN clients still receive the previously approved snapshot and the new snapshot is held
    revision: "0.1.0"

  - id: SVC_GW_0005
    requirement_ids: ["GW_0005"]
    title: Approve a held snapshot with a recorded decision
    verification: automated-test
    description: |
      GIVEN a held snapshot
      WHEN a reviewer approves it
      THEN the snapshot state becomes approved and the decision record contains the reviewer identity and timestamp
    revision: "0.1.0"

  - id: SVC_GW_0006
    requirement_ids: ["GW_0006"]
    title: Clone an approved snapshot with a standard git client
    verification: automated-test
    description: |
      GIVEN an approved snapshot
      WHEN a standard git client clones the facade URL over HTTP
      THEN the clone succeeds and the content equals the approved snapshot
    revision: "0.1.0"

  - id: SVC_GW_0007
    requirement_ids: ["GW_0007"]
    title: Held content is not fetchable from the facade
    verification: automated-test
    description: |
      GIVEN one approved snapshot and one held snapshot for a marketplace
      WHEN a git client lists refs and fetches from the facade
      THEN only the approved refs are advertised and held objects cannot be fetched
    revision: "0.1.0"

  - id: SVC_GW_0008
    requirement_ids: ["GW_0008"]
    title: Every facade fetch is audit-logged
    verification: automated-test
    description: |
      GIVEN the facade is serving an approved snapshot
      WHEN a client fetches from it
      THEN an audit record with source address, repository, ref, commit SHA, and timestamp is appended
    revision: "0.1.0"

  - id: SVC_GW_0009
    requirement_ids: ["GW_0009"]
    title: Provenance of an approved snapshot is retrievable
    verification: automated-test
    description: |
      GIVEN an approved snapshot
      WHEN its provenance is queried
      THEN the upstream URL, upstream commit SHA, approver, and approval timestamp are returned
    revision: "0.1.0"

  - id: SVC_GW_0010
    requirement_ids: ["GW_0010"]
    title: List marketplaces and snapshot states via the admin interface
    verification: automated-test
    description: |
      GIVEN a gateway with registered marketplaces and snapshots in different states
      WHEN an administrator lists them via the administrative HTTP interface
      THEN all marketplaces and their snapshots are returned with their states
    revision: "0.1.0"

  - id: SVC_GW_0011
    requirement_ids: ["GW_0011"]
    title: Web access requires an OIDC session
    verification: automated-test
    description: |
      GIVEN a running gateway configured with an OIDC identity provider
      WHEN an unauthenticated browser request hits the administrative interface
      THEN it is redirected to the identity provider login, and the same request with an authenticated session succeeds
    revision: "0.1.0"

  - id: SVC_GW_0012
    requirement_ids: ["GW_0012"]
    title: Git facade requires a valid personal access token
    verification: automated-test
    description: |
      GIVEN an approved snapshot being served
      WHEN a git client fetches without a token or with a revoked/invalid token, and then with a valid token
      THEN the unauthenticated fetches are rejected and the valid-token fetch succeeds with the identity recorded in the audit log
    revision: "0.1.0"

  - id: SVC_GW_0013
    requirement_ids: ["GW_0013"]
    title: Tokens are shown once and stored hashed; revocation takes effect
    verification: automated-test
    description: |
      GIVEN an authenticated user
      WHEN they create a personal access token and later revoke it
      THEN the cleartext is returned only at creation, only a hash is persisted, and fetches with the revoked token are rejected
    revision: "0.1.0"

  - id: SVC_GW_0014
    requirement_ids: ["GW_0014"]
    title: SBOM endpoint serves the CycloneDX BOM
    verification: automated-test
    description: |
      GIVEN a running gateway built with SBOM generation
      WHEN the SBOM endpoint is requested
      THEN a CycloneDX document is returned listing the application's components
    revision: "0.1.0"

  - id: SVC_GW_0015
    requirement_ids: ["GW_0015"]
    title: Packaging artifacts are present and mutually consistent
    verification: automated-test
    description: |
      GIVEN the repository's packaging artifacts (Dockerfile and Helm chart)
      WHEN the packaging test validates them
      THEN the Dockerfile runs the native binary, and the chart's Deployment wires the image, the actuator health probes, and the PostgreSQL and OIDC configuration
    revision: "0.1.0"

  - id: SVC_GW_0016
    requirement_ids: ["GW_0016"]
    title: Non-allowlisted URL schemes are rejected at registration
    verification: automated-test
    description: |
      GIVEN a running gateway with its URL scheme allowlist configured
      WHEN an administrator attempts to register marketplaces with ssh, ext, and scheme-less clone URLs
      THEN each registration is rejected with HTTP 400 and no marketplace is persisted
    revision: "0.1.0"

  - id: SVC_GW_0017
    requirement_ids: ["GW_0017"]
    title: Consumer-supplied refs other than the default branch are rejected
    verification: automated-test
    description: |
      GIVEN a running gateway
      WHEN a registration request supplies a ref other than the upstream default branch
      THEN it is rejected with HTTP 400 and no marketplace is persisted, while omitting the ref or supplying the default branch registers normally
    revision: "0.1.0"

  - id: SVC_GW_0018
    requirement_ids: ["GW_0018"]
    title: Admin completes the register-ingest-approve workflow in the portal
    verification: automated-test
    description: |
      GIVEN a running gateway with PostgreSQL and an OIDC identity provider
      WHEN an administrator logs in through the browser, registers a marketplace, triggers ingestion, and approves the held snapshot in the portal
      THEN the portal shows the snapshot as approved and the underlying state matches
    revision: "0.1.0"

  - id: SVC_GW_0019
    requirement_ids: ["GW_0019"]
    title: User creates and revokes a token in the portal with show-once cleartext
    verification: automated-test
    description: |
      GIVEN an authenticated portal session
      WHEN the user creates a personal access token and later revokes it
      THEN the cleartext is displayed exactly once at creation, never again afterwards, and the revoked token is marked revoked
    revision: "0.1.0"

  - id: SVC_GW_0020
    requirement_ids: ["GW_0020"]
    title: Snapshot content lists plugins and their skills
    verification: automated-test
    description: |
      GIVEN an ingested snapshot whose manifest declares multiple plugins with skills under their source trees
      WHEN the snapshot's content is requested
      THEN every declared plugin is returned with the skills found under it and the snapshot's commit SHA
    revision: "0.1.0"

  - id: SVC_GW_0021
    requirement_ids: ["GW_0021"]
    title: Forge metadata is captured at registration when available
    verification: automated-test
    description: |
      GIVEN a marketplace URL whose forge exposes a repository metadata API
      WHEN the marketplace is registered
      THEN the project name, description, and last update time are stored with the marketplace
    revision: "0.1.0"

  - id: SVC_GW_0022
    requirement_ids: ["GW_0022"]
    title: Admin actions appear in the audit ledger with the acting identity
    verification: automated-test
    description: |
      GIVEN an authenticated administrator
      WHEN they register a marketplace, ingest it, approve the snapshot, and create and revoke a token
      THEN the ledger contains a record for each action with the administrator's identity
    revision: "0.1.0"

  - id: SVC_GW_0023
    requirement_ids: ["GW_0023"]
    title: Lifecycle events reach only the subscribers that filter for them
    verification: automated-test
    description: |
      GIVEN two webhook subscribers, one filtering for snapshot.approved and one filtering for snapshot.rejected
      WHEN a snapshot is ingested and then approved
      THEN a delivery exists for the approved subscriber carrying the event name, marketplace, snapshot id, and commit SHA, and none exists for the rejected-only subscriber
    revision: "0.1.0"

  - id: SVC_GW_0024
    requirement_ids: ["GW_0024"]
    title: Deliveries carry a verifiable HMAC-SHA256 signature and secrets are shown once
    verification: automated-test
    description: |
      GIVEN a webhook subscriber created through the admin API
      WHEN the cleartext secret is returned at creation and a delivery is signed with it
      THEN the signature header equals the HMAC-SHA256 of the exact request body under that secret, and no later API response exposes the secret
    revision: "0.1.0"

  - id: SVC_GW_0025
    requirement_ids: ["GW_0025"]
    title: A failing delivery is retried with backoff and finally marked failed
    verification: automated-test
    description: |
      GIVEN a subscriber whose endpoint rejects deliveries
      WHEN the dispatcher processes the delivery until the configured maximum number of attempts is reached
      THEN each attempt is recorded with its outcome, the next attempt is scheduled later than the previous one, and the delivery ends in the failed state
    revision: "0.1.0"

  - id: SVC_GW_0026
    requirement_ids: ["GW_0026"]
    title: Portal shows webhook subscribers and their delivery attempts
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a registered webhook subscriber with a delivery attempt
      WHEN the administrator opens the webhooks page
      THEN the subscriber is listed with its event filter and the delivery attempt is listed with its event and state
    revision: "0.1.0"

  - id: SVC_GW_0027
    requirement_ids: ["GW_0027"]
    title: Ledger entries stream as newline-delimited JSON from a cursor
    verification: automated-test
    description: |
      GIVEN an audit ledger holding several entries
      WHEN the export stream is requested first without a cursor and then with the cursor returned by that response
      THEN the first response carries one JSON object per line in ascending sequence with the resume cursor, and the second response contains only entries appended after it
    revision: "0.1.0"

  - id: SVC_GW_0028
    requirement_ids: ["GW_0028"]
    title: A sink receives the entries after its position exactly once per pass
    verification: automated-test
    description: |
      GIVEN a registered audit export sink whose position is behind the ledger head
      WHEN the exporter runs a pass and then runs a second pass with no new ledger entries
      THEN the first pass durably records one signed delivery carrying the entries after the position and advances the position to the last of them, and the second pass records no further delivery
    revision: "0.1.0"

  - id: SVC_GW_0029
    requirement_ids: ["GW_0029"]
    title: Resetting a sink position re-delivers the entries after it
    verification: automated-test
    description: |
      GIVEN an audit export sink whose position is at the ledger head after a completed export pass
      WHEN an administrator sets the sink position back to an earlier sequence and the exporter runs again
      THEN a new delivery is recorded carrying the entries following that sequence
    revision: "0.1.0"

  - id: SVC_GW_0030
    requirement_ids: ["GW_0030"]
    title: Portal audit page offers the export download and lists sinks
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a registered audit export sink
      WHEN the administrator opens the audit page
      THEN the ledger export download control is present and the sink is listed with its target and current ledger position
    revision: "0.1.0"

  - id: SVC_GW_0031
    requirement_ids: ["GW_0031"]
    title: Retention selects the aged and superseded snapshots and nothing else
    verification: automated-test
    description: |
      GIVEN a marketplace with a snapshot held beyond the configured quarantine age, a non-approved snapshot that a later approved snapshot has superseded, and a recently ingested held snapshot
      WHEN the retention policy is evaluated
      THEN the aged snapshot and the superseded snapshot are selected, each with the criterion that selected it, and the recent snapshot is not
    revision: "0.1.0"

  - id: SVC_GW_0032
    requirement_ids: ["GW_0032"]
    title: A deleted snapshot is marked, keeps its state, and is restorable within the window
    verification: automated-test
    description: |
      GIVEN a snapshot deleted through the administrative API
      WHEN the snapshot is read back and then restored before its purge time
      THEN the deletion carries a reason and a purge time in the future while the vetting state is unchanged, and after the restore the deletion marks are cleared
    revision: "0.1.0"

  - id: SVC_GW_0033
    requirement_ids: ["GW_0033"]
    title: An approved snapshot is never selected and cannot be deleted
    verification: automated-test
    description: |
      GIVEN an approved snapshot that is published to the git facade and would otherwise match every retention criterion
      WHEN the retention policy is evaluated and an administrator requests its deletion
      THEN the snapshot is not among the selected candidates, the deletion request is refused, and the snapshot remains undeleted
    revision: "0.1.0"

  - id: SVC_GW_0034
    requirement_ids: ["GW_0034"]
    title: Compaction removes expired soft deletions and their quarantine reference
    verification: automated-test
    description: |
      GIVEN one soft-deleted snapshot whose restore window has elapsed and one whose window has not
      WHEN the compaction pass runs
      THEN the expired snapshot's record and its pinned reference in the quarantine repository are gone, and the snapshot still inside its window is untouched
    revision: "0.1.0"

  - id: SVC_GW_0035
    requirement_ids: ["GW_0035"]
    title: The ledger records the retention decision, deletion, restore, and removal
    verification: automated-test
    description: |
      GIVEN a snapshot taken through a policy evaluation, a restore, and a compaction pass
      WHEN the audit ledger is read
      THEN it contains an entry for each of the evaluation outcome, the soft deletion with its reason, the restore, and the permanent removal, each with the acting identity and the snapshot commit SHA
    revision: "0.1.0"

  - id: SVC_GW_0036
    requirement_ids: ["GW_0036"]
    title: Portal deletes a snapshot and restores it
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a marketplace with an undecided snapshot
      WHEN the administrator deletes the snapshot from the marketplace detail page and then restores it
      THEN the snapshot is shown as deleted with its restore deadline, and after the restore it is shown as not deleted again
    revision: "0.1.0"

  - id: SVC_GW_0037
    requirement_ids: ["GW_0037"]
    title: Ingestion records a chain run with a verdict per connector
    verification: automated-test
    description: |
      GIVEN a registered marketplace whose upstream content is clean
      WHEN the marketplace is ingested and the snapshot's vetting record is read
      THEN a chain run exists for the snapshot's commit SHA holding one verdict per configured connector, in chain order, each with its findings
    revision: "0.1.0"

  - id: SVC_GW_0038
    requirement_ids: ["GW_0038"]
    title: A connector that throws blocks the snapshot instead of being skipped
    verification: automated-test
    description: |
      GIVEN a chain containing a connector that raises an exception
      WHEN a snapshot is ingested and its vetting record is read
      THEN the failing connector has an error verdict carrying the failure, the run outcome is blocked, and the snapshot is still held and unserved
    revision: "0.1.0"

  - id: SVC_GW_0039
    requirement_ids: ["GW_0039"]
    title: The secret scanner finds planted credentials and clears clean content
    verification: automated-test
    description: |
      GIVEN one upstream carrying a cloud access key and a private key block and one upstream carrying neither
      WHEN both are ingested
      THEN the first snapshot's secret-scanning verdict fails with a finding per planted credential naming the file it was found in, and the second snapshot's verdict passes
    revision: "0.1.0"

  - id: SVC_GW_0040
    requirement_ids: ["GW_0040"]
    title: The prompt-injection scanner finds planted markers in skill instructions
    verification: automated-test
    description: |
      GIVEN an upstream whose skill instructions contain instruction-override phrasing, a credential file path, and an invisible control character
      WHEN the marketplace is ingested
      THEN the prompt-injection verdict fails with a finding for each marker naming the instruction file, and a clean upstream's verdict passes
    revision: "0.1.0"

  - id: SVC_GW_0041
    requirement_ids: ["GW_0041"]
    title: A blocked snapshot is approved only once waivers cover every blocking finding
    verification: automated-test
    description: |
      GIVEN a snapshot whose chain run aggregated to a blocked outcome on more than one finding
      WHEN approval is requested with no waiver, then after one of the blocking findings is waived, and finally after all of them are
      THEN the first two requests are refused naming the findings still uncovered, the snapshot is neither approved nor served after either, and the third approves it
    revision: "0.2.0"

  - id: SVC_GW_0042
    requirement_ids: ["GW_0042"]
    title: Portal shows the verdicts and refuses approval while the outcome is blocked
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a marketplace whose snapshot has a blocked chain outcome
      WHEN the reviewer opens the snapshot's vetting detail
      THEN the connector verdicts and their findings are shown and the approval control is refused while the effective outcome is blocked
    revision: "0.2.0"

  - id: SVC_GW_0043
    requirement_ids: ["GW_0043"]
    title: The ledger records the chain run and the verdicts
    verification: automated-test
    description: |
      GIVEN a snapshot taken through a blocking chain run
      WHEN the audit ledger is read
      THEN it holds an entry for the chain run outcome and an entry per connector verdict, each with the marketplace, the commit SHA, and the acting identity
    revision: "0.2.0"

  - id: SVC_GW_0044
    requirement_ids: ["GW_0044"]
    title: A waiver without justification, approver or a future expiry is refused
    verification: automated-test
    description: |
      GIVEN a snapshot carrying a failing vetting finding
      WHEN waivers are requested with no expiry, with an expiry already in the past, and with a blank justification, and then with all fields present
      THEN each of the first three is refused and no waiver is recorded for it, and the fourth is recorded carrying the acting identity as its approver
    revision: "0.1.0"

  - id: SVC_GW_0045
    requirement_ids: ["GW_0045"]
    title: A waiver suppresses only the finding its scope names
    verification: automated-test
    description: |
      GIVEN a snapshot whose chain run failed on one rule at one path
      WHEN a waiver is written for a different rule, then one for the same rule pinned to a different commit SHA, then one for the same rule under an unrelated path, and finally one for that rule scoped to this snapshot
      THEN the effective outcome stays blocked for the first three and becomes cleared-with-waivers for the last, while the recorded run outcome stays blocked throughout
    revision: "0.1.0"

  - id: SVC_GW_0046
    requirement_ids: ["GW_0046"]
    title: An expired or revoked waiver stops suppressing its finding
    verification: automated-test
    description: |
      GIVEN a snapshot whose only blocking finding is covered by an active waiver, so its effective outcome is cleared-with-waivers
      WHEN the waiver's expiry passes, and separately when an equivalent waiver is revoked
      THEN in both cases the effective outcome is blocked again and approval is refused, with no scheduled pass having run
    revision: "0.1.0"

  - id: SVC_GW_0047
    requirement_ids: ["GW_0047"]
    title: Portal waives a finding and lists the waiver
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a marketplace whose snapshot has a blocked chain outcome
      WHEN the reviewer waives the blocking finding from the review surface with a justification and an expiry and then approves the snapshot
      THEN the finding is shown as waived, the waiver is listed with its rule, scope, approver and expiry, the outcome is shown as cleared with waivers, and the approval succeeds
    revision: "0.1.0"

  - id: SVC_GW_0048
    requirement_ids: ["GW_0048"]
    title: The ledger records waiver creation, use and revocation
    verification: automated-test
    description: |
      GIVEN a waiver created against a blocking finding and used to approve the snapshot, and a second waiver that is revoked
      WHEN the audit ledger is read
      THEN it holds an entry for each waiver's creation carrying the rule, the scope and the expiry, an entry for the waiver that let the approval through, and an entry for the revocation, each with the marketplace and the acting identity
    revision: "0.1.0"

  - id: SVC_GW_0049
    requirement_ids: ["GW_0049"]
    title: The sweep re-vets the least recently vetted approved snapshots in bounded batches
    verification: automated-test
    description: |
      GIVEN several approved snapshots whose latest chain runs are of different ages, and a held and a rejected snapshot alongside them
      WHEN a re-vetting sweep runs with a batch size smaller than the number of eligible snapshots, and a snapshot is re-vetted on demand
      THEN only approved snapshots are selected, the oldest-vetted ones are taken first, no more than the batch size are re-vetted, each pass records a new chain run carrying its trigger and the chain's connector versions, and the snapshots' own states are unchanged by the runs
    revision: "0.1.0"

  - id: SVC_GW_0050
    requirement_ids: ["GW_0050"]
    title: Enforced re-vetting revokes an approved snapshot and stops the facade serving it
    verification: automated-test
    description: |
      GIVEN an approved and published snapshot that a git client can clone, in a gateway configured to enforce re-vetting violations, whose content the chain now objects to
      WHEN the snapshot is re-vetted
      THEN the snapshot moves to the revoked state, a clone of the marketplace fails and the revoked commit can no longer be fetched by reference, the quarantined copy is still present, and re-publishing it succeeds only after a waiver covers the finding and a fresh approve decision is recorded
    revision: "0.1.0"

  - id: SVC_GW_0051
    requirement_ids: ["GW_0051"]
    title: Warn mode records the violation and never unpublishes
    verification: automated-test
    description: |
      GIVEN an approved and published snapshot whose content the chain now objects to, in a gateway using the default re-vetting mode
      WHEN the snapshot is re-vetted
      THEN the violation is recorded in the ledger and announced as a lifecycle event, the snapshot stays approved, and a git client can still clone the marketplace at the same commit
    revision: "0.1.0"

  - id: SVC_GW_0052
    requirement_ids: ["GW_0052"]
    title: A connector error during re-vetting never revokes the snapshot
    verification: automated-test
    description: |
      GIVEN an approved and published snapshot in a gateway configured to enforce re-vetting violations, and a connector that throws or exceeds its time limit
      WHEN the snapshot is re-vetted, and separately when the run produces no verdict at all
      THEN each run is recorded as inconclusive, the snapshot stays approved and served, and the recorded run still blocks that snapshot's approval
    revision: "0.1.0"

  - id: SVC_GW_0053
    requirement_ids: ["GW_0053"]
    title: A violation names the identities that fetched the snapshot
    verification: automated-test
    description: |
      GIVEN an approved snapshot that two authenticated identities have cloned through the git facade and one has only asked the refs of
      WHEN a re-vetting run finds a violation on it
      THEN the reported affected identities are exactly the two that received content, each with its fetch count and last fetch time, and the violation and revocation lifecycle events are emitted to a subscriber
    revision: "0.1.0"

  - id: SVC_GW_0054
    requirement_ids: ["GW_0054"]
    title: The ledger records the retroactive violation and every state transition
    verification: automated-test
    description: |
      GIVEN an approved snapshot that an identity has fetched, re-vetted under enforcement into a violation and then re-approved after a waiver
      WHEN the audit ledger is read
      THEN it holds the re-vetting run's outcome with its trigger, the violation with the objecting connectors and the mode in force, an entry naming the affected identity, the revocation, the unpublication, and the fresh approval, each with the marketplace and the acting identity
    revision: "0.1.0"

  - id: SVC_GW_0055
    requirement_ids: ["GW_0055"]
    title: Portal shows a revoked snapshot, its violation and who fetched it
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a marketplace whose approved snapshot has been revoked by a re-vetting violation
      WHEN the reviewer opens the marketplace
      THEN the snapshot is shown as revoked with the reason, the blocking findings of the re-vetting run and the identities that had fetched it are listed, and a control re-vets the snapshot on demand
    revision: "0.1.0"

  - id: SVC_GW_0056
    requirement_ids: ["GW_0056"]
    title: Sync mode is per marketplace, defaulted, changeable, and never bypasses approval
    verification: automated-test
    description: |
      GIVEN a newly registered marketplace
      WHEN its sync mode is read, changed by an operator to each valid mode, and a sync-triggered ingestion runs
      THEN the mode defaults to on-demand, each change is applied and an invalid mode is refused, and every sync-triggered snapshot lands held (or rejected on policy violation) and is never approved or published by any sync path
    revision: "0.1.0"

  - id: SVC_GW_0057
    requirement_ids: ["GW_0057"]
    title: Scheduled sweep polls only scheduled marketplaces, oldest first, bounded, and survives one failure
    verification: automated-test
    description: |
      GIVEN marketplaces in each sync mode, one of them with an unreachable upstream
      WHEN the scheduled sweep runs with a batch bound smaller than the eligible set
      THEN only scheduled marketplaces are ingested, selection is least-recently-attempted first and respects the bound, the unreachable marketplace's failure is recorded without stopping the rest, and its attempt stamp makes it eligible again on a later pass
    revision: "0.1.0"

  - id: SVC_GW_0058
    requirement_ids: ["GW_0058"]
    title: Webhook endpoint accepts only a validly signed request and never trusts the payload
    verification: automated-test
    description: |
      GIVEN a marketplace in webhook mode with a gateway-generated secret returned exactly once
      WHEN the inbound endpoint receives a validly signed request, requests with a missing, malformed, or wrong-secret signature, a tampered body, an oversized body, and requests for an unknown marketplace and one not in webhook mode
      THEN only the validly signed request triggers ingestion of the registered upstream's default branch (a foreign URL or ref in the payload is ignored), a held snapshot appears for it, and every other request is rejected with no snapshot created
    revision: "0.1.0"

  - id: SVC_GW_0059
    requirement_ids: ["GW_0059"]
    title: A failing upstream never affects what the facade serves
    verification: automated-test
    description: |
      GIVEN a marketplace with an approved, published snapshot whose upstream then becomes unreachable
      WHEN a scheduled sweep and a validly signed webhook trigger both attempt ingestion
      THEN both attempts fail internally without changing any snapshot state or published reference, and a real git clone through the facade still serves the approved SHA
    revision: "0.1.0"

  - id: SVC_GW_0060
    requirement_ids: ["GW_0060"]
    title: Mode changes and sync-triggered ingestions are on the ledger
    verification: automated-test
    description: |
      GIVEN a marketplace whose sync mode is changed and which is then ingested by the scheduler and by a signed webhook request
      WHEN the audit ledger is read
      THEN it contains the mode change with the acting identity and each sync-triggered ingestion with the snapshot SHA and a trigger identity distinguishing scheduler and webhook from a human, and a snapshot-ingested lifecycle event was emitted for each
    revision: "0.1.0"

  - id: SVC_GW_0061
    requirement_ids: ["GW_0061"]
    title: The catalog aggregates exactly the served estate under namespaced paths
    verification: automated-test
    description: |
      GIVEN two marketplaces with approved snapshots and a third with only a held snapshot
      WHEN the catalog is cloned through the facade with a real git client
      THEN the clone contains each approved marketplace's content under a subdirectory named after it, the merged manifest lists their plugins with marketplace-prefixed names and relative sources into those subdirectories, and the held-only marketplace appears nowhere
    revision: "0.1.0"

  - id: SVC_GW_0062
    requirement_ids: ["GW_0062"]
    title: Publications and revocations reshape the catalog on their own
    verification: automated-test
    description: |
      GIVEN a served catalog containing a marketplace whose snapshot is then revoked under enforcing re-vetting, and another marketplace approved afterwards
      WHEN the catalog is fetched again with no manual regeneration
      THEN the revoked marketplace's subtree and plugins are gone and its SHA is unreachable from every advertised catalog reference, the newly approved marketplace is present, and with nothing serving at all the catalog still serves a manifest with an empty plugin list
    revision: "0.1.0"

  - id: SVC_GW_0063
    requirement_ids: ["GW_0063"]
    title: Catalog constituents, fetch audit, manual rebuild, and the reserved name
    verification: automated-test
    description: |
      GIVEN a served catalog
      WHEN its constituents are read from the API, it is cloned through the facade, a manual regeneration is requested, and a marketplace registration under the catalog's name is attempted
      THEN the API lists exactly the marketplace-and-SHA pairs the clone contains, the clone is on the fetch ledger under the catalog's name, the manual regeneration lands on the ledger with the acting identity, and the registration is refused
    revision: "0.1.0"

  - id: SVC_GW_0064
    requirement_ids: ["GW_0064"]
    title: Scoped tokens fetch only their marketplaces and cannot probe the rest
    verification: automated-test
    description: |
      GIVEN marketplaces with approved snapshots and tokens scoped to a subset, to the catalog, and to nothing
      WHEN each token clones in-scope and out-of-scope marketplaces through the facade
      THEN in-scope clones succeed, an out-of-scope clone fails with the same answer as a marketplace that does not exist, the unscoped token clones everything, and creating a token naming an unknown scope is refused
    revision: "0.1.0"

  - id: SVC_GW_0065
    requirement_ids: ["GW_0065"]
    title: An expired token is refused at authentication with no sweep involved
    verification: automated-test
    description: |
      GIVEN a token created with an expiry that then passes, and a configured maximum lifetime
      WHEN the expired token is presented to the facade and a creation beyond the cap is requested
      THEN the expired token is refused exactly like a revoked one with no background process having run, the over-cap creation is refused rather than shortened, and a token within the cap works until its deadline
    revision: "0.1.0"

  - id: SVC_GW_0066
    requirement_ids: ["GW_0066"]
    title: Rotation changes the secret and nothing else
    verification: automated-test
    description: |
      GIVEN a live scoped token with an expiry
      WHEN its owner rotates it, another principal attempts to rotate it, and a rotation of a revoked token is attempted
      THEN the new secret authenticates with the identical name, scopes and expiry deadline and records its predecessor, the old secret is refused immediately, and the foreign and dead-token rotations are refused
    revision: "0.1.0"

  - id: SVC_GW_0067
    requirement_ids: ["GW_0067"]
    title: Every fetch names its token and the token lifecycle is on the ledger
    verification: automated-test
    description: |
      GIVEN a principal with two tokens fetching through the facade
      WHEN the ledger and the audit export are read
      THEN each facade entry carries the id of the token that authenticated it, the export rows carry the same attribution, and the tokens' creation, rotation and revocation appear with the acting identity, name and scopes
    revision: "0.1.0"

  - id: SVC_GW_0068
    requirement_ids: ["GW_0068"]
    title: Deny-by-default walk of every mutation and privileged read, and the disabled default
    verification: automated-test
    description: |
      GIVEN a gateway with role enforcement enabled and a session holding no role, and a second gateway left at the disabled default
      WHEN the no-role session calls every REST API mutation route — the set asserted complete against the running application's own route table — and the ledger, export and operational listings, and then exercises the browsing surface and its own tokens, while on the disabled gateway a no-role session performs privileged operations
      THEN on the enforcing gateway every mutation and privileged read is refused with an authorization error while the browsing surface and the session's own tokens still work, and on the disabled gateway everything works exactly as before enforcement existed
    revision: "0.1.0"

  - id: SVC_GW_0069
    requirement_ids: ["GW_0069"]
    title: An approver acts on its marketplace and is refused every other, including by id
    verification: automated-test
    description: |
      GIVEN role enforcement enabled and a principal granted approver of marketplace A, with content in marketplaces A and B
      WHEN the approver ingests, approves, rejects, re-vets and waives content of A, and then attempts the same operations against B by marketplace name and through bare snapshot and waiver ids belonging to B
      THEN every operation on A succeeds, and every operation on B is refused with an authorization error regardless of whether the route named the marketplace or only carried an id
    revision: "0.1.0"

  - id: SVC_GW_0070
    requirement_ids: ["GW_0070"]
    title: An auditor reads the ledger and listings and is refused every mutation
    verification: automated-test
    description: |
      GIVEN role enforcement enabled and a principal granted auditor
      WHEN the auditor reads the ledger, the export stream, the webhook subscriber, delivery and sink listings and the retention candidates, and then attempts every REST API mutation route
      THEN every read succeeds and every mutation is refused with an authorization error
    revision: "0.1.0"

  - id: SVC_GW_0071
    requirement_ids: ["GW_0071"]
    title: Grant lifecycle is admin-only, validated, audited, and cannot revoke a config admin
    verification: automated-test
    description: |
      GIVEN role enforcement enabled, a configuration-bootstrapped admin, and a session with no role
      WHEN the no-role session attempts to grant, the admin grants and revokes approver and auditor roles, an approver grant omitting its marketplace and one naming an unknown marketplace are attempted, a duplicate grant is attempted, and the session identity endpoint is read by the admin and by a granted principal
      THEN the no-role grant is refused with an authorization error, the admin's grant and revocation succeed and each lands on the append-only ledger with actor, target, role and marketplace, the malformed and duplicate grants are refused, the configuration-bootstrapped admin holds admin with no database row an API call could revoke, and the identity endpoint reports enforcement state and each caller's effective roles
    revision: "0.1.0"

  - id: SVC_GW_0072
    requirement_ids: ["GW_0072"]
    title: The release workflow carries the publish-by-digest contract
    verification: automated-test
    description: |
      GIVEN the repository's release workflow definition
      WHEN the packaging test validates it
      THEN the workflow pushes the smoke-tested image to the project's registry namespace with commit-SHA and latest tags on main and the released version's tag when invoked by the release workflow, declares no tag trigger of its own so a hand-pushed tag cannot publish, gates every publish step so that neither a scheduled nor a bare manually dispatched run can reach one, holds the permissions publishing and attestation require, surfaces the pushed digest in the job summary, and attests the CycloneDX SBOM against the pushed image after the push
    revision: "0.2.0"

  - id: SVC_GW_0073
    requirement_ids: ["GW_0073"]
    title: A snapshot younger than the configured age is unapprovable, on the gateway's own clock
    verification: automated-test
    description: |
      GIVEN a gateway configured with a non-zero minimum release age, a second gateway left at the zero default, and the eligibility rule evaluated directly at the boundary instant
      WHEN a snapshot ingested moments ago is approved, one whose first ingestion is older than the configured age is approved, a snapshot pinned to a commit whose committer date is far older than the configured age but ingested moments ago is approved, the same commit is ingested a second time after its first sighting has aged, a rejection and a revoked snapshot's paths are exercised, and the same operations are performed on the gateway left at the default
      THEN the young snapshot is refused with a conflict naming the setting, its age and the time remaining while nothing is published and the refusal is on the append-only ledger, the aged snapshot is approved with its age on the ledger, the backdated commit is refused exactly as the young one, re-ingestion leaves the first-sighting instant and therefore the eligibility untouched, rejection is never gated by age, the eligibility report agrees with the gate and is eligible exactly at the boundary instant and not one moment before, and on the default gateway every approval succeeds as it did before the setting existed
    revision: "0.1.0"

  # SVC_GW_0074 is deliberately unused — see the matching note on GW_0074 in
  # requirements.yml. The id is retired, not awaiting a change.

  - id: SVC_GW_0075
    requirement_ids: ["GW_0075"]
    title: The adoption report aggregates the windowed ledger per marketplace, SHA and identity
    verification: automated-test
    description: |
      GIVEN two approved marketplaces fetched through the facade by two distinct identities, and a ledger entry planted older than the report window
      WHEN the adoption report is read for that window
      THEN each marketplace carries its content-transferring fetch count, its distinct identity count and its most recent fetch time, the per-SHA breakdown marks the served tip as current, the too-old entry is not counted at the narrow window and is counted at the wide one, and the deny-by-default authorization walk classifies both adoption reads as privileged like the ledger itself
    revision: "0.1.0"

  - id: SVC_GW_0076
    requirement_ids: ["GW_0076"]
    title: Staleness names exactly the identities not on the served tip, retracted content included
    verification: automated-test
    description: |
      GIVEN one identity that fetched a snapshot later superseded by a newer approval and another identity that fetched the new tip
      WHEN the staleness report is read, and read again after the marketplace stops serving entirely
      THEN the first report names only the superseded identity with its last-received SHA and the served tip it diverges from, and the second names every holder of the retracted content with an absent served tip
    revision: "0.1.0"

  - id: SVC_GW_0077
    requirement_ids: ["GW_0077"]
    title: The skills_gateway metrics are recorded with export left at its disabled default
    verification: automated-test
    description: |
      GIVEN a gateway running with telemetry export at its disabled default
      WHEN a snapshot is ingested, one snapshot is approved and another rejected, and content is fetched through the facade
      THEN the meter registry carries the ingestion timing observation tagged with its outcome, the approval observation tagged per decision, and the facade fetch counter tagged per event kind, all under the skills_gateway prefix, and an approval the vetting gate blocks still surfaces its refusal unchanged
    revision: "0.1.0"

  - id: SVC_GW_0078
    requirement_ids: ["GW_0078"]
    title: The portal adoption page shows a real facade fetch and its identity
    verification: automated-test
    description: |
      GIVEN a marketplace approved in the portal and cloned through the facade with a token minted in the portal
      WHEN the operator opens the Adoption page
      THEN the marketplace's fetch appears in the adoption report with the fetching identity counted, and the page presented its loading-to-loaded transition without an error state
    revision: "0.1.0"

  - id: SVC_GW_0079
    requirement_ids: ["GW_0079"]
    title: The setup wizard composes origin-derived commands and holds show-once
    verification: automated-test
    description: |
      GIVEN a registered marketplace and its detail page in a real browser
      WHEN the user opens the setup wizard, mints a token inside it, and later closes and reopens the wizard
      THEN the marketplace-add command and credential configuration carry the page's own origin and the marketplace's facade clone path, the minted cleartext appears in the snippets only while the wizard stays open, and after reopening the snippets carry a placeholder and no previously issued secret is displayed
    revision: "0.1.0"

  - id: SVC_GW_0080
    requirement_ids: ["GW_0080"]
    title: File inspection is tree-addressed, capped, binary-aware, and approver-scoped
    verification: automated-test
    description: |
      GIVEN an ingested snapshot whose commit carries a text file, a file larger than the size limit and a binary file, and — in an enforcement-enabled context — a session with no role, an auditor, an approver of another marketplace, an approver of the owning marketplace and an admin
      WHEN the file tree, each file, a path absent from the commit tree and a traversal-shaped path are requested, and the enforcement-enabled sessions attempt the reads
      THEN the tree lists the pinned commit's paths, the text file returns its content, the oversized file returns truncated content with an explicit marker, the binary file returns metadata without text, the absent and traversal-shaped paths answer not-found, and under enforcement the reads succeed only for the owning approver and the admin
    revision: "0.1.0"

  - id: SVC_GW_0081
    requirement_ids: ["GW_0081"]
    title: The diff names the served baseline and the exact delta, or the absence of a baseline
    verification: automated-test
    description: |
      GIVEN a marketplace with an approved, served snapshot and a later held snapshot whose commit modifies, adds and removes files, and a second marketplace serving nothing
      WHEN each snapshot's diff is requested
      THEN the held snapshot's diff names the served commit as its baseline and reports exactly the modified, added and removed paths with a textual diff for text files, and the unserved marketplace's diff reports no baseline with every path reported as added
    revision: "0.1.0"

  - id: SVC_GW_0082
    requirement_ids: ["GW_0082"]
    title: The preview pane walks a held snapshot's tree and diff in a real browser
    verification: automated-test
    description: |
      GIVEN a marketplace approved and served, whose upstream then changes and is re-ingested into a held snapshot, in a real browser
      WHEN the reviewer opens the held snapshot's preview pane, selects the skill's SKILL.md, and switches to the diff view
      THEN the file tree lists the snapshot's paths, the SKILL.md renders as formatted text with embedded HTML shown as text rather than interpreted, and the diff view names the modified and added paths against the served baseline
    revision: "0.1.0"

  - id: SVC_GW_0083
    requirement_ids: ["GW_0083"]
    title: Startup reconciliation converges the declared estate additively and idempotently
    verification: automated-test
    description: |
      GIVEN a gateway configured with a declared estate of marketplaces, role grants, a webhook subscriber and an audit sink, plus objects created through the API that the declaration does not mention
      WHEN the application starts and a further reconciliation is then run against the unchanged declaration
      THEN the declared objects exist as if created through the API with every applied change on the ledger under its API event name and the reconciler actor, the undeclared API-created objects are untouched, and the second reconciliation performs no writes and appends nothing to the ledger
    revision: "0.1.0"

  - id: SVC_GW_0084
    requirement_ids: ["GW_0084"]
    title: Declared marketplaces face the same registration gate as the API
    verification: automated-test
    description: |
      GIVEN declarations containing a marketplace with a disallowed URL scheme, one under the reserved catalog name, one whose declared URL differs from its registered URL, one declaring webhook sync mode, and a valid one declaring scheduled sync
      WHEN reconciliation runs
      THEN the invalid entries each fail with a ledger record and create or change nothing, the registered marketplace keeps its stored URL, and the valid entry is registered with its sync mode applied through the audited sync-mode path
    revision: "0.1.0"

  - id: SVC_GW_0085
    requirement_ids: ["GW_0085"]
    title: Declared grants reconcile through the audited grant path
    verification: automated-test
    description: |
      GIVEN a declaration granting an approver on a marketplace declared in the same configuration, an auditor globally, and an approver on a marketplace that does not exist, alongside an API-created grant the declaration does not mention
      WHEN reconciliation runs
      THEN the valid grants exist and take effect under role enforcement with ledger entries naming the reconciler actor, the grant for the unknown marketplace fails as an isolated entry, the API-created grant survives, and re-running the reconciliation grants nothing twice
    revision: "0.1.0"

  - id: SVC_GW_0086
    requirement_ids: ["GW_0086"]
    title: Declared receiver secrets are write-only, rotated idempotently, floored in length
    verification: automated-test
    description: |
      GIVEN a declared webhook subscriber and audit sink with operator-supplied secrets, then the same declaration with one secret value changed, and declarations carrying a blank and a too-short secret
      WHEN reconciliation runs after each state
      THEN the stored secrets match the declaration with the sink's cursor set only at creation, the changed value rotates the stored secret with a ledger record that does not contain it, the unchanged values cause no write, the blank and too-short secrets each fail as isolated entries, and no secret value appears in the reconciliation report or on the ledger
    revision: "0.1.0"

  - id: SVC_GW_0087
    requirement_ids: ["GW_0087"]
    title: A failing entry is loud but never fatal, and the report is answerable
    verification: automated-test
    description: |
      GIVEN a gateway whose declared estate contains one invalid entry among valid ones
      WHEN the application starts and the report endpoint and reconcile trigger are then exercised under role enforcement
      THEN the application serves with the valid entries applied, the invalid entry is on the ledger and in the report with its reason, the report endpoint answers auditors and admins and refuses sessions with no role, and the trigger endpoint refuses non-admins and records each admin trigger on the ledger with the acting identity
    revision: "0.1.0"

  - id: SVC_GW_0088
    requirement_ids: ["GW_0088"]
    title: The registry is served, excludes the export event, and the portal composes a filter from it
    verification: automated-test
    description: |
      GIVEN a gateway with the lifecycle event registry and — in an enforcement-enabled context — a session with no role and an auditor session
      WHEN the event registry is requested, and an operator registers a subscriber in the portal by selecting events, selecting all of them, and narrowing the list by typing
      THEN the response lists every event the dispatcher can emit and does not contain the audit export event, the read is refused below auditor and allowed for the auditor, the type-ahead narrows the offered list, selecting every event submits the wildcard filter and a partial selection submits the comma-delimited names, and a stored filter naming an event absent from the registry is marked as unknown
    revision: "0.1.0"

  - id: SVC_GW_0089
    requirement_ids: ["GW_0089"]
    title: Rule lifecycle is compiled, gated, audited, and declarable
    verification: automated-test
    description: |
      GIVEN an admin session, sessions below admin under role enforcement, and a declared estate containing a valid rule, an identical already-stored rule, and a rule whose expression does not compile
      WHEN rules are created, listed, updated and deleted through the API with valid, syntactically invalid, non-boolean and duplicate-named expressions, and reconciliation runs
      THEN valid mutations succeed with a ledger entry each and reads answer auditors and admins, invalid and non-boolean expressions are refused with a validation error and are not stored, a duplicate name is refused as a conflict, mutations and reads below their required role are refused, the valid declared rule is created and enforced, the identical declared rule reconciles with zero writes, and the non-compiling declared rule fails as an isolated entry without blocking the others
    revision: "0.1.0"
  - id: SVC_GW_0090
    requirement_ids: ["GW_0090"]
    title: The policy gate denies on match and on every error path, publishing nothing
    verification: automated-test
    description: |
      GIVEN held snapshots whose content includes skills declaring shell tools, a skill with malformed SKILL.md frontmatter, and enabled rules that match, do not match, are disabled, error at runtime, and contain a comprehension bomb
      WHEN approval is requested for each snapshot
      THEN a matching rule refuses the approval with a conflict naming the rule, the snapshot stays held and the marketplace's served tip is unchanged, a non-matching enabled rule and a disabled matching rule do not refuse, a rule that errors at runtime refuses naming the rule, the comprehension bomb refuses within the evaluation bound rather than hanging, malformed frontmatter refuses under a tools rule, and with no deciding rule the approval succeeds and is served
    revision: "0.1.0"
  - id: SVC_GW_0091
    requirement_ids: ["GW_0091"]
    title: Every deciding rule lands on the ledger with its outcome
    verification: automated-test
    description: |
      GIVEN a held snapshot and two enabled rules of which one matches and one errors at evaluation
      WHEN approval is requested and refused
      THEN the ledger carries one policy-denied entry per deciding rule naming the rule, the snapshot SHA, the marketplace and the acting reviewer, the matched rule's entry records a match and the erroring rule's entry records the evaluation failure, and no snapshot-approved entry is written
    revision: "0.1.0"
  - id: SVC_GW_0092
    requirement_ids: ["GW_0092"]
    title: The playground evaluates real snapshots and is provably inert
    verification: automated-test
    description: |
      GIVEN a held snapshot with skills content, an approver of its marketplace and — under role enforcement — a session that cannot approve it
      WHEN expressions that match, do not match, fail to compile and fail to evaluate are submitted to the playground, and the unauthorized session submits one
      THEN the answers report matched, not matched, the compile error and the evaluation error respectively without echoing snapshot content, the unauthorized session is refused, and after all calls the ledger row count, the rule set, the snapshot state and the marketplace's served state are exactly what they were before
    revision: "0.1.0"
  - id: SVC_GW_0093
    requirement_ids: ["GW_0093"]
    title: License detection is deterministic and names unknown and missing states
    verification: automated-test
    description: |
      GIVEN snapshots carrying an MIT license file, an Apache-2.0 COPYING file, a license file whose only identification is an SPDX-License-Identifier tag, a manifest declaring a plugin license, a license file of unrecognizable text, and no license information at all
      WHEN each snapshot is ingested and the license connector's verdict is read
      THEN each identified license is a finding naming its SPDX identifier and located at its file path or manifest field, the unrecognizable file yields an unknown-license finding at its path, the snapshot without license information yields a missing-license finding, and re-running the chain over the same content yields the same findings
    revision: "0.1.0"
  - id: SVC_GW_0094
    requirement_ids: ["GW_0094"]
    title: Ban and allow lists block through the ordinary gate, defaults only warn
    verification: automated-test
    description: |
      GIVEN a gateway with default license configuration, one with a ban list naming a license a fixture carries, and one with a non-empty allow list the fixtures variously satisfy, miss, or defeat with unknown or missing licenses
      WHEN the fixtures are ingested and approval is attempted
      THEN under defaults identified licenses are informational and unknown or missing ones warn without blocking approval, the banned license and the allow-list misses each block approval naming their finding through the standard vetting-blocked refusal, a scoped expiring waiver on the finding's rule identifier is what lets the approval through, the verdicts are on the append-only ledger, and the recorded chain identity reflects the policy in force
    revision: "0.1.0"
  - id: SVC_GW_0095
    requirement_ids: ["GW_0095"]
    title: The licenses endpoint reports detections with their policy evaluation
    verification: automated-test
    description: |
      GIVEN a snapshot carrying an identified license, an unknown license file and a manifest license, under a configured ban list naming one of them
      WHEN its license report endpoint is requested, and a report is requested for a snapshot id that does not exist
      THEN the response lists each detection with its SPDX identifier or unknown state, its file path or manifest field source, and its evaluation under the configured policy including the banned entry marked as banned, and the unknown snapshot id answers not-found
    revision: "0.1.0"
  - id: SVC_GW_0098
    requirement_ids: ["GW_0098"]
    title: Claim-mapped roles grant, compose and never widen, and a malformed mapping refuses startup
    verification: automated-test
    description: |
      GIVEN role enforcement enabled with claim mappings to admin, to approver of one marketplace and to auditor, and no stored grant for the acting principals
      WHEN sessions carrying the mapped claim values exercise the operations of their role, a session carrying a value that only resembles a mapped one by prefix, substring or letter case attempts the same, a claim-derived approver attempts another marketplace by name and through bare snapshot and waiver ids, a personal access token on the git facade, the insecure development principal and a non-identity-provider credential carrying a forged claim attempt privileged operations, the session identity endpoint is read, and gateways configured with an unknown role, a blank claim value, an unscoped approver mapping and a scoped global mapping are started
      THEN each mapped session may do exactly what its role allows and no more, the near-miss values and the claimless credentials hold nothing, the derived roles union with configured admins and stored grants without altering deny-by-default or approver scoping, the identity endpoint names the source of every effective role, and each malformed mapping refuses startup while a mapping naming an unregistered marketplace starts and matches nothing
    revision: "0.1.0"

  - id: SVC_GW_0099
    requirement_ids: ["GW_0099"]
    title: A truncated claim is reported, not mistaken for an empty one
    verification: automated-test
    description: |
      GIVEN role enforcement enabled with claim mappings configured
      WHEN a session whose token omits the configured claim but carries the provider's truncation indicator is established, and a session whose token simply carries no memberships is established
      THEN the truncated session is reported as truncated on the session identity endpoint, the detection is logged, and it holds no derived role, while the session with no memberships is not reported truncated
    revision: "0.1.0"

  - id: SVC_GW_0100
    requirement_ids: ["GW_0100"]
    title: The principal claim is configurable and a foreign issuer establishes no session
    verification: automated-test
    description: |
      GIVEN a gateway configured with an expected issuer and a principal-name claim other than the subject, and a second gateway left at the defaults
      WHEN an identity token from a different issuer is presented, one from the expected issuer is presented, and the session identity endpoint is read on both gateways
      THEN the foreign-issuer token is refused and establishes no session, the matching one succeeds and the identity endpoint reports the configured claim's value which the role lookups key on, and the default gateway behaves exactly as before while logging that no expected issuer is configured
    revision: "0.1.0"
  - id: SVC_GW_0101
    requirement_ids: ["GW_0101"]
    title: A hosted marketplace registers without an upstream and is never fetched from one
    verification: automated-test
    description: |
      GIVEN a gateway with no marketplaces registered
      WHEN a marketplace is registered as gateway-hosted with no clone URL, a hosted registration supplying a URL is attempted, a non-hosted registration omitting one is attempted, a change of the hosted marketplace's refresh strategy is attempted, the marketplace is described through the API, and the surfaces that report an upstream are exercised for it
      THEN the hosted registration succeeds and creates its origin repository, the registration supplying a URL and the one omitting one are both refused, the refresh-strategy change is refused, the description names the origin, the rewrite policy and the publish location, and every surface that would have reported an upstream answers without one rather than failing
    revision: "0.1.0"

  - id: SVC_GW_0102
    requirement_ids: ["GW_0102"]
    title: Only an explicitly push-scoped token publishes, and only the single lineage, forward
    verification: automated-test
    description: |
      GIVEN a hosted marketplace, a second hosted marketplace, a token scoped to push to the first, a token with fetch scopes only, a token whose fetch scope is the unscoped every-marketplace form, and a token predating push scopes
      WHEN each token attempts a real git push of the lineage reference to the first marketplace, the push-scoped token attempts the second marketplace and a name that escapes the storage layout, the push-scoped token attempts a second branch, a tag and a reference deletion, a non-fast-forward push is attempted under each rewrite policy, and a push is attempted against the endpoint that serves approved content
      THEN only the push-scoped token publishes to the marketplace it names, every other token is refused, the second marketplace and the escaping name answer as not found, the second branch, the tag and the deletion are refused, the non-fast-forward is refused under the default policy leaving the tip unchanged and accepted under the permissive one with both tips on the append-only ledger, and the serving endpoint refuses the push outright
    revision: "0.1.0"

  - id: SVC_GW_0103
    requirement_ids: ["GW_0103"]
    title: A push is quarantined, vetted, held, and served only once approved
    verification: automated-test
    description: |
      GIVEN a hosted marketplace with a push-scoped token, and fixtures carrying respectively clean content, a planted credential, and a manifest declaring a non-local plugin source
      WHEN each fixture is pushed, the served endpoint is cloned before and after approval, and an approved snapshot is subsequently revoked
      THEN each push produces a snapshot identified by the pushed commit SHA, the clean one is held with a passing vetting chain, the planted credential is held with findings, the non-local manifest is rejected, the clone before approval fails as it does for a marketplace that serves nothing, the clone after approval returns exactly the pushed content, and the clone after revocation fails again
    revision: "0.1.0"
  - id: SVC_GW_0104
    requirement_ids: ["GW_0104"]
    title: A session credential's life is the gateway's to set, and it can never publish
    verification: automated-test
    description: |
      GIVEN a gateway with a configured session credential lifetime, an authenticated browser session, a hosted marketplace, and a second marketplace
      WHEN a session credential is requested, one is requested while supplying a lifetime of the caller's own, one narrowed to a single marketplace is used against another, one is used to push to the hosted marketplace, one is rotated, an ordinary access token is created alongside, and a credential from a gateway whose configured lifetime has already elapsed is presented
      THEN every session credential expires at the configured lifetime regardless of what the caller asked for, none may publish, a narrowed one is refused the marketplace it does not name, the rotated one keeps both its deadline and its session-derived mark, the session credentials are reported as session-derived while the ordinary token is not, and the elapsed one fails authentication by comparison at use rather than by any scheduled process
    revision: "0.1.0"

  - id: SVC_GW_0105
    requirement_ids: ["GW_0105"]
    title: The served contract declares the build's version
    verification: automated-test
    description: |
      GIVEN a gateway built from a working tree whose version is derived from git state
      WHEN the API contract document is served
      THEN the version it declares is that build's version, and not a fixed literal
    revision: "0.1.0"

  - id: SVC_GW_0106
    requirement_ids: ["GW_0106"]
    title: The published contract matches the served contract
    verification: automated-test
    description: |
      GIVEN the API contract document published in the repository
      WHEN the build compares it against the document the application serves
      THEN the two are identical apart from the declared release version
      AND a divergence fails the build, naming the command that regenerates the published copy
    revision: "0.1.0"

  - id: SVC_GW_0107
    requirement_ids: ["GW_0107"]
    title: Breaking contract changes are refused unless declared
    verification: automated-test
    description: |
      GIVEN a proposed change and the contract that change branched from
      WHEN the change removes or narrows part of that contract
      THEN it is refused unless it is both marked as a deliberate break and declared
      as breaking by the commit that ships it
      AND the refusal states what a deliberate breaking change is required to do instead
    revision: "0.1.0"

  - id: SVC_GW_0108
    requirement_ids: ["GW_0108"]
    title: The release workflow is dispatch-only, previews by default and gates before publishing
    verification: automated-test
    description: |
      GIVEN the repository's release workflow definition
      WHEN the packaging test validates it
      THEN the workflow is reachable only by manual dispatch, its preview input defaults to on, it offers the release-candidate modes alongside a plain release, it requires the override flag before a hand-entered version can disagree with the derived one, it runs the main-branch gates before the approval gate, it binds the publishing stage to a protected environment so a required reviewer holds it, it creates the release as a prerelease, and it orders promotion to latest after the published-artifact verification
    revision: "0.1.0"

  - id: SVC_GW_0109
    requirement_ids: ["GW_0109"]
    title: Release tags are bare semantic versions and cut only from reachable untagged commits
    verification: automated-test
    description: |
      GIVEN the repository's workflow definitions and its changelog configuration
      WHEN the packaging test validates them
      THEN no workflow matches or strips a prefixed tag, the changelog configuration recognises only bare three-part semantic versions as release tags, and the release workflow refuses a commit that is unreachable from the main branch or that already carries a release tag
    revision: "0.1.0"

  - id: SVC_GW_0110
    requirement_ids: ["GW_0110"]
    title: A configured deployment refuses to start with the development escape hatch on
    verification: automated-test
    description: |
      GIVEN a gateway whose development-only unauthenticated mode is enabled
      WHEN it is started with an identity provider configured, whether by a real client
      registration, a provider endpoint that is not the shipped placeholder, or a pinned
      issuer
      THEN it refuses to start, and the refusal names the configuration that decided it and
      both ways to resolve it
      AND a gateway with the mode enabled and no identity provider configured still starts
    revision: "0.1.0"

  - id: SVC_GW_0125
    requirement_ids: ["GW_0125"]
    title: Every enumerated column is a database type that refuses values outside its set
    verification: automated-test
    description: |
      GIVEN a gateway whose schema has been migrated
      WHEN each column holding a closed set of enumerated values is inspected, written
      through the repository that owns it, and read back
      THEN the column's declared type is the enumerated type named for it, every value of
      the set round trips unchanged, and a value outside the set is refused by the database
      rather than stored
    revision: "0.1.0"
