# yaml-language-server: $schema=https://raw.githubusercontent.com/reqstool/reqstool-client/main/src/reqstool/resources/schemas/v1/software_verification_cases.schema.json

cases:
  - id: SVC_GW_INGEST_0001
    requirement_ids: ["GW_INGEST_0001"]
    title: Register a marketplace via the admin interface
    verification: automated-test
    description: |
      GIVEN a running gateway with no registered marketplaces
      WHEN an administrator registers a marketplace clone URL
      THEN the marketplace is listed as registered with that URL
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0002
    requirement_ids: ["GW_INGEST_0002"]
    title: Ingest a marketplace into a held snapshot
    verification: automated-test
    description: |
      GIVEN a registered marketplace whose repository has a valid manifest
      WHEN ingestion runs
      THEN a snapshot identified by the upstream head commit SHA exists in state held
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0003
    requirement_ids: ["GW_INGEST_0003"]
    title: Reject manifests with external plugin sources
    verification: automated-test
    description: |
      GIVEN a marketplace whose manifest declares a github, url, git-subdir, npm, or archive plugin source
      WHEN ingestion runs
      THEN the snapshot is rejected with a policy violation and cannot be approved
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0001
    requirement_ids: ["GW_APPROVAL_0001"]
    title: Upstream changes never alter served content
    verification: automated-test
    description: |
      GIVEN an approved snapshot being served and a new commit pushed upstream
      WHEN ingestion fetches the update
      THEN clients still receive the previously approved snapshot and the new snapshot is held
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0002
    requirement_ids: ["GW_APPROVAL_0002"]
    title: Approve a held snapshot with a recorded decision
    verification: automated-test
    description: |
      GIVEN a held snapshot
      WHEN a reviewer approves it
      THEN the snapshot state becomes approved and the decision record contains the reviewer identity and timestamp
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0001
    requirement_ids: ["GW_FACADE_0001"]
    title: Clone an approved snapshot with a standard git client
    verification: automated-test
    description: |
      GIVEN an approved snapshot
      WHEN a standard git client clones the facade URL over HTTP
      THEN the clone succeeds and the content equals the approved snapshot
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0002
    requirement_ids: ["GW_FACADE_0002"]
    title: Held content is not fetchable from the facade
    verification: automated-test
    description: |
      GIVEN one approved snapshot and one held snapshot for a marketplace
      WHEN a git client lists refs and fetches from the facade
      THEN only the approved refs are advertised and held objects cannot be fetched
    revision: "0.1.0"

  - id: SVC_GW_AUDIT_0001
    requirement_ids: ["GW_AUDIT_0001"]
    title: Every facade fetch is audit-logged
    verification: automated-test
    description: |
      GIVEN the facade is serving an approved snapshot
      WHEN a client fetches from it
      THEN an audit record with source address, repository, ref, commit SHA, and timestamp is appended
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0004
    requirement_ids: ["GW_INGEST_0004"]
    title: Provenance of an approved snapshot is retrievable
    verification: automated-test
    description: |
      GIVEN an approved snapshot
      WHEN its provenance is queried
      THEN the upstream URL, upstream commit SHA, approver, and approval timestamp are returned
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0001
    requirement_ids: ["GW_AUTH_0001"]
    title: List marketplaces and snapshot states via the admin interface
    verification: automated-test
    description: |
      GIVEN a gateway with registered marketplaces and snapshots in different states
      WHEN an administrator lists them via the administrative HTTP interface
      THEN all marketplaces and their snapshots are returned with their states
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0002
    requirement_ids: ["GW_AUTH_0002"]
    title: Web access requires an OIDC session
    verification: automated-test
    description: |
      GIVEN a running gateway configured with an OIDC identity provider
      WHEN an unauthenticated browser request hits the administrative interface
      THEN it is redirected to the identity provider login, and the same request with an authenticated session succeeds
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0003
    requirement_ids: ["GW_AUTH_0003"]
    title: Git facade requires a valid personal access token
    verification: automated-test
    description: |
      GIVEN an approved snapshot being served
      WHEN a git client fetches without a token or with a revoked/invalid token, and then with a valid token
      THEN the unauthenticated fetches are rejected and the valid-token fetch succeeds with the identity recorded in the audit log
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0004
    requirement_ids: ["GW_AUTH_0004"]
    title: Tokens are shown once and stored hashed; revocation takes effect
    verification: automated-test
    description: |
      GIVEN an authenticated user
      WHEN they create a personal access token and later revoke it
      THEN the cleartext is returned only at creation, only a hash is persisted, and fetches with the revoked token are rejected
    revision: "0.1.0"

  - id: SVC_GW_API_0001
    requirement_ids: ["GW_API_0001"]
    title: SBOM endpoint serves the CycloneDX BOM
    verification: automated-test
    description: |
      GIVEN a running gateway built with SBOM generation
      WHEN the SBOM endpoint is requested
      THEN a CycloneDX document is returned listing the application's components
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0001
    requirement_ids: ["GW_RELEASE_0001"]
    title: Packaging artifacts are present and mutually consistent
    verification: automated-test
    description: |
      GIVEN the repository's packaging artifacts (Dockerfile and Helm chart)
      WHEN the packaging test validates them
      THEN the Dockerfile stages the application jar and runs it on a runtime the image
      builds for itself, derives the published image from a base carrying no shell, runs it
      as the non-root user, needs no shell of its own to start, and the chart's Deployment
      wires the image, the actuator health probes, and the PostgreSQL and OIDC configuration
    revision: "0.2.0"

  - id: SVC_GW_INGEST_0005
    requirement_ids: ["GW_INGEST_0005"]
    title: Non-allowlisted URL schemes are rejected at registration
    verification: automated-test
    description: |
      GIVEN a running gateway with its URL scheme allowlist configured
      WHEN an administrator attempts to register marketplaces with ssh, ext, and scheme-less clone URLs
      THEN each registration is rejected with HTTP 400 and no marketplace is persisted
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0006
    requirement_ids: ["GW_INGEST_0006"]
    title: Consumer-supplied refs other than the default branch are rejected
    verification: automated-test
    description: |
      GIVEN a running gateway
      WHEN a registration request supplies a ref other than the upstream default branch
      THEN it is rejected with HTTP 400 and no marketplace is persisted, while omitting the ref or supplying the default branch registers normally
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0007
    requirement_ids: ["GW_INGEST_0007"]
    title: Admin completes the register-ingest-approve workflow in the portal
    verification: automated-test
    description: |
      GIVEN a running gateway with PostgreSQL and an OIDC identity provider
      WHEN an administrator logs in through the browser, registers a marketplace, triggers ingestion, and approves the held snapshot in the portal
      THEN the portal shows the snapshot as approved and the underlying state matches
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0005
    requirement_ids: ["GW_AUTH_0005"]
    title: User creates and revokes a token in the portal with show-once cleartext
    verification: automated-test
    description: |
      GIVEN an authenticated portal session
      WHEN the user creates a personal access token and later revokes it
      THEN the cleartext is displayed exactly once at creation, never again afterwards, and the revoked token is marked revoked
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0008
    requirement_ids: ["GW_INGEST_0008"]
    title: Snapshot content lists plugins and their skills
    verification: automated-test
    description: |
      GIVEN an ingested snapshot whose manifest declares multiple plugins with skills under their source trees
      WHEN the snapshot's content is requested
      THEN every declared plugin is returned with the skills found under it and the snapshot's commit SHA
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0009
    requirement_ids: ["GW_INGEST_0009"]
    title: Forge metadata is captured at registration when available
    verification: automated-test
    description: |
      GIVEN a marketplace URL whose forge exposes a repository metadata API
      WHEN the marketplace is registered
      THEN the project name, description, and last update time are stored with the marketplace
    revision: "0.1.0"

  - id: SVC_GW_AUDIT_0002
    requirement_ids: ["GW_AUDIT_0002"]
    title: Admin actions appear in the audit ledger with the acting identity
    verification: automated-test
    description: |
      GIVEN an authenticated administrator
      WHEN they register a marketplace, ingest it, approve the snapshot, and create and revoke a token
      THEN the ledger contains a record for each action with the administrator's identity
    revision: "0.1.0"

  - id: SVC_GW_WEBHOOK_0001
    requirement_ids: ["GW_WEBHOOK_0001"]
    title: Lifecycle events reach only the subscribers that filter for them
    verification: automated-test
    description: |
      GIVEN two webhook subscribers, one filtering for marketplace.snapshot.approved and one filtering for marketplace.snapshot.rejected
      WHEN a snapshot is ingested and then approved
      THEN a delivery exists for the approved subscriber carrying the event name, marketplace, snapshot id, and commit SHA, and none exists for the rejected-only subscriber
    revision: "0.1.0"

  - id: SVC_GW_WEBHOOK_0002
    requirement_ids: ["GW_WEBHOOK_0002"]
    title: Deliveries carry a verifiable HMAC-SHA256 signature and secrets are shown once
    verification: automated-test
    description: |
      GIVEN a webhook subscriber created through the admin API
      WHEN the cleartext secret is returned at creation and a delivery is signed with it
      THEN the signature header equals the HMAC-SHA256 of the exact request body under that secret, and no later API response exposes the secret
    revision: "0.1.0"

  - id: SVC_GW_WEBHOOK_0003
    requirement_ids: ["GW_WEBHOOK_0003"]
    title: A failing delivery is retried with backoff and finally marked failed
    verification: automated-test
    description: |
      GIVEN a subscriber whose endpoint rejects deliveries
      WHEN the dispatcher processes the delivery until the configured maximum number of attempts is reached
      THEN each attempt is recorded with its outcome, the next attempt is scheduled later than the previous one, and the delivery ends in the failed state
    revision: "0.1.0"

  - id: SVC_GW_WEBHOOK_0004
    requirement_ids: ["GW_WEBHOOK_0004"]
    title: Portal shows lifecycle subscribers and their delivery attempts, and marks a sink's
    verification: automated-test
    description: |
      GIVEN an authenticated portal session, a registered webhook subscriber with a delivery attempt, and an audit sink with a delivery attempt
      WHEN the administrator opens the webhooks page
      THEN the subscriber is listed with its event filter and the delivery attempt is listed with its event and state,
      the sink's channel is not listed among the subscribers, and the sink's delivery attempt is marked as the sink's and leads to the audit sinks page
    revision: "0.2.0"

  - id: SVC_GW_AUDIT_0003
    requirement_ids: ["GW_AUDIT_0003"]
    title: Ledger entries stream as newline-delimited JSON from a cursor
    verification: automated-test
    description: |
      GIVEN an audit ledger holding several entries
      WHEN the export stream is requested first without a cursor and then with the cursor returned by that response
      THEN the first response carries one JSON object per line in ascending sequence with the resume cursor, and the second response contains only entries appended after it
    revision: "0.1.0"

  - id: SVC_GW_AUDIT_0004
    requirement_ids: ["GW_AUDIT_0004"]
    title: A sink receives the entries after its position exactly once per pass
    verification: automated-test
    description: |
      GIVEN a registered audit export sink whose position is behind the ledger head
      WHEN the exporter runs a pass and then runs a second pass with no new ledger entries
      THEN the first pass durably records one signed delivery carrying the entries after the position and advances the position to the last of them, and the second pass records no further delivery
    revision: "0.1.0"

  - id: SVC_GW_AUDIT_0005
    requirement_ids: ["GW_AUDIT_0005"]
    title: Resetting a sink position re-delivers the entries after it
    verification: automated-test
    description: |
      GIVEN an audit export sink whose position is at the ledger head after a completed export pass
      WHEN an administrator sets the sink position back to an earlier sequence and the exporter runs again
      THEN a new delivery is recorded carrying the entries following that sequence
    revision: "0.1.0"

  - id: SVC_GW_AUDIT_0006
    requirement_ids: ["GW_AUDIT_0006"]
    title: Portal audit page offers the export download, and the audit sinks page lists sinks
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a registered audit export sink
      WHEN the administrator opens the audit page, and then the audit sinks section of the integrations surface
      THEN the ledger export download control is present on the audit page, and the sink is listed on the audit sinks section with its target and current ledger position
    revision: "0.2.0"

  - id: SVC_GW_AUDIT_0008
    requirement_ids: ["GW_AUDIT_0008"]
    title: The ledger browse read is bounded, typed and stably paged
    verification: automated-test
    description: |
      GIVEN a ledger holding more entries than one page
      WHEN the browse read is called without a cursor and then with the cursor it returned
      THEN the first page carries the newest entries, newest first, no more than the bound
      AND the second page continues strictly older with no entry repeated across the two
      AND the final page omits the cursor rather than returning it pointing at nothing
      AND a requested page size above the export maximum is clamped to it
      AND a caller holding no role to read the ledger is refused
    revision: "0.1.0"

  - id: SVC_GW_AUDIT_0009
    requirement_ids: ["GW_AUDIT_0009"]
    title: Ledger entries of two marketplaces that held one name carry different identities
    verification: automated-test
    description: |
      GIVEN a marketplace with ledger entries that is removed and whose name is registered again
      WHEN both marketplaces' entries are read through the ledger browse and the export
      THEN every entry concerning a marketplace carries that marketplace's identity, the two
      marketplaces' entries carry different identities under the same name, and an entry that
      concerns no marketplace carries none
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0033
    requirement_ids: ["GW_FACADE_0033"]
    title: A shutdown drains in-flight transfers
    verification: automated-test
    description: |
      GIVEN the packaged application and its deployment chart
      WHEN the shutdown configuration and the pod's grace period are read
      THEN the application is configured to drain on termination
      AND the chart sets a grace period for the orchestrator to wait through it
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0034
    requirement_ids: ["GW_FACADE_0034"]
    title: Liveness and readiness are distinct probes
    verification: automated-test
    description: |
      GIVEN the packaged application and its deployment chart
      WHEN the health groups and the pod's probe paths are read
      THEN liveness names no dependency and readiness names the database and git storage
      AND the two probes address the two distinct paths
      AND both paths are permitted without authentication
    revision: "0.1.0"

  - id: SVC_GW_RETENTION_0001
    requirement_ids: ["GW_RETENTION_0001"]
    title: Retention selects the aged and superseded snapshots and nothing else
    verification: automated-test
    description: |
      GIVEN a marketplace with a snapshot held beyond the configured quarantine age, a non-approved snapshot that a later approved snapshot has superseded, and a recently ingested held snapshot
      WHEN the retention policy is evaluated
      THEN the aged snapshot and the superseded snapshot are selected, each with the criterion that selected it, and the recent snapshot is not
    revision: "0.1.0"

  - id: SVC_GW_RETENTION_0002
    requirement_ids: ["GW_RETENTION_0002"]
    title: A deleted snapshot is marked, keeps its state, and is restorable within the window
    verification: automated-test
    description: |
      GIVEN a snapshot deleted through the administrative API
      WHEN the snapshot is read back and then restored before its purge time
      THEN the deletion carries a reason and a purge time in the future while the vetting state is unchanged, and after the restore the deletion marks are cleared
    revision: "0.1.0"

  - id: SVC_GW_RETENTION_0003
    requirement_ids: ["GW_RETENTION_0003"]
    title: An approved snapshot is never selected and cannot be deleted
    verification: automated-test
    description: |
      GIVEN an approved snapshot that is published to the git facade and would otherwise match every retention criterion
      WHEN the retention policy is evaluated and an administrator requests its deletion
      THEN the snapshot is not among the selected candidates, the deletion request is refused, and the snapshot remains undeleted
    revision: "0.1.0"

  - id: SVC_GW_RETENTION_0004
    requirement_ids: ["GW_RETENTION_0004"]
    title: Compaction removes expired soft deletions and their quarantine reference
    verification: automated-test
    description: |
      GIVEN one soft-deleted snapshot whose restore window has elapsed and one whose window has not
      WHEN the compaction pass runs
      THEN the expired snapshot's record and its pinned reference in the quarantine repository are gone, and the snapshot still inside its window is untouched
    revision: "0.1.0"

  - id: SVC_GW_RETENTION_0005
    requirement_ids: ["GW_RETENTION_0005"]
    title: The ledger records the retention decision, deletion, restore, and removal
    verification: automated-test
    description: |
      GIVEN a snapshot taken through a policy evaluation, a restore, and a compaction pass
      WHEN the audit ledger is read
      THEN it contains an entry for each of the evaluation outcome, the soft deletion with its reason, the restore, and the permanent removal, each with the acting identity and the snapshot commit SHA
    revision: "0.1.0"

  - id: SVC_GW_RETENTION_0006
    requirement_ids: ["GW_RETENTION_0006"]
    title: Portal deletes a snapshot and restores it
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a marketplace with an undecided snapshot
      WHEN the administrator deletes the snapshot from the marketplace detail page and then restores it
      THEN the snapshot is shown as deleted with its restore deadline, and after the restore it is shown as not deleted again
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0001
    requirement_ids: ["GW_VETTING_0001"]
    title: Ingestion records a chain run with a verdict per vetter
    verification: automated-test
    description: |
      GIVEN a registered marketplace whose upstream content is clean
      WHEN the marketplace is ingested and the snapshot's vetting record is read
      THEN a chain run exists for the snapshot's commit SHA holding one verdict per configured vetter, in chain order, each with its findings
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0002
    requirement_ids: ["GW_VETTING_0002"]
    title: A vetter that throws blocks the snapshot instead of being skipped
    verification: automated-test
    description: |
      GIVEN a chain containing a vetter that raises an exception
      WHEN a snapshot is ingested and its vetting record is read
      THEN the failing vetter has an error verdict carrying the failure, the run outcome is blocked, and the snapshot is still held and unserved
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0003
    requirement_ids: ["GW_VETTING_0003"]
    title: The secret scanner finds planted credentials and clears clean content
    verification: automated-test
    description: |
      GIVEN one upstream carrying a cloud access key and a private key block and one upstream carrying neither
      WHEN both are ingested
      THEN the first snapshot's secret-scanning verdict fails with a finding per planted credential naming the file it was found in, and the second snapshot's verdict passes
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0004
    requirement_ids: ["GW_VETTING_0004"]
    title: The prompt-injection scanner finds planted markers in skill instructions
    verification: automated-test
    description: |
      GIVEN an upstream whose skill instructions contain instruction-override phrasing, a credential file path, and an invisible control character
      WHEN the marketplace is ingested
      THEN the prompt-injection verdict fails with a finding for each marker naming the instruction file, and a clean upstream's verdict passes
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0003
    requirement_ids: ["GW_APPROVAL_0003"]
    title: A blocked snapshot is approved only once waivers cover every blocking finding
    verification: automated-test
    description: |
      GIVEN a snapshot whose chain run aggregated to a blocked outcome on more than one finding
      WHEN approval is requested with no waiver, then after one of the blocking findings is waived, and finally after all of them are
      THEN the first two requests are refused naming the findings still uncovered, the snapshot is neither approved nor served after either, and the third approves it
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0005
    requirement_ids: ["GW_VETTING_0005"]
    title: Portal shows the verdicts and refuses approval while the outcome is blocked
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a marketplace whose snapshot has a blocked chain outcome
      WHEN the reviewer opens the snapshot's vetting detail
      THEN the vetter verdicts and their findings are shown and the approval control is refused while the effective outcome is blocked
    revision: "0.3.0"

  - id: SVC_GW_VETTING_0006
    requirement_ids: ["GW_VETTING_0006"]
    title: The ledger records the chain run and the verdicts
    verification: automated-test
    description: |
      GIVEN a snapshot taken through a blocking chain run
      WHEN the audit ledger is read
      THEN it holds an entry for the chain run outcome and an entry per vetter verdict, each with the marketplace, the commit SHA, and the acting identity
    revision: "0.3.0"

  - id: SVC_GW_VETTING_0007
    requirement_ids: ["GW_VETTING_0007"]
    title: A waiver without justification, approver or a future expiry is refused
    verification: automated-test
    description: |
      GIVEN a snapshot carrying a failing vetting finding
      WHEN waivers are requested with no expiry, with an expiry already in the past, and with a blank justification, and then with all fields present
      THEN each of the first three is refused and no waiver is recorded for it, and the fourth is recorded carrying the acting identity as its approver
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0008
    requirement_ids: ["GW_VETTING_0008"]
    title: A waiver suppresses only the finding its scope names
    verification: automated-test
    description: |
      GIVEN a snapshot whose chain run failed on one rule at one path
      WHEN a waiver is written for a different rule, then one for the same rule pinned to a different commit SHA, then one for the same rule under an unrelated path, and finally one for that rule scoped to this snapshot
      THEN the effective outcome stays blocked for the first three and becomes cleared-with-waivers for the last, while the recorded run outcome stays blocked throughout
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0009
    requirement_ids: ["GW_VETTING_0009"]
    title: An expired or revoked waiver stops suppressing its finding
    verification: automated-test
    description: |
      GIVEN a snapshot whose only blocking finding is covered by an active waiver, so its effective outcome is cleared-with-waivers
      WHEN the waiver's expiry passes, and separately when an equivalent waiver is revoked
      THEN in both cases the effective outcome is blocked again and approval is refused, with no scheduled pass having run
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0010
    requirement_ids: ["GW_VETTING_0010"]
    title: Portal waives a finding and lists the waiver
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a marketplace whose snapshot has a blocked chain outcome
      WHEN the reviewer waives the blocking finding from the review surface with a justification and an expiry and then approves the snapshot
      THEN the finding is shown as waived, the waiver is listed with its rule, scope, approver and expiry, the outcome is shown as cleared with waivers, and the approval succeeds
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0011
    requirement_ids: ["GW_VETTING_0011"]
    title: The ledger records waiver creation, use and revocation
    verification: automated-test
    description: |
      GIVEN a waiver created against a blocking finding and used to approve the snapshot, and a second waiver that is revoked
      WHEN the audit ledger is read
      THEN it holds an entry for each waiver's creation carrying the rule, the scope and the expiry, an entry for the waiver that let the approval through, and an entry for the revocation, each with the marketplace and the acting identity
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0012
    requirement_ids: ["GW_VETTING_0012"]
    title: The sweep re-vets the least recently vetted approved snapshots in bounded batches
    verification: automated-test
    description: |
      GIVEN several approved snapshots whose latest chain runs are of different ages, and a held and a rejected snapshot alongside them
      WHEN a re-vetting sweep runs with a batch size smaller than the number of eligible snapshots, and a snapshot is re-vetted on demand
      THEN only approved snapshots are selected, the oldest-vetted ones are taken first, no more than the batch size are re-vetted, each pass records a new chain run carrying its trigger and the chain's vetter versions, and the snapshots' own states are unchanged by the runs
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0013
    requirement_ids: ["GW_VETTING_0013"]
    title: Enforced re-vetting revokes an approved snapshot and stops the facade serving it
    verification: automated-test
    description: |
      GIVEN an approved and published snapshot that a git client can clone, in a gateway configured to enforce re-vetting violations, whose content the chain now objects to
      WHEN the snapshot is re-vetted
      THEN the snapshot moves to the revoked state, a clone of the marketplace fails and the revoked commit can no longer be fetched by reference, the quarantined copy is still present, and re-publishing it succeeds only after a waiver covers the finding and a fresh approve decision is recorded
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0014
    requirement_ids: ["GW_VETTING_0014"]
    title: Warn mode records the violation and never unpublishes
    verification: automated-test
    description: |
      GIVEN an approved and published snapshot whose content the chain now objects to, in a gateway using the default re-vetting mode
      WHEN the snapshot is re-vetted
      THEN the violation is recorded in the ledger and announced as a lifecycle event, the snapshot stays approved, and a git client can still clone the marketplace at the same commit
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0015
    requirement_ids: ["GW_VETTING_0015"]
    title: A vetter error during re-vetting never revokes the snapshot
    verification: automated-test
    description: |
      GIVEN an approved and published snapshot in a gateway configured to enforce re-vetting violations, and a vetter that throws or exceeds its time limit
      WHEN the snapshot is re-vetted, and separately when the run produces no verdict at all
      THEN each run is recorded as inconclusive, the snapshot stays approved and served, and the recorded run still blocks that snapshot's approval
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0016
    requirement_ids: ["GW_VETTING_0016"]
    title: A violation names the identities that fetched the snapshot
    verification: automated-test
    description: |
      GIVEN an approved snapshot that two authenticated identities have cloned through the git facade and one has only asked the refs of
      WHEN a re-vetting run finds a violation on it
      THEN the reported affected identities are exactly the two that received content, each with its fetch count and last fetch time, and the violation and revocation lifecycle events are emitted to a subscriber
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0017
    requirement_ids: ["GW_VETTING_0017"]
    title: The ledger records the retroactive violation and every state transition
    verification: automated-test
    description: |
      GIVEN an approved snapshot that an identity has fetched, re-vetted under enforcement into a violation and then re-approved after a waiver
      WHEN the audit ledger is read
      THEN it holds the re-vetting run's outcome with its trigger, the violation with the objecting vetters and the mode in force, an entry naming the affected identity, the revocation, the unpublication, and the fresh approval, each with the marketplace and the acting identity
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0018
    requirement_ids: ["GW_VETTING_0018"]
    title: Portal shows a revoked snapshot, its violation and who fetched it
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a marketplace whose approved snapshot has been revoked by a re-vetting violation
      WHEN the reviewer opens the marketplace
      THEN the snapshot is shown as revoked with the reason, the blocking findings of the re-vetting run and the identities that had fetched it are listed, and a control re-vets the snapshot on demand
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0010
    requirement_ids: ["GW_INGEST_0010"]
    title: Sync mode is per marketplace, defaulted, changeable, and never bypasses approval
    verification: automated-test
    description: |
      GIVEN a newly registered marketplace
      WHEN its sync mode is read, changed by an operator to each valid mode, and a sync-triggered ingestion runs
      THEN the mode defaults to on-demand, each change is applied and an invalid mode is refused, and every sync-triggered snapshot lands held (or rejected on policy violation) and is never approved or published by any sync path
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0011
    requirement_ids: ["GW_INGEST_0011"]
    title: Scheduled sweep polls only scheduled marketplaces, oldest first, bounded, and survives one failure
    verification: automated-test
    description: |
      GIVEN marketplaces in each sync mode, one of them with an unreachable upstream
      WHEN the scheduled sweep runs with a batch bound smaller than the eligible set
      THEN only scheduled marketplaces are ingested, selection is least-recently-attempted first and respects the bound, the unreachable marketplace's failure is recorded without stopping the rest, and its attempt stamp makes it eligible again on a later pass
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0012
    requirement_ids: ["GW_INGEST_0012"]
    title: Webhook endpoint accepts only a validly signed request and never trusts the payload
    verification: automated-test
    description: |
      GIVEN a marketplace in webhook mode with a gateway-generated secret returned exactly once
      WHEN the inbound endpoint receives a validly signed request, requests with a missing, malformed, or wrong-secret signature, a tampered body, an oversized body, and requests for an unknown marketplace and one not in webhook mode
      THEN only the validly signed request triggers ingestion of the registered upstream's default branch (a foreign URL or ref in the payload is ignored), a held snapshot appears for it, and every other request is rejected with no snapshot created
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0013
    requirement_ids: ["GW_INGEST_0013"]
    title: A failing upstream never affects what the facade serves
    verification: automated-test
    description: |
      GIVEN a marketplace with an approved, published snapshot whose upstream then becomes unreachable
      WHEN a scheduled sweep and a validly signed webhook trigger both attempt ingestion
      THEN both attempts fail internally without changing any snapshot state or published reference, and a real git clone through the facade still serves the approved SHA
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0014
    requirement_ids: ["GW_INGEST_0014"]
    title: Mode changes and sync-triggered ingestions are on the ledger
    verification: automated-test
    description: |
      GIVEN a marketplace whose sync mode is changed and which is then ingested by the scheduler and by a signed webhook request
      WHEN the audit ledger is read
      THEN it contains the mode change with the acting identity and each sync-triggered ingestion with the snapshot SHA and a trigger identity distinguishing scheduler and webhook from a human, and a snapshot-ingested lifecycle event was emitted for each
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0003
    requirement_ids: ["GW_FACADE_0003"]
    title: The catalog aggregates exactly the served estate under namespaced paths
    verification: automated-test
    description: |
      GIVEN two marketplaces with approved snapshots and a third with only a held snapshot
      WHEN the catalog is cloned through the facade with a real git client
      THEN the clone contains each approved marketplace's content under a subdirectory named after it, the merged manifest lists their plugins with marketplace-prefixed names and relative sources into those subdirectories, and the held-only marketplace appears nowhere
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0004
    requirement_ids: ["GW_FACADE_0004"]
    title: Publications and revocations reshape the catalog on their own
    verification: automated-test
    description: |
      GIVEN a served catalog containing a marketplace whose snapshot is then revoked under enforcing re-vetting, and another marketplace approved afterwards
      WHEN the catalog is fetched again with no manual regeneration
      THEN the revoked marketplace's subtree and plugins are gone and its SHA is unreachable from every advertised catalog reference, the newly approved marketplace is present, and with nothing serving at all the catalog still serves a manifest with an empty plugin list
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0005
    requirement_ids: ["GW_FACADE_0005"]
    title: Catalog constituents, fetch audit, manual rebuild, and the reserved name
    verification: automated-test
    description: |
      GIVEN a served catalog
      WHEN its constituents are read from the API, it is cloned through the facade, a manual regeneration is requested, and a marketplace registration under the catalog's name is attempted
      THEN the API lists exactly the marketplace-and-SHA pairs the clone contains, the clone is on the fetch ledger under the catalog's name, the manual regeneration lands on the ledger with the acting identity, and the registration is refused
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0006
    requirement_ids: ["GW_AUTH_0006"]
    title: Scoped tokens fetch only their marketplaces and cannot probe the rest
    verification: automated-test
    description: |
      GIVEN marketplaces with approved snapshots and tokens scoped to a subset, to the catalog, and to nothing
      WHEN each token clones in-scope and out-of-scope marketplaces through the facade
      THEN in-scope clones succeed, an out-of-scope clone fails with the same answer as a marketplace that does not exist, the unscoped token clones everything, and creating a token naming an unknown scope is refused
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0007
    requirement_ids: ["GW_AUTH_0007"]
    title: An expired token is refused at authentication with no sweep involved
    verification: automated-test
    description: |
      GIVEN a token created with an expiry that then passes, and a configured maximum lifetime
      WHEN the expired token is presented to the facade and a creation beyond the cap is requested
      THEN the expired token is refused exactly like a revoked one with no background process having run, the over-cap creation is refused rather than shortened, and a token within the cap works until its deadline
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0008
    requirement_ids: ["GW_AUTH_0008"]
    title: Rotation changes the secret and nothing else
    verification: automated-test
    description: |
      GIVEN a live scoped token with an expiry
      WHEN its owner rotates it, another principal attempts to rotate it, and a rotation of a revoked token is attempted
      THEN the new secret authenticates with the identical name, scopes and expiry deadline and records its predecessor, the old secret is refused immediately, and the foreign and dead-token rotations are refused
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0009
    requirement_ids: ["GW_AUTH_0009"]
    title: Every fetch names its token and the token lifecycle is on the ledger
    verification: automated-test
    description: |
      GIVEN a principal with two tokens fetching through the facade
      WHEN the ledger and the audit export are read
      THEN each facade entry carries the id of the token that authenticated it, the export rows carry the same attribution, and the tokens' creation, rotation and revocation appear with the acting identity, name and scopes
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0010
    requirement_ids: ["GW_AUTH_0010"]
    title: Deny-by-default walk of every mutation and every read, both derived from the route table
    verification: automated-test
    description: |
      GIVEN a gateway and a session holding no role
      WHEN the no-role session calls every REST API mutation route and every REST API read route — both sets asserted complete against the running application's own route table, and every read classified as privileged, scoped to a marketplace, scoped to the session, or open
      THEN every mutation, every privileged read and every marketplace-scoped read is refused with an authorization error while the browsing surface and the session's own tokens still work
    revision: "0.3.0"

  - id: SVC_GW_AUTH_0011
    requirement_ids: ["GW_AUTH_0011"]
    title: An approver acts on its marketplace and is refused every other, including by id
    verification: automated-test
    description: |
      GIVEN role enforcement enabled and a principal granted approver of marketplace A, with content in marketplaces A and B
      WHEN the approver ingests, approves, rejects, re-vets, waives and reads the fetcher report of content of A, and then attempts the same operations against B by marketplace name and through bare snapshot and waiver ids belonging to B
      THEN every operation on A succeeds, and every operation on B is refused with an authorization error regardless of whether the route named the marketplace or only carried an id
    revision: "0.2.0"

  - id: SVC_GW_AUTH_0012
    requirement_ids: ["GW_AUTH_0012"]
    title: An auditor reads the ledger and listings and is refused every mutation
    verification: automated-test
    description: |
      GIVEN role enforcement enabled and a principal granted auditor
      WHEN the auditor reads the ledger, the export stream, the webhook subscriber, delivery and sink listings and the retention candidates, and then attempts every REST API mutation route
      THEN every read succeeds and every mutation is refused with an authorization error
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0013
    requirement_ids: ["GW_AUTH_0013"]
    title: Grant lifecycle is admin-only, validated, audited, and cannot revoke a config admin
    verification: automated-test
    description: |
      GIVEN role enforcement enabled, a configuration-bootstrapped admin, and a session with no role
      WHEN the no-role session attempts to grant, the admin grants and revokes approver and auditor roles, an approver grant omitting its marketplace and one naming an unknown marketplace are attempted, a duplicate grant is attempted, and the session identity endpoint is read by the admin and by a granted principal
      THEN the no-role grant is refused with an authorization error, the admin's grant and revocation succeed and each lands on the append-only ledger with actor, target, role and marketplace, the malformed and duplicate grants are refused, the configuration-bootstrapped admin holds admin with no database row an API call could revoke, and the identity endpoint reports enforcement state and each caller's effective roles
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0002
    requirement_ids: ["GW_RELEASE_0002"]
    title: The release workflow carries the multi-arch publication contract
    verification: automated-test
    description: |
      GIVEN the repository's release workflow definition
      WHEN the packaging test validates it
      THEN the image job builds linux/amd64 and linux/arm64 from one build rather than a matrix over runners, declares no tag trigger of its own so a hand-pushed tag cannot publish, gates every publish step to the release workflow alone so that neither a main-branch push, a schedule nor a bare manually dispatched run ever reaches one, holds the permissions publishing and attestation require, smoke-tests the image before anything is pushed, publishes to the project's registry namespace under the released version and under no other tag, surfaces the published index digest in the job summary, and attests the CycloneDX SBOM against that digest
    revision: "0.5.0"

  - id: SVC_GW_APPROVAL_0004
    requirement_ids: ["GW_APPROVAL_0004"]
    title: The eligibility report and the approval gate agree, computed from the same rule
    verification: automated-test
    description: |
      GIVEN a snapshot ingested moments ago under a configured minimum release age
      WHEN its eligibility is read from the report endpoint, an approval is then attempted, and the snapshot is aged past the window and read again
      THEN the report and the refusal the approval attempt provokes carry the same eligibility, age and remaining time, and once the window has cleared the report and a real approval agree that it has
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0004.1
    requirement_ids: ["GW_APPROVAL_0004.1"]
    title: A backdated commit gains nothing, and re-ingestion does not restart the clock
    verification: automated-test
    description: |
      GIVEN a commit whose own committer date claims to be far older than the configured minimum age, and a snapshot already aged past the window by moving its first-ingested instant back
      WHEN the backdated commit is ingested and approval is attempted, and the already-aged snapshot's commit is ingested a second time
      THEN the backdated commit is refused exactly as a genuinely young one, and re-ingestion leaves the first-ingested instant, and therefore the eligibility, untouched
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0004.2
    requirement_ids: ["GW_APPROVAL_0004.2"]
    title: Eligibility turns over at the exact boundary instant, rejection is never gated, and zero disables the gate
    verification: automated-test
    description: |
      GIVEN the eligibility rule evaluated directly as a function of the first-ingested instant, the current instant and the configured minimum, a snapshot under a non-zero configured minimum, and a second gateway left at the zero default
      WHEN the rule is evaluated at exactly the boundary instant and one nanosecond before it, a snapshot is rejected before its window has cleared, and approvals are attempted on the gateway left at the default
      THEN the snapshot is eligible at exactly first-ingested-plus-minimum and not one moment before, rejection succeeds with no age check at all, and every approval on the default gateway succeeds exactly as it did before the setting existed
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0004.3
    requirement_ids: ["GW_APPROVAL_0004.3"]
    title: A young snapshot is refused with a conflict naming the setting, the age and the remaining wait, and nothing is published
    verification: automated-test
    description: |
      GIVEN a snapshot the gateway ingested moments ago under a configured minimum release age
      WHEN its approval is attempted
      THEN the attempt is refused with a conflict naming the configured setting, the snapshot's age and the time remaining, the snapshot stays in the held state, and a client cloning the marketplace receives nothing published for it
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0004.4
    requirement_ids: ["GW_APPROVAL_0004.4"]
    title: The eligibility report agrees with the gate, and remaining time is rendered as a reviewer reads it
    verification: automated-test
    description: |
      GIVEN a snapshot below the configured minimum age
      WHEN its eligibility is read from the report endpoint before and after the window clears, and the remaining duration is formatted for display
      THEN the report shows ineligible with the same remaining seconds an approval attempt's refusal would carry, shows eligible with zero remaining once the window clears, and coarse durations render the way a reviewer reads them (`2d 4h`, `45m`, `30s`)
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0004.5
    requirement_ids: ["GW_APPROVAL_0004.5"]
    title: Every approval and every age-refused approval leaves its age or the refusal on the ledger
    verification: automated-test
    description: |
      GIVEN a snapshot that is refused for being too young, and a second snapshot aged past the window
      WHEN the refusal is provoked and the second snapshot is approved
      THEN the refusal is on the append-only ledger naming the minimum-release-age control and the time remaining, and the approval's ledger entry carries the snapshot's ingestion age
    revision: "0.1.0"

  # SVC_GW_0074 is deliberately unused — see the matching note on GW_0074 in
  # requirements.yml. The id is retired, not awaiting a change.

  - id: SVC_GW_OBSERVABILITY_0001
    requirement_ids: ["GW_OBSERVABILITY_0001"]
    title: The adoption report aggregates the windowed ledger per marketplace, SHA and identity
    verification: automated-test
    description: |
      GIVEN two approved marketplaces fetched through the facade by two distinct identities, and a ledger entry planted older than the report window
      WHEN the adoption report is read for that window
      THEN each marketplace carries its content-transferring fetch count, its distinct identity count and its most recent fetch time, the per-SHA breakdown marks the served tip as current, the too-old entry is not counted at the narrow window and is counted at the wide one, and the deny-by-default authorization walk classifies both adoption reads as privileged like the ledger itself
    revision: "0.1.0"

  - id: SVC_GW_OBSERVABILITY_0002
    requirement_ids: ["GW_OBSERVABILITY_0002"]
    title: Staleness names exactly the identities not on the served tip, retracted content included
    verification: automated-test
    description: |
      GIVEN one identity that fetched a snapshot later superseded by a newer approval and another identity that fetched the new tip
      WHEN the staleness report is read, and read again after the marketplace stops serving entirely
      THEN the first report names only the superseded identity with its last-received SHA and the served tip it diverges from, and the second names every holder of the retracted content with an absent served tip
    revision: "0.1.0"

  - id: SVC_GW_OBSERVABILITY_0003
    requirement_ids: ["GW_OBSERVABILITY_0003"]
    title: The skills_gateway metrics are recorded with export left at its disabled default
    verification: automated-test
    description: |
      GIVEN a gateway running with telemetry export at its disabled default
      WHEN a snapshot is ingested, one snapshot is approved and another rejected, and content is fetched through the facade
      THEN the meter registry carries the ingestion timing observation tagged with its outcome, the approval observation tagged per decision, and the facade fetch counter tagged per event kind, all under the skills_gateway prefix, and an approval the vetting gate blocks still surfaces its refusal unchanged
    revision: "0.1.0"

  - id: SVC_GW_OBSERVABILITY_0004
    requirement_ids: ["GW_OBSERVABILITY_0004"]
    title: The portal adoption page shows a real facade fetch and its identity
    verification: automated-test
    description: |
      GIVEN a marketplace approved in the portal and cloned through the facade with a token minted in the portal
      WHEN the operator opens the Adoption page
      THEN the marketplace's fetch appears in the adoption report with the fetching identity counted, and the page presented its loading-to-loaded transition without an error state
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0014
    requirement_ids: ["GW_AUTH_0014"]
    title: The setup wizard composes origin-derived commands and holds show-once
    verification: automated-test
    description: |
      GIVEN a registered marketplace and its detail page in a real browser
      WHEN the user opens the setup wizard, mints a token inside it, and later closes and reopens the wizard
      THEN the marketplace-add command and credential configuration carry the page's own origin and the marketplace's facade clone path, the minted cleartext appears in the snippets only while the wizard stays open, and after reopening the snippets carry a placeholder and no previously issued secret is displayed
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0015
    requirement_ids: ["GW_INGEST_0015"]
    title: File inspection is tree-addressed, capped, binary-aware, and approver-scoped
    verification: automated-test
    description: |
      GIVEN an ingested snapshot whose commit carries a text file, a file larger than the size limit and a binary file, and — in an enforcement-enabled context — a session with no role, an auditor, an approver of another marketplace, an approver of the owning marketplace and an admin
      WHEN the file tree, each file, a path absent from the commit tree and a traversal-shaped path are requested, and the enforcement-enabled sessions attempt the reads
      THEN the tree lists the pinned commit's paths, the text file returns its content, the oversized file returns truncated content with an explicit marker, the binary file returns metadata without text, the absent and traversal-shaped paths answer not-found, and under enforcement the reads succeed only for the owning approver and the admin
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0016
    requirement_ids: ["GW_INGEST_0016"]
    title: The diff names the served baseline and the exact delta, or the absence of a baseline
    verification: automated-test
    description: |
      GIVEN a marketplace with an approved, served snapshot and a later held snapshot whose commit modifies, adds and removes files, and a second marketplace serving nothing
      WHEN each snapshot's diff is requested
      THEN the held snapshot's diff names the served commit as its baseline and reports exactly the modified, added and removed paths with a textual diff for text files, and the unserved marketplace's diff reports no baseline with every path reported as added
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0005
    requirement_ids: ["GW_APPROVAL_0005"]
    title: The preview pane walks a held snapshot's tree and diff in a real browser
    verification: automated-test
    description: |
      GIVEN a marketplace approved and served, whose upstream then changes and is re-ingested into a held snapshot, in a real browser
      WHEN the reviewer opens the held snapshot's preview pane, selects the skill's SKILL.md, and switches to the diff view
      THEN the file tree lists the snapshot's paths, the SKILL.md renders as formatted text with embedded HTML shown as text rather than interpreted, and the diff view names the modified and added paths against the served baseline
    revision: "0.1.0"

  - id: SVC_GW_ESTATE_0001
    requirement_ids: ["GW_ESTATE_0001"]
    title: Startup reconciliation converges the declared estate additively and idempotently
    verification: automated-test
    description: |
      GIVEN a gateway configured with a declared estate of marketplaces, role grants, a webhook subscriber and an audit sink, plus objects created through the API that the declaration does not mention
      WHEN the application starts and a further reconciliation is then run against the unchanged declaration
      THEN the declared objects exist as if created through the API with every applied change on the ledger under its API event name and the reconciler actor, the undeclared API-created objects are untouched, and the second reconciliation performs no writes and appends nothing to the ledger
    revision: "0.1.0"

  - id: SVC_GW_ESTATE_0002
    requirement_ids: ["GW_ESTATE_0002"]
    title: Declared marketplaces face the same registration gate as the API
    verification: automated-test
    description: |
      GIVEN declarations containing a marketplace with a disallowed URL scheme, one under the reserved catalog name, one whose declared URL differs from its registered URL, one declaring webhook sync mode, and a valid one declaring scheduled sync
      WHEN reconciliation runs
      THEN the invalid entries each fail with a ledger record and create or change nothing, the registered marketplace keeps its stored URL, and the valid entry is registered with its sync mode applied through the audited sync-mode path
    revision: "0.1.0"

  - id: SVC_GW_ESTATE_0003
    requirement_ids: ["GW_ESTATE_0003"]
    title: Declared grants reconcile through the audited grant path
    verification: automated-test
    description: |
      GIVEN a declaration granting an approver on a marketplace declared in the same configuration, an auditor globally, and an approver on a marketplace that does not exist, alongside an API-created grant the declaration does not mention
      WHEN reconciliation runs
      THEN the valid grants exist and take effect under role enforcement with ledger entries naming the reconciler actor, the grant for the unknown marketplace fails as an isolated entry, the API-created grant survives, and re-running the reconciliation grants nothing twice
    revision: "0.1.0"

  - id: SVC_GW_ESTATE_0004
    requirement_ids: ["GW_ESTATE_0004"]
    title: Declared receiver secrets are write-only, rotated idempotently, floored in length
    verification: automated-test
    description: |
      GIVEN a declared webhook subscriber and audit sink with operator-supplied secrets, then the same declaration with one secret value changed, and declarations carrying a blank and a too-short secret
      WHEN reconciliation runs after each state
      THEN the stored secrets match the declaration with the sink's cursor set only at creation, the changed value rotates the stored secret with a ledger record that does not contain it, the unchanged values cause no write, the blank and too-short secrets each fail as isolated entries, and no secret value appears in the reconciliation report or on the ledger
    revision: "0.1.0"

  - id: SVC_GW_ESTATE_0005
    requirement_ids: ["GW_ESTATE_0005"]
    title: A failing entry is loud but never fatal, and the report is answerable
    verification: automated-test
    description: |
      GIVEN a gateway whose declared estate contains one invalid entry among valid ones
      WHEN the application starts and the report endpoint and reconcile trigger are then exercised under role enforcement
      THEN the application serves with the valid entries applied, the invalid entry is on the ledger and in the report with its reason, the report endpoint answers auditors and admins and refuses sessions with no role, and the trigger endpoint refuses non-admins and records each admin trigger on the ledger with the acting identity
    revision: "0.1.0"

  - id: SVC_GW_WEBHOOK_0005
    requirement_ids: ["GW_WEBHOOK_0005"]
    title: The registry is served, excludes the export event, and the portal composes a filter from it
    verification: automated-test
    description: |
      GIVEN a gateway with the lifecycle event registry and — in an enforcement-enabled context — a session with no role and an auditor session
      WHEN the event registry is requested, and an operator registers a subscriber in the portal by selecting events, selecting all of them, and narrowing the list by typing
      THEN the response lists every event the dispatcher can emit and does not contain the audit export event, the read is refused below auditor and allowed for the auditor, the type-ahead narrows the offered list, selecting every event submits the wildcard filter and a partial selection submits the comma-delimited names, and a stored filter naming an event absent from the registry is marked as unknown
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0006
    requirement_ids: ["GW_APPROVAL_0006"]
    title: Rule lifecycle is compiled, gated, audited, and declarable
    verification: automated-test
    description: |
      GIVEN an admin session, sessions below admin under role enforcement, and a declared estate containing a valid rule, an identical already-stored rule, and a rule whose expression does not compile
      WHEN rules are created, listed, updated and deleted through the API with valid, syntactically invalid, non-boolean and duplicate-named expressions, and reconciliation runs
      THEN valid mutations succeed with a ledger entry each and reads answer auditors and admins, invalid and non-boolean expressions are refused with a validation error and are not stored, a duplicate name is refused as a conflict, mutations and reads below their required role are refused, the valid declared rule is created and enforced, the identical declared rule reconciles with zero writes, and the non-compiling declared rule fails as an isolated entry without blocking the others
    revision: "0.1.0"
  - id: SVC_GW_APPROVAL_0007
    requirement_ids: ["GW_APPROVAL_0007"]
    title: The policy gate denies on match and on every error path, publishing nothing
    verification: automated-test
    description: |
      GIVEN held snapshots whose content includes skills declaring shell tools, a skill with malformed SKILL.md frontmatter, and enabled rules that match, do not match, are disabled, error at runtime, and contain a comprehension bomb
      WHEN approval is requested for each snapshot
      THEN a matching rule refuses the approval with a conflict naming the rule, the snapshot stays held and the marketplace's served tip is unchanged, a non-matching enabled rule and a disabled matching rule do not refuse, a rule that errors at runtime refuses naming the rule, the comprehension bomb refuses within the evaluation bound rather than hanging, malformed frontmatter refuses under a tools rule, and with no deciding rule the approval succeeds and is served
    revision: "0.1.0"
  - id: SVC_GW_APPROVAL_0008
    requirement_ids: ["GW_APPROVAL_0008"]
    title: Every deciding rule lands on the ledger with its outcome
    verification: automated-test
    description: |
      GIVEN a held snapshot and two enabled rules of which one matches and one errors at evaluation
      WHEN approval is requested and refused
      THEN the ledger carries one policy-denied entry per deciding rule naming the rule, the snapshot SHA, the marketplace and the acting reviewer, the matched rule's entry records a match and the erroring rule's entry records the evaluation failure, and no snapshot-approved entry is written
    revision: "0.1.0"
  - id: SVC_GW_APPROVAL_0009
    requirement_ids: ["GW_APPROVAL_0009"]
    title: The playground evaluates real snapshots and is provably inert
    verification: automated-test
    description: |
      GIVEN a held snapshot with skills content, an approver of its marketplace and — under role enforcement — a session that cannot approve it
      WHEN expressions that match, do not match, fail to compile and fail to evaluate are submitted to the playground, and the unauthorized session submits one
      THEN the answers report matched, not matched, the compile error and the evaluation error respectively without echoing snapshot content, the unauthorized session is refused, and after all calls the ledger row count, the rule set, the snapshot state and the marketplace's served state are exactly what they were before
    revision: "0.1.0"
  - id: SVC_GW_VETTING_0019
    requirement_ids: ["GW_VETTING_0019"]
    title: License detection is deterministic and names unknown and missing states
    verification: automated-test
    description: |
      GIVEN snapshots carrying an MIT license file, an Apache-2.0 COPYING file, a license file whose only identification is an SPDX-License-Identifier tag, a manifest declaring a plugin license, a license file of unrecognizable text, and no license information at all
      WHEN each snapshot is ingested and the license vetter's verdict is read
      THEN each identified license is a finding naming its SPDX identifier and located at its file path or manifest field, the unrecognizable file yields an unknown-license finding at its path, the snapshot without license information yields a missing-license finding, and re-running the chain over the same content yields the same findings
    revision: "0.2.0"
  - id: SVC_GW_VETTING_0020
    requirement_ids: ["GW_VETTING_0020"]
    title: Ban and allow lists block through the ordinary gate, defaults only warn
    verification: automated-test
    description: |
      GIVEN a gateway with default license configuration, one with a ban list naming a license a fixture carries, and one with a non-empty allow list the fixtures variously satisfy, miss, or defeat with unknown or missing licenses
      WHEN the fixtures are ingested and approval is attempted
      THEN under defaults identified licenses are informational and unknown or missing ones warn without blocking approval, the banned license and the allow-list misses each block approval naming their finding through the standard vetting-blocked refusal, a scoped expiring waiver on the finding's rule identifier is what lets the approval through, the verdicts are on the append-only ledger, and the recorded chain identity reflects the policy in force
    revision: "0.1.0"
  - id: SVC_GW_VETTING_0021
    requirement_ids: ["GW_VETTING_0021"]
    title: The licenses endpoint reports detections with their policy evaluation
    verification: automated-test
    description: |
      GIVEN a snapshot carrying an identified license, an unknown license file and a manifest license, under a configured ban list naming one of them
      WHEN its license report endpoint is requested, and a report is requested for a snapshot id that does not exist
      THEN the response lists each detection with its SPDX identifier or unknown state, its file path or manifest field source, and its evaluation under the configured policy including the banned entry marked as banned, and the unknown snapshot id answers not-found
    revision: "0.1.0"
  - id: SVC_GW_APPROVAL_0010
    requirement_ids: ["GW_APPROVAL_0010"]
    title: The supply side of a snapshot cannot approve it under enforcement, and an independent reviewer is not obstructed
    verification: automated-test
    description: |
      GIVEN a gateway enforcing the approval separation-of-duties rule, and snapshots whose marketplace registrant, ingestion actor and waiver author are recorded identities
      WHEN the ingestion actor, the marketplace registrant and the author of a waiver the approval relies on each attempt to approve, over the service and over the HTTP endpoint, and afterwards an independent reviewer approves the same snapshots, and snapshots ingested by the scheduled sweep, by a webhook trigger and by an unrecorded actor are approved
      THEN each conflicted attempt is refused with a conflict response naming the conflicting acts, every refused snapshot remains undecided with no reviewer recorded and nothing served by the facade, the independent reviewer's approval succeeds and is served, and the automated-trigger and unrecorded-actor snapshots are approved by anyone the role model allows
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0011
    requirement_ids: ["GW_APPROVAL_0011"]
    title: The recording mode is the default, publishes the approval, and puts the conflict on the ledger
    verification: automated-test
    description: |
      GIVEN a gateway left at the default approval separation-of-duties mode
      WHEN a reviewer who registered the marketplace and triggered the ingestion approves the snapshot, an independent reviewer approves another, and a refusal is provoked under enforcement
      THEN the default mode is the recording one, the conflicted approval succeeds and its content is served, a conflict entry naming the acting identity, the snapshot, the mode and each conflicting act is appended to the ledger beside the approval entry, the independent approval appends no such entry, and the enforced refusal appends its own conflict entry recording that the approval did not proceed
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0015
    requirement_ids: ["GW_AUTH_0015"]
    title: A malformed mapping never runs, and a valid one grants exactly and visibly what it says
    verification: automated-test
    description: |
      GIVEN gateways configured with an unknown role, a blank claim value, an unscoped approver mapping and a scoped global mapping, and a separate gateway configured with a valid admin claim mapping and no stored grant for the acting principal
      WHEN each malformed gateway is started, and a session carrying the mapped claim value exercises an admin-only operation and reads the session identity endpoint on the valid gateway
      THEN each malformed mapping refuses startup, while the valid gateway lets the mapped session perform the admin-only operation with no grant row behind it and reports the role on the identity endpoint with its source named as the claim mapping
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0015.1
    requirement_ids: ["GW_AUTH_0015.1"]
    title: Claim-derived roles compose, scope correctly, and never widen past an exact match
    verification: automated-test
    description: |
      GIVEN role enforcement with claim mappings to admin, to an approver scoped to one marketplace and to auditor, no stored grant for the acting principals, and a randomized sweep of claim payloads including near-misses of every mapped value by prefix, substring, case or whitespace
      WHEN sessions carrying the mapped claim values exercise the operations their role allows, a claim-derived approver attempts another marketplace by name and through bare snapshot and waiver ids, a claim-derived auditor attempts a mutation, a personal access token, the development escape hatch and a credential carrying a forged claim under an unmapped name attempt privileged operations, a credential with no identity-provider claims is evaluated, and the randomized payloads are evaluated against the mapping table
      THEN each mapped session may do exactly what its role allows and nothing past its scope, the near-miss values and the claimless or non-identity-provider credentials confer nothing, the derived roles union with configured and granted roles without altering deny-by-default, approver scoping or the auditor's read-only guarantee, and every random payload's granted roles agree exactly with an independent exact-match computation over the same mapping table
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0015.2
    requirement_ids: ["GW_AUTH_0015.2"]
    title: A malformed mapping refuses startup; a mapping naming an unregistered marketplace does not
    verification: automated-test
    description: |
      GIVEN mapping tables naming an unknown role, a blank claim value, an unscoped approver mapping and a scoped global mapping, and a separate mapping naming a marketplace that is not registered
      WHEN a mapper is constructed from each table
      THEN the four malformed tables each refuse construction naming the offending mapping, while the mapping naming an unregistered marketplace is accepted and, until that marketplace exists, matches nothing
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0015.3
    requirement_ids: ["GW_AUTH_0015.3"]
    title: The identity endpoint names the source of every effective role, including through a real login
    verification: automated-test
    description: |
      GIVEN a session holding a role by configuration, one by stored grant, one by claim mapping alone, and one holding the same role by both a stored grant and a claim, established through the mocked identity provider in the same way a real browser session is
      WHEN the session identity endpoint is read in each case
      THEN it names the role's source as configuration, grant or claim respectively, and a role held by both a grant and a claim is reported once, attributed to the grant
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0016
    requirement_ids: ["GW_AUTH_0016"]
    title: A truncated claim is reported, not mistaken for an empty one
    verification: automated-test
    description: |
      GIVEN role enforcement enabled with claim mappings configured
      WHEN a session whose token omits the configured claim but carries the provider's truncation indicator is established, and a session whose token simply carries no memberships is established
      THEN the truncated session is reported as truncated on the session identity endpoint, the detection is logged, and it holds no derived role, while the session with no memberships is not reported truncated
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0017
    requirement_ids: ["GW_AUTH_0017"]
    title: The principal claim is configurable and a foreign issuer establishes no session
    verification: automated-test
    description: |
      GIVEN a gateway configured with an expected issuer and a principal-name claim other than the subject, and a second gateway left at the defaults
      WHEN an identity token from a different issuer is presented, one from the expected issuer is presented, and the session identity endpoint is read on both gateways
      THEN the foreign-issuer token is refused and establishes no session, the matching one succeeds and the identity endpoint reports the configured claim's value which the role lookups key on, and the default gateway behaves exactly as before while logging that no expected issuer is configured
    revision: "0.1.0"
  - id: SVC_GW_FACADE_0006
    requirement_ids: ["GW_FACADE_0006"]
    title: A hosted marketplace registers without an upstream and is never fetched from one
    verification: automated-test
    description: |
      GIVEN a gateway with no marketplaces registered
      WHEN a marketplace is registered as gateway-hosted with no clone URL, a hosted registration supplying a URL is attempted, a non-hosted registration omitting one is attempted, a change of the hosted marketplace's refresh strategy is attempted, the marketplace is described through the API, and the surfaces that report an upstream are exercised for it
      THEN the hosted registration succeeds and creates its origin repository, the registration supplying a URL and the one omitting one are both refused, the refresh-strategy change is refused, the description names the origin, the rewrite policy and the publish location, and every surface that would have reported an upstream answers without one rather than failing
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0007
    requirement_ids: ["GW_FACADE_0007"]
    title: Only an explicitly push-scoped token publishes, and only the single lineage, forward
    verification: automated-test
    description: |
      GIVEN a hosted marketplace, a second hosted marketplace, a token scoped to push to the first, a token with fetch scopes only, a token whose fetch scope is the unscoped every-marketplace form, and a token predating push scopes
      WHEN each token attempts a real git push of the lineage reference to the first marketplace, the push-scoped token attempts the second marketplace and a name that escapes the storage layout, the push-scoped token attempts a second branch, a tag and a reference deletion, a non-fast-forward push is attempted under each rewrite policy, and a push is attempted against the endpoint that serves approved content
      THEN only the push-scoped token publishes to the marketplace it names, every other token is refused, the second marketplace and the escaping name answer as not found, the second branch, the tag and the deletion are refused, the non-fast-forward is refused under the default policy leaving the tip unchanged and accepted under the permissive one with both tips on the append-only ledger, and the serving endpoint refuses the push outright
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0017
    requirement_ids: ["GW_INGEST_0017"]
    title: A push is quarantined, vetted, held, and served only once approved
    verification: automated-test
    description: |
      GIVEN a hosted marketplace with a push-scoped token, and fixtures carrying respectively clean content, a planted credential, and a manifest declaring a non-local plugin source
      WHEN each fixture is pushed, the served endpoint is cloned before and after approval, and an approved snapshot is subsequently revoked
      THEN each push produces a snapshot identified by the pushed commit SHA, the clean one is held with a passing vetting chain, the planted credential is held with findings, the non-local manifest is rejected, the clone before approval fails as it does for a marketplace that serves nothing, the clone after approval returns exactly the pushed content, and the clone after revocation fails again
    revision: "0.1.0"
  - id: SVC_GW_AUTH_0018
    requirement_ids: ["GW_AUTH_0018"]
    title: A session credential's life is the gateway's to set, and it can never publish
    verification: automated-test
    description: |
      GIVEN a gateway with a configured session credential lifetime, an authenticated browser session, a hosted marketplace, and a second marketplace
      WHEN a session credential is requested, one is requested while supplying a lifetime of the caller's own, one narrowed to a single marketplace is used against another, one is used to push to the hosted marketplace, one is rotated, an ordinary access token is created alongside, and a credential from a gateway whose configured lifetime has already elapsed is presented
      THEN every session credential expires at the configured lifetime regardless of what the caller asked for, none may publish, a narrowed one is refused the marketplace it does not name, the rotated one keeps both its deadline and its session-derived mark, the session credentials are reported as session-derived while the ordinary token is not, and the elapsed one fails authentication by comparison at use rather than by any scheduled process
    revision: "0.1.0"

  - id: SVC_GW_API_0002
    requirement_ids: ["GW_API_0002"]
    title: The served contract declares the build's version
    verification: automated-test
    description: |
      GIVEN a gateway built from a working tree whose version is derived from git state
      WHEN the API contract document is served
      THEN the version it declares is that build's version, and not a fixed literal
    revision: "0.1.0"

  - id: SVC_GW_API_0003
    requirement_ids: ["GW_API_0003"]
    title: The published contract matches the served contract
    verification: automated-test
    description: |
      GIVEN the API contract document published in the repository
      WHEN the build compares it against the document the application serves
      THEN the two are identical apart from the declared release version
      AND a divergence fails the build, naming the command that regenerates the published copy
    revision: "0.1.0"

  - id: SVC_GW_API_0004
    requirement_ids: ["GW_API_0004"]
    title: Breaking contract changes are refused unless declared
    verification: automated-test
    description: |
      GIVEN a proposed change and the contract that change branched from
      WHEN the change removes or narrows part of that contract
      THEN it is refused unless it is both marked as a deliberate break and declared
      as breaking by the commit that ships it
      AND the refusal states what a deliberate breaking change is required to do instead
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0003
    requirement_ids: ["GW_RELEASE_0003"]
    title: The release workflow definition ties the tag, every publisher, verification and promotion into one chain
    verification: automated-test
    description: |
      GIVEN the repository's release workflow definition
      WHEN the packaging test validates it
      THEN the tag job waits on the approval job, every publishing job waits on the tag job, the promotion job waits on the verification job, and a run that reaches the tag without reaching promotion — including one ended by cancellation — is exactly the case the partial-release report job's own condition is keyed on, so the chain of gates the requirement states is one continuous dependency graph in the workflow rather than independent steps that happen to run in the right order
    revision: "0.2.0"

  - id: SVC_GW_RELEASE_0003.1
    requirement_ids: ["GW_RELEASE_0003.1"]
    title: The release workflow is reachable only by manual dispatch, and previews by default
    verification: automated-test
    description: |
      GIVEN the repository's release workflow definition
      WHEN the packaging test validates it
      THEN its only trigger is workflow_dispatch and its dry-run input defaults to true
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0003.2
    requirement_ids: ["GW_RELEASE_0003.2"]
    title: An explicit override input exists alongside the hand-entered version
    verification: automated-test
    description: |
      GIVEN the repository's release workflow definition
      WHEN the packaging test validates it
      THEN its dispatch inputs declare an explicit force flag, which the version derivation requires before accepting a hand-entered version that disagrees with the derived one
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0003.3
    requirement_ids: ["GW_RELEASE_0003.3"]
    title: A release-candidate mode is offered from the same dispatch input as a plain release
    verification: automated-test
    description: |
      GIVEN the repository's release workflow definition
      WHEN the packaging test validates it
      THEN its prerelease dispatch input offers a release-candidate mode alongside a plain release, with no separate workflow or input for one versus the other
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0003.4
    requirement_ids: ["GW_RELEASE_0003.4"]
    title: The tag and every publisher wait on gates and a required reviewer, verifying the commit that gets tagged
    verification: automated-test
    description: |
      GIVEN the repository's release workflow definition
      WHEN the packaging test validates it
      THEN the approval job waits on the main-branch gates, is bound to a protected environment so a required reviewer holds it, the tag job waits on that approval and carries no environment of its own, every publishing job waits on the tag job, and the dispatch inputs declare no ref so the commit the gates verify cannot differ from the commit that gets tagged
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0003.5
    requirement_ids: ["GW_RELEASE_0003.5"]
    title: The tag job creates the release as a prerelease
    verification: automated-test
    description: |
      GIVEN the repository's release workflow definition
      WHEN the packaging test validates it
      THEN the tag job delegates to the shared tag-and-prerelease workflow rather than to a job that publishes a release directly
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0003.6
    requirement_ids: ["GW_RELEASE_0003.6"]
    title: Promotion waits on published-artifact verification and tolerates an expected skip
    verification: automated-test
    description: |
      GIVEN the repository's release workflow definition
      WHEN the packaging test validates it
      THEN the promotion job waits on the verification job and its guard condition is that no job failed rather than that every job succeeded
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0003.7
    requirement_ids: ["GW_RELEASE_0003.7"]
    title: A run that tags without promoting reports its surviving state, even when cancelled
    verification: automated-test
    description: |
      GIVEN the repository's release workflow definition
      WHEN the packaging test validates it
      THEN the partial-release report job waits on the tag and the promotion job, runs unconditionally including on a cancelled run, and its own condition keys on the tag having succeeded while promotion did not
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0004
    requirement_ids: ["GW_RELEASE_0004"]
    title: Release tags are bare semantic versions and cut only from reachable untagged commits
    verification: automated-test
    description: |
      GIVEN the repository's workflow definitions and its changelog configuration
      WHEN the packaging test validates them
      THEN no workflow matches or strips a prefixed tag, the changelog configuration recognises only bare three-part semantic versions as release tags, and the release workflow refuses a commit that is unreachable from the main branch or that already carries a release tag
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0019
    requirement_ids: ["GW_AUTH_0019"]
    title: A configured deployment refuses to start with the development escape hatch on
    verification: automated-test
    description: |
      GIVEN a gateway whose development-only unauthenticated mode is enabled
      WHEN it is started with an identity provider configured, whether by a real client
      registration, a provider endpoint that is not the shipped placeholder, or a pinned
      issuer
      THEN it refuses to start, and the refusal names the configuration that decided it and
      both ways to resolve it
      AND a gateway with the mode enabled and no identity provider configured still starts
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0008
    requirement_ids: ["GW_FACADE_0008"]
    title: The chart fails closed when the storage durability choice is missing
    verification: automated-test
    description: |
      GIVEN the deployment chart
      WHEN the packaging test validates it
      THEN the chart ships no default storage choice, refuses to render when the choice is absent, unrecognised, or names durable storage without a volume claim, states the data-loss consequence in the refusal, and renders the durable volume from the named claim once the choice is made
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0005
    requirement_ids: ["GW_RELEASE_0005"]
    title: The chart carries registry credentials, an optional ingress, default reservations, its own service account and a non-root security context
    verification: automated-test
    description: |
      GIVEN the deployment chart
      WHEN the packaging test validates it
      THEN the pod specification carries the configured image pull secrets, names a service account the chart creates and can annotate, and defaults to running as a non-root user with no privilege escalation, all capabilities dropped and a read-only root filesystem alongside a writable temporary directory; the ingress renders only when enabled and carries its class, annotations, host and path rules and TLS block; and the container declares default processor and memory reservations and limits
    revision: "0.1.0"

  - id: SVC_GW_RELEASE_0006
    requirement_ids: ["GW_RELEASE_0006"]
    title: The chart passes arbitrary application configuration through to the container
    verification: automated-test
    description: |
      GIVEN the deployment chart
      WHEN the packaging test validates it
      THEN extra environment entries and projected environment sources reach the container verbatim, structured configuration is rendered into a configuration object that is mounted into the container and layered over the image's own configuration, and a change to that configuration changes the pod specification so the estate is reconciled again
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0009
    requirement_ids: ["GW_FACADE_0009"]
    title: Every enumerated column is a database type that refuses values outside its set
    verification: automated-test
    description: |
      GIVEN a gateway whose schema has been migrated
      WHEN each column holding a closed set of enumerated values is inspected, written
      through the repository that owns it, and read back
      THEN the column's declared type is the enumerated type named for it, every value of
      the set round trips unchanged, and a value outside the set is refused by the database
      rather than stored
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0020
    requirement_ids: ["GW_AUTH_0020"]
    title: Administrative scope is its own dimension with its own empty default
    verification: automated-test
    description: |
      GIVEN a credential record whose administrative scope list is absent
      WHEN its three scope dimensions are asked what they permit, and a credential is
      requested with an unrecognised administrative scope value, with a wildcard value,
      and with no administrative scope at all
      THEN the absent list permits no administrative reach while the fetch list's absence
      still means every marketplace and the publication list's absence still means none,
      and each of the unrecognised, wildcard and empty requests is refused rather than
      granting anything
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0021
    requirement_ids: ["GW_AUTH_0021"]
    title: Only an administratively scoped bearer credential reaches the administrative interface
    verification: automated-test
    description: |
      GIVEN credentials of every other shape — an unscoped fetch credential, a
      marketplace-scoped one, a publication-scoped one, a session-derived one, a revoked
      one, an expired one, a malformed bearer value and an empty one — and a valid
      administratively scoped credential
      WHEN each is presented to the administrative interface, as a bearer credential and
      as a basic one, alone and alongside a session cookie, with the development-only
      unauthenticated mode both off and on
      THEN only the administratively scoped credential presented as a bearer credential
      alone is authenticated, every other case is refused indistinguishably, the response
      creates no session and sets no cookie, an administratively scoped credential is
      refused by the git facade and the publication surface including for the marketplaces
      an empty fetch list would otherwise grant, deriving an administrative scope onto a
      session-derived credential is refused at issue time, and a browser session carrying
      no bearer credential reaches the interface exactly as before
    revision: "0.1.0"

  - id: SVC_GW_AUDIT_0007
    requirement_ids: ["GW_AUDIT_0007"]
    title: The ledger types its actors explicitly and outlives the credentials it names
    verification: automated-test
    description: |
      GIVEN ledger entries produced by a browser session, by a machine credential and by
      the gateway's own reconciliation
      WHEN the ledger is queried by actor kind, the credential a machine entry names is
      revoked and its record deleted, the role grants are read by both a machine
      credential and a person, an unauthorized read of the role grants is attempted, and
      the ledger itself is read by a machine credential
      THEN each entry carries its actor kind with no string comparison and no lookup into
      the credential records, a machine entry names the credential that produced it and
      still reports its actor kind after that credential's record is gone, the
      provisioning person appears only on the entry that records the provisioning, each
      authorized read of the role grants appends exactly one entry carrying the reading
      identity and its actor kind, the refused read appends none, and the read of the
      ledger appends none
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0022
    requirement_ids: ["GW_AUTH_0022"]
    title: Every endpoint is classified and no scope reaches an unclassified or excluded one
    verification: automated-test
    description: |
      GIVEN the administrative endpoints the running gateway serves and the classification
      it carries
      WHEN the classification is compared with the gateway's own route table, a credential
      holding exactly one scope is walked over every other scope's endpoints, two scopes
      are held together, and a credential holding every scope whose principal also holds
      the administrative role is walked over every excluded endpoint, all with role
      enforcement disabled
      THEN the classification covers the route table exactly with no endpoint in neither
      class and none in both, a single scope reaches its own endpoints and is refused on
      every other scope's, no scope confers another, two scopes reach exactly the union of
      their endpoints, and every excluded endpoint — each decision to publish or reject,
      each override of vetting and its withdrawal, each retraction or republication of
      content, each grant of privilege and every credential-minting path — is refused
      even to the credential holding all of them
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0023
    requirement_ids: ["GW_AUTH_0023"]
    title: A machine principal's authority is the intersection of scope and declared role
    verification: automated-test
    description: |
      GIVEN a machine credential whose principal is named by configuration or by a
      declared grant, and one whose principal is named by neither
      WHEN identity-provider claims are mapped for it, an operation is attempted holding
      the scope but not the role and holding the role but not the scope with role
      enforcement enabled, the grants interface is called by the credential, the declared
      estate is reconciled, and a credential is minted, listed and revoked from a session
      without the administrative role while role enforcement is disabled
      THEN the claim mapping derives nothing, both one-sided attempts are refused while
      holding both succeeds, the grants interface is unreachable by the credential, the
      declared grant is applied and attributed to the gateway's own reconciliation, and
      each of minting, listing and revoking is refused to the session without the
      administrative role
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0024
    requirement_ids: ["GW_AUTH_0024"]
    title: A machine credential expires, rotates without widening, and is centrally administered
    verification: automated-test
    description: |
      GIVEN a deployment that configures no lifetime cap
      WHEN a machine credential is requested with no expiry, with an expiry beyond the
      built-in cap, and with a valid one; the valid one is then rotated, revoked, and
      listed and revoked by another identity
      THEN the request without an expiry and the request beyond the cap are both refused
      rather than defaulted or shortened, the rotation returns a credential with the same
      identity, the same expiry deadline and each of the same scope values while the
      previous secret no longer authenticates, the revoked credential is refused on its
      very next request, and the listing and revocation succeed for an administrator and
      are refused for anyone else while a person's own credential listing still shows only
      their own
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0010
    requirement_ids: ["GW_FACADE_0010"]
    title: The storage backend is the one that was named, or the gateway does not start
    verification: automated-test
    description: |
      GIVEN a gateway configuration
      WHEN the git storage backend is resolved at startup
      THEN an absent selection resolves the filesystem backend, a named backend resolves that
      backend and no other, an unrecognised name fails startup naming both the setting and the
      value it could not accept, an object-storage selection missing its bucket, its region or the
      credentials the credential mode it names requires fails startup naming the missing setting,
      a workload-identity selection resolvable from neither configuration nor the standard
      environment fails startup rather than falling back to a credential chain, a
      workload-identity selection that is resolvable starts while the gateway holds no secret, and
      the storage client the configuration builds carries an explicit bounded connection lifetime
      and passes conditional writes through faithfully
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0011
    requirement_ids: ["GW_FACADE_0011"]
    title: Every storage backend satisfies the same reference-transition contract
    verification: automated-test
    description: |
      GIVEN each supported git storage backend in turn
      WHEN the shared storage contract suite exercises the three repository roles,
      publication and revocation against it
      THEN quarantine, hosted and published are separate repositories created with the
      head reference linked to the branch the gateway publishes on, the two
      open-only-if-present accessors stay empty until there is something to open,
      publication makes exactly the served tip and the pinned snapshot reference appear,
      revocation removes the pinned reference unconditionally and the served tip only
      while it still resolves to that snapshot, reporting true exactly when its removal
      is what stopped the marketplace serving, a reference transition the backend could
      not apply is raised rather than reported as done, and the atomic push capability
      is advertised identically by every backend
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0012
    requirement_ids: ["GW_FACADE_0012"]
    title: The storage backend's contention, levels, latency and reachability are observable
    verification: automated-test
    description: |
      GIVEN a gateway on the object-storage backend whose transitions have met contention,
      whose packs have been compacted and whose caches have been read
      WHEN the backend's counters are bound to a meter registry and the storage health
      indicator is asked
      THEN the registry carries the conditional-write conflict, retry and exhaustion counts,
      the write-ahead depth and live pack levels, the pack-cache hit and download counts and
      a request timer tagged by operation and outcome, all under the skills_gateway prefix
      and none of them tagged by marketplace, repository or key; the health indicator names
      the configured backend, reports it reachable without having written to it, and reports
      the conditional-write check that gated startup; and an unreachable store is reported
      down rather than up
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0013
    requirement_ids: ["GW_FACADE_0013"]
    title: A migration between backends copies everything and proves it, or refuses
    verification: automated-test
    description: |
      GIVEN an estate held on one storage backend, with a repository in each of the
      three roles
      WHEN it is migrated onto the other backend and back again
      THEN every repository appears at the destination with the same references
      resolving to the same objects and the same branch named by its head, the served
      tip and the pinned snapshot reference both survive, a marketplace the source did
      not hold in a role is not created there, a destination that has lost a reference
      is reported as not verified with the repository named and the source stated to be
      intact, the source is byte-identical afterwards, the reverse direction
      restores the previous state, and the runner that performs the migration is present
      in a context that asked for no migration — doing nothing there, and acting only on
      the flag as the running process reads it — so that no packaging can compile it out
    revision: "0.2.0"

  - id: SVC_GW_FACADE_0014
    requirement_ids: ["GW_FACADE_0014"]
    title: The chart refuses a storage backend or a replica count it cannot honour
    verification: automated-test
    description: |
      GIVEN the deployment chart
      WHEN the packaging test validates it
      THEN the storage backend is a named value defaulting to the filesystem, an
      unrecognised name and an object-store selection missing its bucket or its region
      stop the render, static credentials are refused without the secret holding them
      and the values file offers no place to write a key, a deployment with no storage
      volume renders only on the object-store backend and points the local pack cache
      somewhere writable, the selection reaches the container as configuration rather
      than staying in the values file, and more than one replica is refused on the
      filesystem backend and accepted on the object-store backend
    revision: "0.2.0"

  - id: SVC_GW_FACADE_0015
    requirement_ids: ["GW_FACADE_0015"]
    title: Publication lands both references or neither, on every backend
    verification: automated-test
    description: |
      GIVEN a snapshot pinned in a marketplace's quarantine repository
      WHEN the storage seam publishes it, on each backend the gateway implements
      THEN the objects it needs are present in the published repository although neither
      repository has a filesystem location, exactly the served branch and the pinned
      snapshot reference are present, no staging reference is left behind, the first
      such call reports that it started the marketplace serving and a repeat of the
      tip already served reports that it started nothing, a transition refused by a
      competing writer is raised rather than reported as done and leaves no advertised
      reference resolving to that snapshot, and a staging reference left behind by an
      interrupted attempt neither blocks a later publication of the same snapshot nor
      survives it
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0012
    requirement_ids: ["GW_APPROVAL_0012"]
    title: A refused publication yields no approval, no ledger entry and nothing served
    verification: automated-test
    description: |
      GIVEN a held snapshot in a marketplace whose served branch is held by a competing
      writer
      WHEN it is approved
      THEN the approval fails naming the reference that refused and the refusal that was
      returned, the snapshot's record is back in the state it held before the decision,
      the audit ledger records no approval for it, nothing is fetchable for that
      snapshot by the served branch or by name, a marketplace whose first publication
      was refused serves nothing at all, a refused re-publication of a revoked snapshot
      leaves its revocation time, revoker and violation exactly as they were, and no
      reference transition outside the checked helper exists anywhere in the gateway's
      own sources
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0016
    requirement_ids: ["GW_FACADE_0016"]
    title: The facade advertises the served branch, the snapshot pins, and nothing else
    verification: automated-test
    description: |
      GIVEN a marketplace serving an approved snapshot, and the virtual catalog
      WHEN a standard git client lists and fetches from the facade
      THEN every advertised reference is the served branch, a snapshot pin or the
      symbolic head, an approved snapshot is still fetchable by name, a clone still
      resolves its head, and neither a catalog scaffolding reference nor a publication
      staging reference appears on the wire
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0017
    requirement_ids: ["GW_FACADE_0017"]
    title: The catalog rebuild removes its scaffolding and reports only a served commit
    verification: automated-test
    description: |
      GIVEN an estate whose served snapshots the virtual catalog aggregates
      WHEN the catalog is rebuilt
      THEN the internal references the rebuild created are gone from the catalog
      repository, a removal that did not take effect fails the rebuild rather than
      reporting it as done, and the commit the rebuild reports is the one the served
      reference resolves to
    revision: "0.1.0"

  - id: SVC_GW_RETENTION_0007
    requirement_ids: ["GW_RETENTION_0007"]
    title: A purge that cannot remove the pin keeps the record and writes no ledger entry
    verification: automated-test
    description: |
      GIVEN a soft-deleted snapshot past its restore window whose quarantine pin is held
      by a competing writer
      WHEN the retention pass compacts
      THEN the snapshot is not counted as acted on, its pin is still present, its record
      is still present so a later pass attempts it again, and the audit ledger records
      no purge for it
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0018
    requirement_ids: ["GW_INGEST_0018"]
    title: An ingestion whose pin is refused records no snapshot
    verification: automated-test
    description: |
      GIVEN a marketplace with a new upstream commit whose quarantine pin is held by a
      competing writer
      WHEN the marketplace is ingested
      THEN the ingestion fails rather than reporting a snapshot, and no record exists for
      that commit for a reviewer to approve
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0025
    requirement_ids: ["GW_AUTH_0025"]
    title: A session holding no role is refused everywhere, with no enforcement switch present
    verification: automated-test
    description: |
      GIVEN a gateway whose configuration names an administrator and sets no
      authorization-enforcement property at all
      WHEN a session holding no role calls each privileged route
      THEN every one is refused, the walk asserts its route set complete against the
      running application's own route table so a route added without a check fails
      the build, and the session identity endpoint carries no enforcement flag
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0026
    requirement_ids: ["GW_AUTH_0026"]
    title: A configuration naming no administrator refuses to start
    verification: automated-test
    description: |
      GIVEN configurations that respectively name no administrator at all, name one in
      the configuration admin list, map an identity-provider claim value to the
      administrative role, and declare an administrative grant in the estate
      WHEN each is started
      THEN the first refuses with a message naming all three configuration paths and the
      development escape hatch, the other three start cleanly, and no configuration
      reads the database to decide
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0028
    requirement_ids: ["GW_AUTH_0028"]
    title: The escape hatch's principal administers, and nothing else does by that path
    verification: automated-test
    description: |
      GIVEN a gateway started with the development authentication escape hatch enabled
      WHEN its synthetic principal performs an administrative mutation and reads the
      session identity endpoint
      THEN the mutation succeeds and the administrative role is reported attributed to
      the escape hatch rather than to configuration or to a stored grant
      AND with the escape hatch disabled a principal of the same name holds nothing and
      is refused, and an identity-provider session sharing that name gains nothing by
      this path
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0022
    requirement_ids: ["GW_VETTING_0022"]
    title: Vetting ledger entries carry the run, the finding count and severity, and a system actor
    verification: automated-test
    description: |
      GIVEN a snapshot taken through a chain run that both fails and passes vetters
      WHEN the audit ledger is read
      THEN each vetting-verdict entry carries the vetter name and conclusion, the
      number of findings, the worst severity present or none, and the id of the chain
      run it belongs to
      AND the vetting-completed entry carries that same run id
      AND every vetting entry is typed as the gateway acting on its own rather than as a
      human actor
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0023
    requirement_ids: ["GW_VETTING_0023"]
    title: A clean vetter pass records the coverage it examined
    verification: automated-test
    description: |
      GIVEN a snapshot whose content trips no secret-scan or prompt-injection rule
      WHEN its recorded verdicts and the ledger are read
      THEN each passing vetter's detail is non-empty and states what it examined —
      the files it scanned and the rules it applied — rather than being null and
      indistinguishable from a vetter that never ran
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0024
    requirement_ids: ["GW_VETTING_0024"]
    title: A configured external vetter joins the chain and runs in order
    verification: automated-test
    description: |
      GIVEN a gateway configured with an external vetting connector at an ordered
      position, endpoint URL and rule-set version
      WHEN the chain is inspected and a snapshot is vetted
      THEN the external vetter appears in the chain at its configured position
      alongside the unremoved built-ins, the chain identity names it and its version,
      the snapshot bundle it is sent carries the snapshot identity and its scannable
      file content, and a passing answer is recorded as a passing verdict that clears
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0025
    requirement_ids: ["GW_VETTING_0025"]
    title: Every inconclusive answer from an external vetter blocks
    verification: automated-test
    description: |
      GIVEN an external vetting connector whose endpoint is in turn unreachable,
      refusing the connection, hanging past the read timeout, returning a non-success
      status, returning an empty, oversized or unparseable body, declaring an
      unrecognised or missing verdict state, returning a malformed finding, and being
      sent a snapshot whose content exceeds the request cap
      WHEN each snapshot is vetted
      THEN each case records an error verdict and a blocked outcome, none records a
      passing or clearing verdict, and a snapshot so blocked stays held and cannot be
      approved
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0026
    requirement_ids: ["GW_VETTING_0026"]
    title: External verdicts take the worst of declared and derived, and carry their report link
    verification: automated-test
    description: |
      GIVEN an external vetter that returns a failing state with findings and a
      report link, and separately one that declares a passing state alongside a
      critical finding
      WHEN each snapshot is vetted
      THEN the failing verdict persists its findings and its report link through the
      verdict model, and the declared pass alongside a critical finding is recorded as
      a failing verdict that blocks, while informational findings alone still pass
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0027
    requirement_ids: ["GW_VETTING_0027"]
    title: A pending answer from an external vetter blocks as the async seam
    verification: automated-test
    description: |
      GIVEN an external vetting connector whose endpoint answers with a pending state
      WHEN the snapshot is vetted
      THEN the verdict is recorded as pending, the run outcome is blocked, the pending
      state does not clear, and the snapshot stays held and cannot be approved
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0028
    requirement_ids: ["GW_VETTING_0028"]
    title: An administrator overrides a blocked vetting outcome, audibly and no one else can
    verification: automated-test
    description: |
      GIVEN a held snapshot whose effective vetting outcome is blocked by a failing
      vetter no waiver covers
      WHEN a non-administrator approver of the marketplace requests approval with the
      override set, an administrator requests the override with no reason, and an
      administrator requests the override with a reason
      THEN the non-administrator's override is refused and the snapshot stays held with
      nothing published, the administrator's reasonless override is refused, the
      administrator's override with a reason approves and publishes the snapshot, the
      ledger carries a distinct override event naming the administrator, the reason and
      the vetters and uncovered findings that were blocking, and the snapshot's
      vetting surface reports it approved over a vetting failure rather than clear
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0029
    requirement_ids: ["GW_VETTING_0029"]
    title: A disabled verdict never rescues a blocking one, and pre-existing aggregation is unchanged
    verification: automated-test
    description: |
      GIVEN the fail-closed aggregation rule extended with the DISABLED verdict state
      WHEN a disabled verdict is aggregated alongside a verdict that still fails, errors or has not answered, and every verdict combination that predates the DISABLED state is aggregated again
      THEN a disabled verdict never turns a blocked outcome into a clear one, and every pre-existing aggregation case — an empty run, an all-passing run, a warned run, a failing run — aggregates exactly as it did before DISABLED existed
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0029.1
    requirement_ids: ["GW_VETTING_0029.1"]
    title: A vetter disabled for one marketplace is skipped there while an unrelated marketplace still runs it
    verification: automated-test
    description: |
      GIVEN a built-in vetter enabled by default for two marketplaces, and a chain that also carries an operator-configured external vetter
      WHEN an administrator disables the built-in for one of the two marketplaces by name and both marketplaces are then ingested, and the external vetter is disabled by name for a marketplace of its own
      THEN the disabled marketplace's chain run treats the built-in as not run while the other marketplace's run still executes it and still blocks on the same content, the external vetter's name is accepted by the switch on the same terms, and a name no vetter in the chain carries is refused with a message naming the vetters it does carry
    revision: "0.3.0"

  - id: SVC_GW_VETTING_0029.2
    requirement_ids: ["GW_VETTING_0029.2"]
    title: A disabled vetter is recorded as a distinct disabled verdict rather than omitted
    verification: automated-test
    description: |
      GIVEN a marketplace whose built-in vetter an administrator has disabled, and a second marketplace whose operator-configured external vetter an administrator has disabled
      WHEN each marketplace's snapshot is put through the chain
      THEN each run's verdict for the disabled vetter is the distinct DISABLED state rather than an absent entry, whether the vetter is built-in or external, and the first run's overall outcome still clears on the other vetters' evidence
    revision: "0.3.0"

  - id: SVC_GW_VETTING_0029.3
    requirement_ids: ["GW_VETTING_0029.3"]
    title: Disabling every vetter blocks the run rather than clearing it
    verification: automated-test
    description: |
      GIVEN the DISABLED verdict state, both as the pure aggregation function's input and as a real chain run's outcome
      WHEN a run's verdicts are all DISABLED, and, through the real API, every built-in vetter is disabled for one marketplace before it is ingested
      THEN the pure function classifies DISABLED as neither clearing nor blocking on its own, a run made only of DISABLED verdicts aggregates to BLOCKED, and the marketplace ingested with every vetter disabled is blocked rather than clear
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0029.4
    requirement_ids: ["GW_VETTING_0029.4"]
    title: Only an administrator may see or change vetter settings, and every change is on the ledger
    verification: automated-test
    description: |
      GIVEN a marketplace and a non-administrator principal
      WHEN the non-administrator attempts to toggle a vetter and to read the vetter settings, and an administrator then disables the vetter for that marketplace with a reason
      THEN the non-administrator is refused both the toggle and the read, and the ledger carries exactly one entry for the administrator's toggle naming the administrator, the vetter, the scope and the new state
    revision: "0.2.0"

  - id: SVC_GW_INGEST_0019
    requirement_ids: ["GW_INGEST_0019"]
    title: Every plugin source form is classified, and the unsupported ones fail closed by type
    verification: automated-test
    description: |
      GIVEN manifests declaring in turn a relative local path, a github source, a git
      url source, a git-subdir source, an npm source, an archive source, a source
      carrying a type the gateway does not implement, a source that is neither a string
      nor an object, and a local path that escapes the marketplace repository
      WHEN each manifest is validated at ingestion
      THEN the local path is classified local and accepted, each external form is
      classified as its declared type rather than refused for not being a string, and
      the npm, archive, unrecognised-type, unparseable and escaping-path manifests are
      each refused with a violation naming the offending plugin and the form its source
      took, with the snapshot recorded rejected
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0020
    requirement_ids: ["GW_INGEST_0020"]
    title: External sources are admitted only when enabled, and only within the configured bounds
    verification: automated-test
    description: |
      GIVEN a manifest declaring a github plugin source, and a gateway configured in turn
      with external sources left at their default, with them enabled, with them enabled
      but the source's type absent from the type allowlist, with them enabled but the
      source's derived clone URL host absent from a non-empty host allowlist, with them
      enabled but the derived clone URL carrying a scheme outside the gateway's URL
      scheme allowlist, and with them enabled but the manifest declaring more external
      sources than the configured maximum
      WHEN each configuration validates the manifest at ingestion
      THEN the default configuration refuses the source as not admitted, the enabled
      configuration admits it, each of the type, host, scheme and count configurations
      refuses it with a violation naming the plugin and which bound it exceeded, and no
      configuration causes a network request to the source
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0021
    requirement_ids: ["GW_INGEST_0021"]
    title: An admitted but unresolved external source is rejected, never held
    verification: automated-test
    description: |
      GIVEN a gateway with external plugin sources enabled and a manifest declaring a
      github plugin source the gateway admits but cannot yet resolve into gateway-local
      content
      WHEN ingestion runs, and an approver attempts to approve the resulting snapshot
      THEN the snapshot is recorded rejected rather than held, its violation states that
      the source was admitted but is not yet resolvable and is distinguishable from the
      violation recorded when the same source is not admitted, the approval is refused,
      and the published repository is unchanged
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0022
    requirement_ids: ["GW_INGEST_0022"]
    title: A snapshot's inventory diff against the last approved snapshot
    verification: automated-test
    description: |
      GIVEN a marketplace whose first snapshot is ingested and approved, and a second
      snapshot that adds a skill to one plugin, edits a file beside another skill's
      definition without touching that definition, drops a declared plugin, and moves a
      third skill unchanged into a different plugin
      WHEN each snapshot's content diff is requested
      THEN the first snapshot reports no baseline with every plugin and skill added, and
      the second reports the added skill as added, the skill with the edited neighbouring
      file as changed, the dropped plugin and its skills as removed, and the relocated
      skill exactly once as moved naming the plugin it came from, with an unknown
      snapshot answered as not found
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0018
    requirement_ids: ["GW_FACADE_0018"]
    title: A pack transfer names the advertised ref its want resolved to
    verification: automated-test
    description: |
      GIVEN a marketplace serving a second approved snapshot, so that the first one is
      superseded and advertised only by its own pinned reference
      WHEN a client fetches the superseded snapshot through the facade, and another
      client clones the served tip
      THEN the ledger records the pinned snapshot reference for the superseded fetch and
      the served tip for the clone, resolves a want that matches the tip and a snapshot
      reference alike to the tip, never names the symbolic head, and records no
      reference for a want that matches nothing the facade advertised
    revision: "0.1.0"

  - id: SVC_GW_WEBHOOK_0006
    requirement_ids: ["GW_WEBHOOK_0006"]
    title: A held snapshot announces itself to the subscribers that asked, and to no others
    verification: automated-test
    description: |
      GIVEN a subscriber whose filter names only the approval-pending event, a second
      subscriber filtering an unrelated event, and a subscriber declared as part of the
      configured estate whose filter names the approval-pending event
      WHEN a marketplace is registered and ingested so that its snapshot is held and the
      vetting chain runs against it, and a second marketplace's snapshot is approved and
      then re-vetted
      THEN the registry of subscribable events offers the approval-pending event, the
      first subscriber receives exactly one signed, pending delivery of it naming the
      marketplace, the snapshot and its commit SHA, the second subscriber receives none,
      the estate-declared subscriber is reconciled with that filter while a filter naming
      an unknown event is refused, and no approval-pending delivery is produced for the
      approved snapshot's re-vetting run
    revision: "0.1.0"

  - id: SVC_GW_WEBHOOK_0007
    requirement_ids: ["GW_WEBHOOK_0007"]
    title: The approval-pending payload carries the summary and none of the content behind it
    verification: automated-test
    description: |
      GIVEN a marketplace whose snapshot the vetting chain blocks on real findings, and a
      subscriber filtering the approval-pending event
      WHEN that snapshot is ingested and the chain run finishes
      THEN the delivery's payload carries exactly the documented field set at the top
      level and within its vetting summary, reports the blocked effective outcome, the
      recorded outcome, the run identifier, the name of the blocking vetter and the
      number of uncovered and waived findings, and contains no finding message, no
      finding rule identifier, no finding location and no file name from the quarantined
      snapshot
    revision: "0.2.0"

  - id: SVC_GW_INGEST_0023
    requirement_ids: ["GW_INGEST_0023"]
    title: Resolve an admitted external plugin source into quarantine
    verification: automated-test
    description: |
      GIVEN a gateway configured to admit github plugin sources and a marketplace whose
      manifest declares one, backed by a reachable upstream plugin repository
      WHEN ingestion runs
      THEN the plugin repository's content is fetched into that marketplace's quarantine
      area at the commit the fetch resolved to, no reference the fetch used is left
      behind, the same source declared twice in one manifest is fetched once, an
      admitted source declaring a ref or a commit is refused with a violation naming
      that field, and nothing fetched is reachable through the consumer facade
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0024
    requirement_ids: ["GW_INGEST_0024"]
    title: One composite commit is what is pinned at ingestion and what a client receives at the end
    verification: automated-test
    description: |
      GIVEN a marketplace manifest declaring one resolved external plugin source
      WHEN the snapshot is recorded and, once approved, cloned by a client
      THEN the commit pinned as the snapshot at ingestion and the commit the client
      receives from the facade are the same synthesised composite, with its manifest
      gateway-local and its grafted content present at both points, and nothing about the
      snapshot's identity is a side record kept beside a different commit
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0024.1
    requirement_ids: ["GW_INGEST_0024.1"]
    title: The composite tree holds the upstream content, the grafted sources, and a manifest pointing only inside it
    verification: automated-test
    description: |
      GIVEN a manifest declaring a local plugin and a resolved external plugin, and
      separately a graft offered for a plugin the manifest does not declare as resolved
      WHEN the composite commit is built, served through the content inventory, and
      cloned by a client
      THEN the rewritten manifest names only a path inside the commit for the resolved
      source and leaves every local source and every other field unchanged, the resolved
      content is present under the reserved directory alongside the untouched upstream
      content, the content inventory and a real clone both see that same shape, vetting
      finds content grafted there exactly as it would anywhere else in the tree, and a
      graft with no matching declared source is refused with no commit produced
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0024.2
    requirement_ids: ["GW_INGEST_0024.2"]
    title: The snapshot's recorded commit and pinned reference are the synthesised composite
    verification: automated-test
    description: |
      GIVEN a manifest declaring a resolved external plugin source
      WHEN the snapshot is recorded
      THEN the snapshot's commit is the synthesised composite rather than the ingested
      upstream commit, and quarantine pins exactly that composite under
      refs/snapshots/<sha>
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0024.3
    requirement_ids: ["GW_INGEST_0024.3"]
    title: The upstream commit is the composite's parent, and its manifest is unchanged
    verification: automated-test
    description: |
      GIVEN a manifest declaring a resolved external plugin source, in an in-memory
      repository and against a real fetch
      WHEN the composite commit is built
      THEN it has exactly one parent, the ingested upstream commit, and that parent's
      manifest is byte-exact to what upstream declared
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0024.4
    requirement_ids: ["GW_INGEST_0024.4"]
    title: The same inputs give the same composite, and a changed input gives a different one
    verification: automated-test
    description: |
      GIVEN the same upstream commit, the same resolved external commit and the same
      rewrite implementation, and separately a change to only the resolved commit, only
      the upstream content, or only the rewrite implementation's version
      WHEN the composite is built again
      THEN the unchanged inputs produce the identical commit, re-ingesting unchanged
      content resolves to the same snapshot, and each of the three changes on its own
      produces a different commit
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0024.5
    requirement_ids: ["GW_INGEST_0024.5"]
    title: The commit message records the upstream commit, each source, and the rewrite implementation
    verification: automated-test
    description: |
      GIVEN a manifest declaring one resolved external plugin source
      WHEN the composite commit is built
      THEN its message names the ingested upstream commit, the source's plugin name,
      clone URL and resolved commit, and the rewrite implementation's version
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0024.6
    requirement_ids: ["GW_INGEST_0024.6"]
    title: A reserved-directory collision, a malformed name, or a duplicate name refuses with no commit
    verification: automated-test
    description: |
      GIVEN a manifest whose upstream content already occupies the reserved directory, a
      resolved plugin whose name is not a single lowercase path segment, or two resolved
      plugins sharing a name
      WHEN the composite is built, in an in-memory repository and against a real
      ingestion
      THEN each case is refused as a manifest policy violation naming the offending
      condition and no commit is produced
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0024.7
    requirement_ids: ["GW_INGEST_0024.7"]
    title: The rewritten manifest is checked against the local-only policy before its commit is used
    verification: automated-test
    description: |
      GIVEN a manifest declaring two external sources with a graft resolved for only one
      of them
      WHEN the composite is built
      THEN the rewritten manifest is evaluated against the local-only manifest policy
      before any commit from it is returned, and because it still declares a source
      outside the gateway the rewrite is refused with no commit produced
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0025
    requirement_ids: ["GW_INGEST_0025"]
    title: Refuse source resolution to forbidden addresses, redirects and transports
    verification: automated-test
    description: |
      GIVEN a gateway resolving an external plugin source
      WHEN the target, or any redirect it answers with, resolves to a link-local,
      multicast, unspecified or otherwise non-global-unicast address, encodes such an
      address inside another address family, resolves to a loopback or private address
      without private networks being permitted, resolves to a mixture of permitted and
      forbidden addresses, is expressed as a decimal, octal or hexadecimal address
      literal, carries embedded credentials, names a port other than the one originally
      requested, leaves the host originally requested, downgrades from a secure to an
      insecure scheme, or exceeds the configured redirect maximum
      THEN the request is refused, the forbidden target is never contacted, and the
      snapshot is rejected
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0026
    requirement_ids: ["GW_INGEST_0026"]
    title: Content inside every bound is accepted and a refusal names the plugin and the bound
    verification: automated-test
    description: |
      GIVEN a gateway with every resolution bound configured
      WHEN a source measures exactly at each bound, and separately when a source exceeds
      one of them
      THEN the source at every bound is accepted, and the refusal names the plugin at
      fault and the number it exceeded rather than reporting only that some budget was
      breached
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0026.1
    requirement_ids: ["GW_INGEST_0026.1"]
    title: A source is cut off at the received-byte bound rather than measured after it
    verification: automated-test
    description: |
      GIVEN a gateway with a configured bound on the bytes one external plugin source may
      send, and a source that sends without end
      WHEN the source is resolved
      THEN the transfer is aborted as the bound is crossed rather than after the source
      has been received, the ingestion is refused with a violation naming received bytes,
      the snapshot is rejected against the upstream commit, and the bound is readable by
      the transfer so it can stop at it
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0026.2
    requirement_ids: ["GW_INGEST_0026.2"]
    title: A source over the per-source decompressed bound is refused
    verification: automated-test
    description: |
      GIVEN a gateway with a configured bound on one source's decompressed size
      WHEN a source's grafted tree measures one byte over that bound
      THEN the source is refused with a violation naming uncompressed size
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0026.3
    requirement_ids: ["GW_INGEST_0026.3"]
    title: The decompressed bound accumulates across a manifest's sources
    verification: automated-test
    description: |
      GIVEN a gateway with a configured bound on the decompressed size of all of one
      manifest's sources together, and two sources each inside every per-source bound
      WHEN the two are resolved in turn and their total exceeds the manifest bound
      THEN the first is accepted, the second is refused with a violation naming the
      manifest total, and no refused source has advanced the accumulator
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0026.4
    requirement_ids: ["GW_INGEST_0026.4"]
    title: An extreme expansion is refused, and a small compressible source is not
    verification: automated-test
    description: |
      GIVEN a gateway with a configured expansion ratio and a floor below which it is not
      judged
      WHEN a source expands beyond the ratio while inside both byte bounds, when it
      expands as far but stays below the floor, and when it expands within the ratio
      THEN the first is refused with a violation naming the ratio, and the second and
      third are accepted
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0026.5
    requirement_ids: ["GW_INGEST_0026.5"]
    title: A source over the object-count bound is refused
    verification: automated-test
    description: |
      GIVEN a gateway with a configured bound on the objects one source may contribute
      WHEN a source contributes one object more than the bound
      THEN the source is refused with a violation naming objects
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0026.6
    requirement_ids: ["GW_INGEST_0026.6"]
    title: A source holding a file over the largest-file bound is refused
    verification: automated-test
    description: |
      GIVEN a gateway with a configured bound on the largest single file one source may
      contribute
      WHEN a source holds a file one byte over that bound, and separately when a real
      repository fetched over a real transport holds a file over it
      THEN both are refused with a violation naming the file, and the snapshot carrying
      the real repository is rejected
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0026.7
    requirement_ids: ["GW_INGEST_0026.7"]
    title: A source with a tree deeper than the bound is refused
    verification: automated-test
    description: |
      GIVEN a gateway with a configured bound on directory tree depth
      WHEN a source's tree is one level deeper than the bound
      THEN the source is refused with a violation naming depth
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0026.8
    requirement_ids: ["GW_INGEST_0026.8"]
    title: A resolution that outlives its wall-clock bound is refused
    verification: automated-test
    description: |
      GIVEN a gateway resolving a manifest under a configured wall-clock bound
      WHEN the bound has not yet passed, when it has been reached exactly, and when it
      has been passed
      THEN the resolution continues in the first two cases and in the third is stopped
      with a violation naming the deadline
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0027
    requirement_ids: ["GW_INGEST_0027"]
    title: A failed resolution rejects the snapshot and leaves nothing half-resolved
    verification: automated-test
    description: |
      GIVEN a marketplace with an approved and served snapshot, and a later manifest
      declaring an external plugin source that is unreachable, refused by policy, over a
      resource bound, past the time bound, cut off part-way through its transfer, or
      whose rewrite is refused
      WHEN ingestion runs
      THEN the snapshot is recorded against the upstream commit in the rejected state
      with the violation, it is not held and cannot be approved, no synthesised commit
      and no resolved external content is reachable from any snapshot, and clients still
      receive the previously approved snapshot
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0030
    requirement_ids: ["GW_VETTING_0030"]
    title: A chain run reads each selected blob once and never opens an unselected one
    verification: automated-test
    description: |
      GIVEN a quarantined snapshot holding a file inside a vetter's declared path
      selection, a file outside it, a file over the per-file size cap, and content
      larger than the configured per-run retention bound
      WHEN vetters walk the snapshot with their declared selections
      THEN the file outside the selection is never opened, a file two walks select is
      inflated once and served from the retained content on the second walk, the file
      over the per-file cap is still visited as unread, and content beyond the retention
      bound is still served in full on every walk
    revision: "0.2.0"

  - id: SVC_GW_INGEST_0028
    requirement_ids: ["GW_INGEST_0028"]
    title: SKILL.md frontmatter is validated against the pinned specification
    verification: automated-test
    description: |
      GIVEN a quarantined snapshot holding a conformant skill, a skill with no
      frontmatter, a skill missing a required field, a skill whose fields violate their
      constraints, a skill carrying a field the pinned specification does not define,
      and a skill whose frontmatter is hostile YAML
      WHEN the vetting chain runs over the snapshot
      THEN the conformant skill raises nothing, every departure is reported as its own
      finding located at the file, the undefined field is informational, the hostile
      frontmatter is refused as a finding rather than parsed or thrown out of the
      vetter, the verdict is advisory under the default posture and blocking under
      configured enforcement, and the run records the pinned specification's version as
      the vetter's version
    revision: "0.2.0"

  - id: SVC_GW_INGEST_0029
    requirement_ids: ["GW_INGEST_0029"]
    title: Registering a normalized-duplicate URL warns and still succeeds
    verification: automated-test
    description: |
      GIVEN an upstream marketplace already registered with a clone URL
      WHEN a second marketplace is registered with a URL that normalizes to the
      same value — differing only by host case, a trailing slash, or a '.git'
      suffix
      THEN the registration succeeds with 201, the second marketplace is
      created, and the response carries a warning naming the first
      marketplace; a registration whose URL normalizes to no existing
      marketplace's carries no warning
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0019
    requirement_ids: ["GW_FACADE_0019"]
    title: An abandoned staging reference is swept and an in-flight publication is not
    verification: automated-test
    description: |
      GIVEN a published repository, on either storage backend, holding a staging
      reference for a commit that no live snapshot record names and that has been under
      observation for longer than the configured bound, a second staging reference for
      such a commit first observed only moments ago, a third staging reference for a
      commit a live snapshot record does name, and the marketplace's served references
      WHEN a retention compaction pass runs
      THEN the first reference is removed and its commit is reachable from nothing, the
      second reference survives and the publication that staged it still completes and
      serves its content, the third reference survives however long it has been
      observed, and the served references and the content an approved snapshot is
      served from are untouched
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0029
    requirement_ids: ["GW_AUTH_0029"]
    title: The OIDC redirect URI follows forwarded headers only under a configured strategy
    verification: automated-test
    description: |
      GIVEN a gateway whose OIDC redirect URI is the shipped template and whose
      forwarded-header strategy is unset, set to framework and set to native in turn, and
      a fourth gateway whose redirect URI is supplied absolutely by environment
      WHEN each is asked to start an OIDC login by a request carrying X-Forwarded-Proto: https
      and an X-Forwarded-Host naming the public host
      THEN the unset gateway redirects with a redirect URI naming http and its own host and
      port, the framework and native gateways redirect with one naming https and the
      forwarded host, exactly one forwarded-header filter is registered under framework, and
      the fourth redirects with the supplied URI regardless of the headers
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0030
    requirement_ids: ["GW_INGEST_0030"]
    title: The resolved closure exists exactly when the snapshot it belongs to does
    verification: automated-test
    description: |
      GIVEN a gateway configured to admit github plugin sources and a marketplace whose
      manifest declares one, backed by a reachable upstream plugin repository
      WHEN ingestion records the composite snapshot, and the snapshot is later purged
      THEN a closure is recorded together with the snapshot at ingestion, naming the
      upstream commit, the rewrite implementation's identity, a digest and one member
      per resolved external plugin; and purging the snapshot removes the closure with
      it, leaving neither behind without the other
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0031
    requirement_ids: ["GW_INGEST_0031"]
    title: A resolution bound may be lowered without limit and raised only so far
    verification: automated-test
    description: |
      GIVEN the resolution budgets bound to configured values
      WHEN every bound is left unset, then set below what the gateway ships with, then
      set above it but within reach, and then set to a value that would disable it
      THEN the unset case is the shipped value, a lowered bound is honoured exactly, a
      raised bound is honoured exactly while it is one the gateway can defend, a bound
      beyond that is replaced by the furthest the gateway will go rather than failing the
      start, each bound is replaced independently of the others, and no such limit is
      itself below the value the gateway ships with
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0018
    requirement_ids: ["GW_APPROVAL_0018"]
    title: The decision comes after its evidence, refuses visibly, and names what still awaits one
    verification: automated-test
    description: |
      GIVEN a marketplace with two snapshots awaiting a decision, one whose vetting clears and
      one whose vetting blocks
      WHEN the surface offering the decision is rendered for each
      THEN the approval control follows the change summary and the vetting outcome in document
      order, the blocked snapshot's control is unavailable and states why rather than accepting
      the action, and the newest snapshot's decision names the older one that would still await a
      decision afterwards and would then be older than what is served
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0033
    requirement_ids: ["GW_INGEST_0033"]
    title: The served commit is read from the facade, not inferred from approvals
    verification: automated-test
    description: |
      GIVEN a marketplace with an approved snapshot its facade is serving
      WHEN the marketplace read is made, and again after that snapshot is revoked so that
      the approved record still exists while nothing is served
      THEN the first reports the served commit, the second reports it as absent rather than
      naming the snapshot that is still recorded as approved, and a marketplace that has
      never published reports it as absent throughout
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0034
    requirement_ids: ["GW_INGEST_0034"]
    title: An administrator removes a marketplace, its content stops being served and its record survives
    verification: automated-test
    description: |
      GIVEN a marketplace serving an approved snapshot, with a held snapshot beside it
      WHEN an administrator removes it on a stated reason
      THEN the approved snapshot is recorded withdrawn by administrative revocation, a clone of
      the marketplace fails, a holder asking about the commit is told it was revoked, the
      marketplace is absent from the listing and from every route addressed by its name, the
      sync sweep does not select it, the held snapshot cannot be approved, and the marketplace's
      record, its snapshots, their provenance and the ledger entries survive with the removal on
      the ledger — while a removal by a non-administrator, one with no reason, one with an empty
      reason and one naming no registered marketplace are each refused and change nothing, and
      the facade refuses the removed name even where a served reference was left behind; a token
      granted publication to the removed name loses that grant and no other, is recorded on the
      ledger, and cannot push to a marketplace registered again under the name, while a token
      granted fetch of the name still fetches it; and the removed marketplace's vetting settings
      leave the administrative listings while their records remain
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0035
    requirement_ids: ["GW_INGEST_0035"]
    title: A removed marketplace's name comes back as a new marketplace that inherits nothing
    verification: automated-test
    description: |
      GIVEN a marketplace that was approved, granted an approver, and then removed
      WHEN its name is registered again
      THEN the new marketplace has a different identity and serves nothing, a reference its
      predecessor left published is not served, the predecessor's approver cannot approve for
      it, a hosted successor carries none of its predecessor's pushed lineage, the same commit
      ingested again is held and approvable, a holder of the predecessor's content is still told
      it was revoked until the successor approves that commit, retention purging a predecessor
      snapshot leaves the successor's copy of the same commit intact, and a second live
      registration of the name is refused
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0047
    requirement_ids: ["GW_AUTH_0047"]
    title: The running build is reported on the session read, or reported absent
    verification: automated-test
    description: |
      GIVEN a gateway whose artifact carries build information, and one whose does not
      WHEN the portal's authenticated session read is made and the shell is rendered
      THEN the first reports the version the build carries and the shell states it, the
      second reports it as absent and the shell states nothing in its place, and no
      configuration exists that can set the reported value
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0048
    requirement_ids: ["GW_AUTH_0048"]
    title: The navigation groups records apart from configuration, nests the integrations, and keeps the webhooks address
    verification: automated-test
    description: |
      GIVEN an authenticated portal session, with and without the administrative role
      WHEN the portal shell is rendered, and the earlier webhooks address is opened
      THEN the audit log and adoption entries are grouped apart from the configuration entries,
      webhooks and audit sinks are listed as sections beneath one integrations entry, the vetting
      chain entry is offered only to the administrator, and the earlier webhooks address shows
      the webhook subscribers at their new address
    revision: "0.1.0"

  - id: SVC_GW_RETENTION_0009
    requirement_ids: ["GW_RETENTION_0009"]
    title: The trim is bounded by the slowest enabled sink, and by nothing else
    verification: automated-test
    description: |
      GIVEN a ledger of facade read entries older than the configured maximum age
      WHEN the compaction pass runs with no sink at all, then with one enabled sink that has
      exported only part of the ledger, then with a second enabled sink further behind, then
      with the laggard disabled, then with retention disabled, and then with no maximum age
      configured
      THEN nothing is removed in the no-sink, retention-disabled and no-age cases, each other
      case removes only entries at or below the lowest export position held by an enabled
      sink, an entry past the cutoff but above that position survives, the pass stops at its
      work budget and resumes on the next pass, and each pass reports how many it removed and
      which sink bounded it
    revision: "0.1.0"

  - id: SVC_GW_RETENTION_0010
    requirement_ids: ["GW_RETENTION_0010"]
    title: The administrative half of the ledger survives every trim
    verification: automated-test
    description: |
      GIVEN administrative and publication ledger entries older than the configured maximum
      age and below every enabled sink's export position
      WHEN the compaction pass trims the ledger
      THEN every such entry survives, only the closed set of facade read events is removed,
      and an event kind outside that set is not eligible
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0038
    requirement_ids: ["GW_VETTING_0038"]
    title: A run's chain is compared with the chain in force, and undetermined is its own answer
    verification: automated-test
    description: |
      GIVEN a snapshot whose latest chain run records the chain that produced it
      WHEN the chain in force is identical, then differs by an added vetter, a removed
      vetter, a version, the order and the mode, and when the run records no chain
      identity or the snapshot has no run at all
      THEN the identical case reports the chain in force, each difference reports a
      different chain and names both, and the missing cases report undetermined rather
      than either answer
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0038.1
    requirement_ids: ["GW_VETTING_0038.1"]
    title: A stale approval is recorded and published, never refused
    verification: automated-test
    description: |
      GIVEN a held snapshot whose latest run was produced by a superseded chain
      WHEN it is approved
      THEN the approval proceeds and the snapshot is published, the ledger carries a record
      naming the chain that produced the evidence and the chain in force, an approval on
      evidence from the chain in force records no such entry, and no configuration exists
      that would have refused either
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0032
    requirement_ids: ["GW_INGEST_0032"]
    title: A snapshot file is reached, and restored, by its address alone
    verification: automated-test
    description: |
      GIVEN a held snapshot whose pinned commit carries nested paths, a truncated blob, a
      binary blob, a path the served commit still has, a JSON manifest declaring one key
      twice, and a file named as JSON that does not tokenise
      WHEN the contents surface is opened at its address with no path selected, a file is
      selected, the resulting address is opened again from nothing, the listing is
      narrowed by a filter, and the surface is opened by a session holding no approver
      role
      THEN the address names the snapshot and the selected path, opening it afresh
      restores the same file and its content, the truncated blob states that it is cut,
      the binary blob is described rather than rendered, the removed path is shown as
      removed, the filter reports its matches against the size of the listing and states
      when that listing is itself cut, the JSON manifest is shown re-indented with both
      duplicated keys and its stored bytes one control away, the untokenisable file is shown
      as stored with that stated, and the roleless session is told it is refused
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0030.1
    requirement_ids: ["GW_INGEST_0030.1"]
    title: The closure and its members record the value copies the requirement describes
    verification: automated-test
    description: |
      GIVEN a gateway configured to admit github plugin sources and a marketplace whose
      manifest declares one, backed by a reachable upstream plugin repository, and a
      closure value built directly from resolved member fields
      WHEN ingestion records the composite snapshot's closure, or the closure's digest is
      computed directly
      THEN the recorded closure names the upstream commit, the rewrite implementation's
      identity and a digest, with one member carrying the plugin name, source type,
      declared source, clone URL, resolved commit, grafted tree, graft path, object count
      and decompressed size; two closures with the same content have the same digest
      regardless of member order; and the digest changes whenever the upstream commit,
      the rewrite identity, or any single member field differs
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0030.2
    requirement_ids: ["GW_INGEST_0030.2"]
    title: The upstream commit is recorded on every snapshot, equal to its own when nothing was resolved
    verification: automated-test
    description: |
      GIVEN a marketplace ingested with no external plugin source declared, and one
      ingested with a source whose resolution is rejected
      WHEN ingestion records either snapshot
      THEN the snapshot's upstream commit equals its own served commit, and no closure is
      recorded for it
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0030.3
    requirement_ids: ["GW_INGEST_0030.3"]
    title: The closure is recorded together with the snapshot it belongs to
    verification: automated-test
    description: |
      GIVEN a marketplace whose manifest declares an external plugin source that resolves
      WHEN ingestion records the resulting composite snapshot
      THEN the closure is present, recorded against that snapshot, as soon as ingestion
      returns
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0030.4
    requirement_ids: ["GW_INGEST_0030.4"]
    title: A closure is removed only when its snapshot is purged
    verification: automated-test
    description: |
      GIVEN a held composite snapshot with a recorded closure, soft-deleted and past its
      restore window
      WHEN the snapshot is purged
      THEN the closure and its members are removed with it, and neither survives the
      purge
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0030.5
    requirement_ids: ["GW_INGEST_0030.5"]
    title: Provenance carries the served commit, the upstream commit and the closure
    verification: automated-test
    description: |
      GIVEN a composite snapshot with a resolved closure, and a local-only snapshot with
      none
      WHEN a reviewer reads either snapshot's provenance
      THEN the composite's provenance carries its served commit, its upstream commit and
      its closure with the resolved plugin's name, clone URL and resolved commit; and the
      local-only snapshot's provenance carries no closure
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0030.6
    requirement_ids: ["GW_INGEST_0030.6"]
    title: The policy gate receives the resolved source count and each plugin's origin as facts
    verification: automated-test
    description: |
      GIVEN a composite snapshot with one external and one local plugin
      WHEN the policy facts for that snapshot are built
      THEN the snapshot's facts carry the resolved external source count and its upstream
      commit, and each plugin's facts carry its origin, with the external plugin's clone
      URL and resolved commit present and the local plugin's origin distinct from it
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0030.7
    requirement_ids: ["GW_INGEST_0030.7"]
    title: Snapshots whose closure contains a clone URL are found by one query
    verification: automated-test
    description: |
      GIVEN a composite snapshot resolved from a known clone URL and commit
      WHEN the snapshots containing that clone URL are queried, at that commit, at a
      different commit, and with no commit given
      THEN the snapshot is returned for the matching commit and for no commit given, and
      is absent for a different commit or a different clone URL
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0013
    requirement_ids: ["GW_APPROVAL_0013"]
    title: Approval refuses a snapshot whose closure is incomplete
    verification: automated-test
    description: |
      GIVEN a held composite snapshot whose recorded closure or pinned commit has been
      altered so that they no longer agree — a member row removed, a member's grafted tree
      or graft path changed, a snapshot re-pointed at a commit without the grafted content
      — or a held composite snapshot with no closure at all
      WHEN a reviewer approves it, with or without an administrative vetting override
      THEN the approval is refused with the closure-incomplete outcome naming the
      discrepancy, the refusal is on the audit ledger, the snapshot remains held and
      nothing is published; and an unaltered composite snapshot and a local-only snapshot
      are still approved
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0020
    requirement_ids: ["GW_FACADE_0020"]
    title: Only approved, served content is mirrored, and only when the mirror is enabled
    verification: automated-test
    description: |
      GIVEN a gateway whose mirror is disabled, a gateway whose mirror is enabled and
      points at a local bare repository, and a marketplace holding a snapshot that has
      been ingested into quarantine but not approved
      WHEN the snapshot is approved
      THEN the disabled gateway pushes nothing and the mirror repository stays empty,
      the enabled gateway's mirror comes to hold the approved commit at the served
      references, the mirror never holds a commit that was only ever quarantined, and no
      configured mirror credential appears in any ledger entry or API response
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0021
    requirement_ids: ["GW_FACADE_0021"]
    title: A mirror that cannot be pushed to changes neither the approval nor what is served
    verification: automated-test
    description: |
      GIVEN a gateway with the mirror enabled and pointed at a target that cannot be
      pushed to, and a marketplace with a held snapshot
      WHEN the snapshot is approved and a client then fetches the marketplace through the
      facade
      THEN the approval succeeds and reports no mirror error to its caller, the facade
      serves the approved commit exactly as it would with the mirror disabled, and the
      failed mirror update is recorded and visible in the mirror report
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0022
    requirement_ids: ["GW_FACADE_0022"]
    title: Revoking a snapshot removes it from the mirror, and a failed removal does not block it
    verification: automated-test
    description: |
      GIVEN a gateway with the mirror enabled, a marketplace whose approved snapshot has
      been mirrored, and in turn a reachable and an unreachable mirror target
      WHEN re-vetting revokes the snapshot
      THEN the reachable mirror stops holding the snapshot's references, the unreachable
      one leaves the revocation and the facade's refusal to serve the snapshot unchanged,
      and the divergence the unreachable target caused is recorded and reportable
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0023
    requirement_ids: ["GW_FACADE_0023"]
    title: The drift report names exactly how the mirror and the served references differ
    verification: automated-test
    description: |
      GIVEN a gateway with the mirror enabled and a marketplace whose approved snapshot
      has been mirrored, and a mirror repository afterwards altered behind the gateway's
      back so that a served reference is missing and a reference that is no longer served
      remains
      WHEN an administrator requests the mirror report
      THEN the report says the mirror and the served references agree before the
      alteration, names the missing and the no-longer-served references after it, carries
      the outcome and time of the last update attempt, reports an unreachable mirror as a
      failed comparison rather than as agreement, and is refused to a caller who is not an
      administrator
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0024
    requirement_ids: ["GW_FACADE_0024"]
    title: The image and the chart point the embedded git library's cache at the writable scratch directory
    verification: automated-test
    description: |
      GIVEN the container image and the deployment chart
      WHEN the packaging test validates them
      THEN the Dockerfile sets XDG_CONFIG_HOME to a path under /tmp and the rendered
      Deployment carries the same environment variable, so the embedded git library
      resolves its own configuration cache inside the writable temporary directory
      instead of falling back to a home directory the read-only root filesystem does
      not provide
    revision: "0.1.0"
  - id: SVC_GW_FACADE_0025
    requirement_ids: ["GW_FACADE_0025"]
    title: The schedule removes a revoked reference the revocation's own push could not
    verification: automated-test
    description: |
      GIVEN a gateway with the mirror enabled and a marketplace whose approved snapshot
      has been mirrored, and a mirror made unreachable before that snapshot is revoked so
      that the reconciliation the revocation triggers exhausts its retries and leaves the
      revoked reference on the mirror
      WHEN the mirror becomes reachable again and the scheduled reconciliation runs, with
      nothing approved, revoked or restarted in between
      THEN the revoked reference is gone from the mirror, the report says the mirror and
      the served references agree, the revocation's effect on what the facade serves was
      neither delayed nor reversed at any point, and a gateway whose mirror is disabled
      contacts nothing when the same schedule runs

      AND GIVEN the same gateway with a mirrored marketplace whose published repository is
      afterwards left answering short — readable, but no longer holding the served
      reference the system's own record says that marketplace has approved content for
      WHEN the scheduled reconciliation runs against it
      THEN the mirror is not emptied and not changed at all, the refusal is recorded on
      the ledger and reported as the outcome of the last attempt rather than as agreement
      or as a successful update, and a later reconciliation against a repository that
      reads correctly again reconciles normally
    revision: "0.1.0"
  - id: SVC_GW_FACADE_0026
    requirement_ids: ["GW_FACADE_0026"]
    title: The mirror's divergence is readable as metrics without asking the mirror
    verification: automated-test
    description: |
      GIVEN a gateway with the mirror enabled, a mirrored marketplace, and a mirror
      afterwards altered behind the gateway's back so that a served reference is missing
      and a reference that is no longer served remains
      WHEN a reconciliation runs and the gateway's meters are read
      THEN the meters report the number of references no longer served that the mirror
      still holds, the number of served references it lacks, whether the last
      reconciliation reached it, how long since one last succeeded, and the outcomes of
      the reconciliations attempted; no meter carries the marketplace, a commit, a
      principal or the mirror credential; and reading them contacts the mirror not at all
    revision: "0.1.0"
  - id: SVC_GW_FACADE_0027
    requirement_ids: ["GW_FACADE_0027"]
    title: An administrator's reconcile request repairs the mirror and answers with the result
    verification: automated-test
    description: |
      GIVEN a gateway with the mirror enabled and a mirror altered behind the gateway's
      back so that it holds a reference the facade no longer serves
      WHEN an administrator asks the gateway to reconcile the mirror
      THEN the mirror is brought into line with what the facade serves, the answer is the
      resulting comparison and carries no mirror credential, what the facade serves is
      unchanged, the same request is refused to a caller who is not an administrator, no
      machine-credential scope reaches it, and a gateway with no mirror configured answers
      that none is configured rather than failing
    revision: "0.1.0"
  - id: SVC_GW_FACADE_0028
    requirement_ids: ["GW_FACADE_0028"]
    title: The ledger names what a reconciliation changed, and says nothing when it changed nothing
    verification: automated-test
    description: |
      GIVEN a gateway with the mirror enabled and a mirrored marketplace
      WHEN a reconciliation follows a publication or a revocation, and separately when a
      reconciliation neither followed one repairs a mirror altered behind the gateway's
      back, and separately when a reconciliation finds the mirror already correct
      THEN the ledger records the first as a mirror update naming the references pushed
      and deleted, records the second as a repair of divergence naming the same, records
      nothing at all for the third, and carries the mirror credential in none of them
    revision: "0.1.0"
  - id: SVC_GW_API_0007
    requirement_ids: ["GW_API_0007"]
    title: Every refusal is a problem document carrying its reason
    verification: automated-test
    description: |
      GIVEN a request the gateway refuses
      WHEN the refusal is raised by a ResponseStatusException, by an @ExceptionHandler,
        or by request validation
      THEN each answers application/problem+json carrying a status and a human-readable
      detail, and none carries the framework's own default error keys
      AND every non-success response in the published contract declares that same shape
    revision: "0.1.0"

  - id: SVC_GW_API_0005
    requirement_ids: ["GW_API_0005"]
    title: The served document describes every lifecycle event, its body and its headers
    verification: automated-test
    description: |
      GIVEN the contract document the running application serves
      WHEN it is read against the event registry, the delivery body types and the header
      constants the dispatcher sends with
      THEN the document describes exactly the subscribable lifecycle events and no other,
      the audit export event among the ones absent
      AND each described delivery references the body type that event actually carries,
      present as a schema whose always-present fields are marked as always present
      AND each described delivery names all four transport headers, taken from the same
      constants the dispatcher sets rather than spelled again
      AND a serialized delivery carries every field the document marks always present
      AND each of those checks is shown to fail against a document from which the event,
      the field, the header or the body reference has been removed
    revision: "0.1.0"

  - id: SVC_GW_API_0006
    requirement_ids: ["GW_API_0006"]
    title: A removed delivery field or event is refused unless the change declares the break
    verification: automated-test
    description: |
      GIVEN the contract comparison the change process runs on every proposed change
      WHEN the proposed contract removes a lifecycle event, a delivery body field or a
      transport header
      THEN the comparison classifies it as breaking rather than advisory, because the
      delivery bodies are reachable from the part of the document compared with
      response-side severities
      AND the change is refused unless it is both marked as a deliberate break and
      declared as breaking by the commit that ships it, on the same terms and through the
      same configuration as the rest of the contract
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0030
    requirement_ids: ["GW_AUTH_0030"]
    title: A body-less mutation needs the token, and the cookies say what they must
    verification: automated-test
    description: |
      GIVEN a running gateway and an administrator's cookie-authenticated session
      WHEN a body-less state-changing POST is made without the anti-forgery token, and then with it,
      and separately the login redirect is requested over real HTTP
      THEN the request without the token is refused and the one with it is accepted, the response
      carries an anti-forgery cookie the surface's own script can read, and the session cookie
      declares the same-site attribute that still permits the identity provider's redirect back
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0029
    requirement_ids: ["GW_FACADE_0029"]
    title: Two marketplaces claiming one catalog name lose it, audibly
    verification: automated-test
    description: |
      GIVEN two served marketplaces whose names and plugin names join to the same catalog name, and a third marketplace whose name nothing contests
      WHEN the catalog is rebuilt and then read back from what the facade serves
      THEN the contested name appears in the catalog manifest for neither claimant, the uncontested marketplace's plugins are published unchanged, and the withheld name is on the audit ledger and reported by the catalog read together with both claimants
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0030
    requirement_ids: ["GW_FACADE_0030"]
    title: A scheduled pass whose turn is held elsewhere is skipped, not duplicated and not delayed
    verification: automated-test
    description: |
      GIVEN a turn already taken for a scheduled pass by another holder
      WHEN that pass is triggered on this instance
      THEN its body does not run and the trigger returns rather than waiting, a second
      pass under a different key is unaffected, the turn becomes available again once it
      has lapsed without anybody releasing it, the holder that took it is recorded, and
      every scheduled pass the application declares takes a turn under its own key
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0014
    requirement_ids: ["GW_APPROVAL_0014"]
    title: An approved snapshot that is not served is republished, and an unapproved served one is only reported
    verification: automated-test
    description: |
      GIVEN a marketplace serving an approved snapshot, whose served reference for that snapshot is then removed behind the gateway's back, and a second marketplace serving content for a snapshot no longer recorded as approved
      WHEN the publication reconciliation runs
      THEN the first marketplace serves the approved snapshot again and the repair is on the audit ledger as the gateway's own act, while the second marketplace still serves what it served and the discrepancy is reported rather than retracted
    revision: "0.1.0"


  - id: SVC_GW_APPROVAL_0015
    requirement_ids: ["GW_APPROVAL_0015"]
    title: An administrator revokes an approved snapshot on a stated reason, whatever the chain says
    verification: automated-test
    description: |
      GIVEN an approved and served snapshot whose vetting chain would currently clear it, with automated re-vetting configured only to record its findings
      WHEN an administrator revokes it on a stated reason
      THEN the snapshot is recorded revoked with that reason, the acting identity and the time, its content is no longer served, and the revocation is on the append-only audit ledger and announced as a lifecycle event, while the same request from a non-administrator, one with no reason, one with an empty reason, and one naming a snapshot that is not approved are each refused and change nothing
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0016
    requirement_ids: ["GW_APPROVAL_0016"]
    title: A revocation states what is served afterwards, and an impossible choice is refused before anything changes
    verification: automated-test
    description: |
      GIVEN a marketplace serving an approved snapshot that has an earlier approved snapshot, and a second marketplace serving its only approved snapshot
      WHEN the first is revoked asking to return to the previous approved snapshot, the second is revoked asking for the same, and a third revocation states no choice at all
      THEN the first marketplace serves the earlier snapshot with the return recorded on the ledger as a publication distinct from the revocation, the second is refused with its snapshot still approved and still served, the third is refused, and a revocation of a snapshot that is not the served one leaves the served content unchanged
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0017
    requirement_ids: ["GW_APPROVAL_0017"]
    title: An administratively revoked snapshot needs a reversal by a second administrator, and the refusal names the revocation
    verification: automated-test
    description: |
      GIVEN a snapshot one administrator revoked on a stated reason, whose vetting chain clears it
      WHEN a reviewer approves it ordinarily, when the revoking administrator reverses the revocation, and when a second administrator reverses it on a stated reason
      THEN the ordinary approval is refused naming the revocation with its reason, acting identity and time and nothing is published, the revoker's own reversal is refused, and the second administrator's reversal approves and serves the snapshot while the reversal is on the append-only audit ledger naming the revocation it reverses and the snapshot is marked as served over a reversed administrative revocation
    revision: "0.1.0"
  - id: SVC_GW_RETENTION_0008
    requirement_ids: ["GW_RETENTION_0008"]
    title: Retention reclaims an administratively revoked snapshot's content but never its record
    verification: automated-test
    description: |
      GIVEN an administratively revoked snapshot selected by a retention policy, and a re-vetting-revoked snapshot selected by the same policy
      WHEN retention reclaims their content and then permanently removes what it may
      THEN both snapshots have their content reclaimed, the re-vetting-revoked record is removed, the administratively revoked record survives with the refusal stating that it is retained because an administrator revoked it, and re-ingesting that same upstream commit still finds the revocation
    revision: "0.1.0"
  - id: SVC_GW_VETTING_0029.5
    requirement_ids: ["GW_VETTING_0029.5"]
    title: The effective chain names each vetter's resolved state and where it came from, and only to an administrator
    verification: automated-test
    description: |
      GIVEN a marketplace, a vetter disabled globally, a second vetter disabled for that marketplace alone, a third with no setting at all, and a non-administrator principal
      WHEN the effective vetting chain of that marketplace is read
      THEN the chain lists every configured vetter in the order it runs with the state its enablement resolves to for that marketplace and the source of that state — the marketplace-scoped setting, the global setting or the default — carrying the note and the acting administrator of whichever setting decided it, and the non-administrator is refused the read
    revision: "0.2.0"

  - id: SVC_GW_VETTING_0031
    requirement_ids: ["GW_VETTING_0031"]
    title: The portal draws the chain as an ordered flow whose nodes open their own evidence
    verification: automated-test
    description: |
      GIVEN an authenticated portal session and a marketplace whose snapshot the chain blocked
      WHEN the reviewer opens the snapshot's review surface and activates a vetter node of the chain flow
      THEN the flow is shown with a node per chain step in the order the vetters run, each carrying its verdict state as a word beside its icon, and the activated node opens its own evidence naming the vetter and the findings behind its verdict
    revision: "0.2.0"

  - id: SVC_GW_AUTH_0031
    requirement_ids: ["GW_AUTH_0031"]
    title: Last use is stamped by a successful authentication, never by a refused one, and is shown per credential
    verification: automated-test
    description: |
      GIVEN a live personal access token, a live machine API credential, a revoked token, an
      expired token and an unrecognised secret
      WHEN each is presented on the chain it belongs to, the two live credentials are presented
      twice in quick succession and again after the write bound has passed, the fetch-only token is
      also presented as a bearer credential on the machine API chain, and an operator opens the
      access tokens page
      THEN each live credential carries the time of its successful authentication and reports it in
      its own listing, the second presentation within the bound leaves that time unchanged while the
      one after it advances it, no refused presentation records anything against any credential, and
      the page shows the recorded time per token with the exact instant available and says never for
      a token that has not authenticated
    revision: "0.1.0"

  - id: SVC_GW_AUTH_0040
    requirement_ids: ["GW_AUTH_0040"]
    title: An identity-provider token clones, and every malformed or foreign one is refused alike
    verification: automated-test
    description: |
      GIVEN a running gateway configured to accept identity-provider bearer tokens from a pinned
      issuer, and a marketplace whose snapshot has been approved
      WHEN a git client clones carrying a valid bearer token, and then requests are made carrying in
      turn a token from another issuer, a token for another audience, an expired token, a
      not-yet-valid token, a token whose payload was altered after signing, a token carrying no
      audience, and a personal access token placed in the bearer header
      THEN the clone with the valid token delivers the approved content, every other request is
      refused without transferring anything, an unauthenticated request is still answered with a
      basic-authentication challenge, and the same valid token is refused outright by a gateway on
      which the capability is not enabled
    revision: "0.2.0"

  - id: SVC_GW_AUTH_0041
    requirement_ids: ["GW_AUTH_0041"]
    title: The ledger says which kind of credential fetched
    verification: automated-test
    description: |
      GIVEN a running gateway accepting both personal access tokens and identity-provider bearer
      tokens, and a marketplace whose snapshot has been approved
      WHEN the same marketplace is fetched once with each kind of credential
      THEN each resulting fetch entry names the principal the credential identifies and records the
      kind of credential that authenticated it, the entry authenticated by the identity-provider
      token names no gateway token, and the entry authenticated by the personal access token names
      the token that authenticated it
    revision: "0.2.0"

  - id: SVC_GW_AUTH_0042
    requirement_ids: ["GW_AUTH_0042"]
    title: A token good enough to clone is not good enough to administer
    verification: automated-test
    description: |
      GIVEN a running gateway configured to accept identity-provider bearer tokens on the git facade
      WHEN an identity-provider bearer token that the facade accepts is presented to an
      administrative endpoint that an authenticated session reaches
      THEN the administrative request is refused
    revision: "0.2.0"

  - id: SVC_GW_AUTH_0043
    requirement_ids: ["GW_AUTH_0043"]
    title: The wizard is in every section's header and says what held means
    verification: automated-test
    description: |
      GIVEN an authenticated portal session, a marketplace whose snapshot has been approved, and a
      marketplace whose only snapshot is still held
      WHEN the consumer opens each marketplace's page, moves between its sections, and opens its
      client set-up wizard from the header
      THEN the wizard is offered from the header on every section and offers the credential-storage
      command as its primary copy target, and the held marketplace states in its header and inside
      the wizard that a clone is answered with not-found until a snapshot is approved
    revision: "0.3.0"

  - id: SVC_GW_AUTH_0044
    requirement_ids: ["GW_AUTH_0044"]
    title: The user menu names the identity and every role with where it came from
    verification: automated-test
    description: |
      GIVEN portal sessions holding roles from configuration, from a stored grant, from an
      identity-provider claim and from the development escape hatch, a session holding no role at
      all, and a session whose membership claim the provider truncated
      WHEN each session opens the signed-in user's menu
      THEN the menu names the user, lists each role with the marketplace it is scoped to and the
      origin of the role in plain words, states the no-role case together with what that session may
      still do, and states that the list may be incomplete where the claim was truncated
    revision: "0.2.0"

  - id: SVC_GW_AUTH_0045
    requirement_ids: ["GW_AUTH_0045"]
    title: Signing out ends the session, and the escape hatch says there is none
    verification: automated-test
    description: |
      GIVEN an authenticated portal session, and a portal running with the development
      authentication escape hatch open
      WHEN the user opens the signed-in user's menu and signs out, and when the escape-hatch session
      opens the same menu
      THEN the session is ended and the browser is no longer authenticated, and the escape-hatch
      menu offers no sign-out control but states that there is no session to end
    revision: "0.2.0"

  - id: SVC_GW_AUTH_0046
    requirement_ids: ["GW_AUTH_0046"]
    title: Tokens are reached from the user menu and the existing address still resolves
    verification: automated-test
    description: |
      GIVEN an authenticated portal session
      WHEN the user opens the signed-in user's menu and follows it to their tokens, and when the
      token page's existing address is opened directly
      THEN both arrive at the token self-service page, and no estate-wide navigation entry offers it
    revision: "0.2.0"

  - id: SVC_GW_WEBHOOK_0008
    requirement_ids: ["GW_WEBHOOK_0008"]
    title: Every subscribable event is namespaced, the old spelling is refused, and a stored filter survives the rename
    verification: automated-test
    description: |
      GIVEN a subscriber whose event filter was stored before the namespace existed and a marketplace whose snapshot is approved
      WHEN the registry of subscribable events is read, a subscriber is registered with a filter naming an event under the old spelling, and the approval fans out
      THEN every event the registry offers carries the namespace, the old spelling is refused as an unknown event, the stored filter has been rewritten to the namespaced spelling, and the delivery that reaches that subscriber carries the namespaced name in its event header and in its body
    revision: "0.1.0"

  - id: SVC_GW_WEBHOOK_0009
    requirement_ids: ["GW_WEBHOOK_0009"]
    title: Registering a marketplace, changing its trigger and toggling a vetter each announce themselves, and a refused action announces nothing
    verification: automated-test
    description: |
      GIVEN a subscriber whose filter names the marketplace registration, update and vetter-toggle events
      WHEN a marketplace is registered, its sync mode is changed, a vetter is disabled for it and a vetter is disabled globally, and then a registration with a disallowed url scheme, a sync-mode change for an unknown marketplace and a toggle of an unknown vetter are each attempted
      THEN the subscriber receives one delivery per successful action, each naming the marketplace, the acting identity, the time and a content-free description of what changed, the global toggle reports the gateway-wide scope rather than a marketplace, no delivery carries the operator-supplied reason, and none of the three refused actions queues any delivery at all
    revision: "0.1.0"

  - id: SVC_GW_WEBHOOK_0010
    requirement_ids: ["GW_WEBHOOK_0010"]
    title: Removing a marketplace is announced, and a refused removal is not
    verification: automated-test
    description: |
      GIVEN a subscriber filtering for the marketplace removal event
      WHEN an administrator removes a marketplace, and separately a removal is refused
      THEN one delivery names the marketplace, the acting identity, the time and a description
      carrying no operator-supplied reason, and the refused removal delivers nothing
    revision: "0.1.0"

  - id: SVC_GW_WEBHOOK_0011
    requirement_ids: ["GW_WEBHOOK_0011"]
    title: A sink's channel cannot be deleted or rewritten except through its sink
    verification: automated-test
    description: |
      GIVEN an audit sink with its delivery channel, and a lifecycle subscriber
      WHEN the channel is deleted through the webhooks API, deleted directly in storage, and targeted by a
      declared webhook of the same name; and the lifecycle subscriber is deleted; and the sink is deleted
      THEN the API answers 409 naming the sink, storage rejects the deletion, the declared entry fails naming
      the sink while the declaration's other entries apply, the sink and its channel are unchanged with no
      change recorded; the lifecycle subscriber is deleted; the listing marks the channel with its sink; and
      deleting the sink removes both the sink and its channel
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0032
    requirement_ids: ["GW_VETTING_0032"]
    title: The stopping mode runs no vetter after the first blocking failure, and still records one verdict per vetter
    verification: automated-test
    description: |
      GIVEN a marketplace whose chain mode is set to stop after a failure and a snapshot whose content a vetter early in the chain fails
      WHEN the chain runs against that snapshot
      THEN no vetter after the failing one has run, the run carries one verdict for every vetter of the chain, and the run's outcome is blocked
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0032.1
    requirement_ids: ["GW_VETTING_0032.1"]
    title: The chain mode resolves per marketplace, then globally, then to running every vetter, and names its source
    verification: automated-test
    description: |
      GIVEN a gateway with no chain mode set anywhere, then a global mode, then a mode set for one marketplace alone
      WHEN the effective chain settings of that marketplace and of a second marketplace are read after each step
      THEN the resolved mode is running every vetter with no setting recorded, then the global mode for both marketplaces naming the global setting as its source, then the marketplace's own mode for it alone naming the marketplace-scoped setting while the second marketplace still resolves to the global one
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0032.2
    requirement_ids: ["GW_VETTING_0032.2"]
    title: A vetter the chain did not reach is recorded in its own state, told apart from a disabled one, and never clears
    verification: automated-test
    description: |
      GIVEN a marketplace whose chain mode is set to stop after a failure, one vetter after the failing one disabled for that marketplace, and a snapshot whose content the first vetter fails
      WHEN the chain runs and the recorded run is read back
      THEN the vetters after the failure are recorded as not reached naming the vetter that stopped the chain, the disabled one is still recorded as disabled, and no not-reached verdict counts as clearing evidence for the run
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0032.3
    requirement_ids: ["GW_VETTING_0032.3"]
    title: Waiving the finding that stopped the chain does not clear the run, and the snapshot cannot be approved
    verification: automated-test
    description: |
      GIVEN a snapshot whose chain stopped after a failing vetter, leaving later vetters not reached
      WHEN a waiver is written that covers every finding of the failing verdict and the effective outcome is read, and an approval of the snapshot is attempted
      THEN the effective outcome is still blocked, the vetters that were not reached are named among the reasons it blocks, the approval is refused, and only after a fresh run that reaches every vetter does the outcome stop being blocked
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0032.4
    requirement_ids: ["GW_VETTING_0032.4"]
    title: The chain mode is administrator-only to set and to read, is audited on every change, and records nothing when refused
    verification: automated-test
    description: |
      GIVEN an administrator, a non-administrator holding an approver role, and a marketplace
      WHEN the non-administrator attempts to read and to set the chain mode, the administrator sets it globally and then for the marketplace, and a mode change naming a marketplace that does not exist is attempted
      THEN the non-administrator is refused both the read and the write, each successful change writes a ledger entry naming the acting identity, the scope, the new mode and the note, and the refused change writes none
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0033
    requirement_ids: ["GW_VETTING_0033"]
    title: An administrator's order is the order the chain runs in, globally and per marketplace
    verification: automated-test
    description: |
      GIVEN a gateway whose vetters run in their configured positions
      WHEN an administrator sets a different order globally, a marketplace sets an order of its own, and a snapshot of each marketplace is ingested
      THEN each run records its verdicts in the order that applies to its marketplace, the marketplace's own order wins over the global one, and a marketplace with no order of its own runs the global one
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0033.1
    requirement_ids: ["GW_VETTING_0033.1"]
    title: The resolved order is total, drops no vetter, and an unknown or duplicated name is refused and never stored
    verification: automated-test
    description: |
      GIVEN a chain of built-in vetters and one operator-configured external vetter
      WHEN an administrator sets an order naming only some of them, and then attempts an order naming a vetter that does not exist and an order naming one vetter twice, and a non-administrator attempts to set an order
      THEN the resolved chain lists the named vetters first in the order given followed by the unnamed ones in their configured positions with ties broken by name, both malformed orders are refused and neither is stored nor audited, the non-administrator is refused, and each accepted change is on the ledger
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0033.2
    requirement_ids: ["GW_VETTING_0033.2"]
    title: A run records the mode and the resolved order it used, and changing either changes the recorded identity
    verification: automated-test
    description: |
      GIVEN a marketplace with a default chain mode and order
      WHEN a snapshot is vetted, the chain mode is changed and the snapshot is re-vetted, and then the order is changed and the snapshot is re-vetted again
      THEN each run records a chain identity carrying the mode it used and its vetters in the order it used them, the three identities differ from one another, and the marketplace's effective chain reports the resolved mode and the resolved order
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0034
    requirement_ids: ["GW_VETTING_0034"]
    title: The portal sets the mode, reorders the chain by keyboard, and shows a chain that stopped early
    verification: automated-test
    description: |
      GIVEN an authenticated administrator session, a marketplace whose vetting chain is shown, and a snapshot whose chain stopped after a failing vetter
      WHEN the administrator sets the chain mode and moves a vetter with the named movement control reached by keyboard, and then opens the snapshot's chain flow
      THEN the mode and the order are saved and shown with the source each resolves from, the reordering is operable without a pointer, and the snapshot's flow marks the vetters the run did not reach distinctly and says above the chain that the run stopped early and at which step
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0035
    requirement_ids: ["GW_VETTING_0035"]
    title: The Vetting page governs the default chain and names every marketplace that departs from it
    verification: automated-test
    description: |
      GIVEN an authenticated administrator session, a marketplace whose chain resolves entirely from the default, and a marketplace that overrides the chain mode
      WHEN the administrator opens the Vetting page, sets the global default from it, and reads the overrides it lists
      THEN the default chain is shown with the mode, the vetter order and each vetter's enablement resolved by the gateway, the global default is saved, the overriding marketplace is listed with what it overrides, and the page and its data are refused to a session that does not hold the administrative role
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0036
    requirement_ids: ["GW_VETTING_0036"]
    title: Clearing an override returns the marketplace to the global setting, and is not the same as writing the default
    verification: automated-test
    description: |
      GIVEN a marketplace that overrides the chain mode, the vetter order and a vetter's enablement
      WHEN an administrator writes the default value as an override, and then clears each override, and then clears an override that is not there
      THEN writing the default value leaves the source reported as the marketplace, clearing returns the source to the global setting or the default and is recorded on the ledger, and clearing what is not there stores nothing and records nothing
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0037
    requirement_ids: ["GW_VETTING_0037"]
    title: One bulk chain change is validated whole, applied per marketplace, and audited as one act
    verification: automated-test
    description: |
      GIVEN an authenticated administrator session and several registered marketplaces
      WHEN a bulk chain change naming an unknown vetter is sent, then a bulk change naming a marketplace that does not exist alongside ones that do, and then a valid bulk change
      THEN the invalid shape is refused whole with nothing stored and nothing recorded, the request carrying the unknown marketplace reports a per-marketplace outcome distinguishing it from a wholly successful request and still applies to the others, each changed marketplace carries its own ledger entry with the shared note and one correlation identifier, and a non-administrator is refused
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0031
    requirement_ids: ["GW_FACADE_0031"]
    title: A holder learns that what it holds is approved, superseded-but-approved, or withdrawn
    verification: automated-test
    description: |
      GIVEN a marketplace whose approved snapshot has been superseded by a later approval, a snapshot that has been revoked, and a snapshot approved over a reversed administrative revocation
      WHEN a client authenticated as the facade authenticates asks about those commits, and then asks about more pairs than the bound allows
      THEN the superseded commit is reported approved, the revoked one is reported revoked with the time of its revocation, the one approved over a reversed revocation is distinguishable from one never withdrawn, each answer appears in the order asked, the oversized request is refused with none of its pairs answered, and no entry is appended to the audit ledger by any of them
    revision: "0.1.0"

  - id: SVC_GW_FACADE_0032
    requirement_ids: ["GW_FACADE_0032"]
    title: The check discloses nothing beyond what the same credential could fetch
    verification: automated-test
    description: |
      GIVEN a token scoped to one marketplace, a second marketplace outside that scope, a marketplace that does not exist, a commit that was never ingested, a commit that was ingested and never approved, and a commit that was revoked with a stated reason
      WHEN the scoped client asks about each of them, and an unauthenticated client asks about any of them
      THEN the out-of-scope marketplace and the nonexistent one are answered identically, the never-ingested, never-approved and no-longer-recorded commits are answered identically, none of those answers claims approval, no part of the revocation reason appears in any answer, the unauthenticated request is refused, and an unscoped token still reaches every marketplace
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0036
    requirement_ids: ["GW_INGEST_0036"]
    title: Facts are recorded once at ingestion, carry the current state on read, and are what the policy gate evaluates
    verification: automated-test
    description: |
      GIVEN a marketplace whose manifest declares two plugins, a snapshot too large for its facts to be built, and an enabled policy rule over the facts
      WHEN a snapshot is ingested, read back across a held, approved and revoked sequence, ingested again, has its recorded facts altered directly in the database, and is submitted for approval
      THEN the recorded facts equal those built from the pinned commit except for the state, the state read back is always the current one, the plugin-name index names each plugin with the manifest line that declares it, a second ingestion rewrites nothing, the policy gate decides on the recorded facts rather than on a fresh build, and the oversized snapshot is ingested with its plugin names indexed and no facts recorded, while the policy gate still refuses it for the same reason as before
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0037
    requirement_ids: ["GW_INGEST_0037"]
    title: The review queue gathers held snapshots across marketplaces and decides nothing itself
    verification: automated-test
    description: |
      GIVEN two marketplaces, each with a snapshot awaiting a decision, and a third with none
      WHEN a reviewer reads the portal navigation, opens the review queue, and opens an entry
      THEN the navigation states two awaiting, the queue lists both snapshots with marketplace,
      commit, state, vetting outcome and ingestion and no approve or reject control, the list of
      marketplaces offers none either, and the entry opens that snapshot on its marketplace's
      review beside its evidence
    revision: "0.3.0"

  - id: SVC_GW_APPROVAL_0019
    requirement_ids: ["GW_APPROVAL_0019"]
    title: A colliding snapshot is refused with a conflict naming the incumbent, nothing is published, and the switch turns it off
    verification: automated-test
    description: |
      GIVEN an approved snapshot of one marketplace declaring a plugin, a held snapshot of another marketplace declaring a lookalike of that name, a held snapshot whose plugin inventory cannot be read, and a gateway with the rule switched off
      WHEN approval of each held snapshot is requested, through the API and through the service
      THEN the colliding snapshot is refused with a conflict naming the colliding name, its manifest location, and the incumbent's marketplace and snapshot, it stays held and the marketplace serves nothing new, the unreadable snapshot is refused with a distinct reason that names no collision, and with the rule switched off the same colliding approval succeeds
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0019.1
    requirement_ids: ["GW_APPROVAL_0019.1"]
    title: The normalised keys equate lookalikes and nothing else
    verification: automated-test
    description: |
      GIVEN plugin names differing by case, by separators, by a digit standing for a letter, by a Cyrillic or other confusable letter, by a compatibility form, and by an invisible format character, and pairs of genuinely different names including ones a single edit apart
      WHEN each name is reduced to its keys
      THEN every lookalike pair shares a key, including an all-capitals spelling and one with a capital I standing for an l, no genuinely different pair does — including those a single edit apart — and every key reduces to itself alone
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0019.2
    requirement_ids: ["GW_APPROVAL_0019.2"]
    title: Only new plugin names are checked, skill names never are, and the incumbent keeps being served
    verification: automated-test
    description: |
      GIVEN an incumbent marketplace serving a plugin, a newcomer declaring a lookalike plugin name, a newcomer whose skill but not plugin shares the incumbent's name, and a marketplace whose own earlier approved snapshot already carried the name
      WHEN each snapshot's approval is requested, the colliding one again after its collision has been waived and approved, and a later snapshot of each marketplace carrying the same names is approved
      THEN only the snapshot introducing the lookalike plugin name is refused, the skill-name match and the marketplace's own history are not, a later snapshot of a marketplace that has already been admitted with the name passes without a new waiver, and the incumbent stays approved and served throughout
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0019.3
    requirement_ids: ["GW_APPROVAL_0019.3"]
    title: Two colliding approvals racing each other admit exactly one
    verification: automated-test
    description: |
      GIVEN two held snapshots of different marketplaces declaring colliding plugin names, each approvable on its own
      WHEN both approvals are requested concurrently and are held so that each has evaluated every earlier gate before either is recorded
      THEN exactly one is approved and served, the other is refused as a collision with it and stays held with nothing published, and no snapshot is left recorded as approved without being served
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0019.4
    requirement_ids: ["GW_APPROVAL_0019.4"]
    title: A revoked snapshot whose name was taken meanwhile is refused on restore
    verification: automated-test
    description: |
      GIVEN an approved snapshot that is then revoked, and a snapshot of another marketplace declaring a colliding plugin name approved while it was revoked
      WHEN the revoked snapshot's approval is requested again
      THEN it is refused as a collision with the snapshot approved in the meantime and stays revoked, and once the collision is waived it is restored
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0020
    requirement_ids: ["GW_APPROVAL_0020"]
    title: Only an active covering waiver lifts a collision, and the vetting override does not
    verification: automated-test
    description: |
      GIVEN a snapshot refused for a name collision
      WHEN approval is requested with a waiver on another rule, an expired waiver, a revoked waiver, the administrative vetting override with a reason, and finally an active snapshot-scoped waiver on the name-collision rule
      THEN every attempt but the last is refused as a collision, the last succeeds, and its waiver is reported as applied, reaches the ledger as a waiver use, and makes a reviewer who wrote it a four-eyes conflict
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0021
    requirement_ids: ["GW_APPROVAL_0021"]
    title: The collision report agrees with the gate, and every refusal is on the ledger
    verification: automated-test
    description: |
      GIVEN a held snapshot with a name collision and a held snapshot with none
      WHEN the collision report is read for each, the colliding one's approval is attempted, and the report is read again after a waiver is recorded
      THEN the report lists the collision with its location and incumbent and says the approval would be refused, lists nothing for the other, the refused attempt is on the ledger naming the name-collision rule and the incumbent, and after the waiver the report shows the collision as covered and no longer refusing
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0039
    requirement_ids: ["GW_VETTING_0039"]
    title: A re-run over unchanged content is unchanged by changes to the estate
    verification: automated-test
    description: |
      GIVEN an approved snapshot with a recorded chain run
      WHEN other snapshots, including ones declaring colliding plugin names, are approved and revoked, and the snapshot is re-vetted
      THEN the new run records the same chain and the same verdicts and findings as the first
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0038
    requirement_ids: ["GW_INGEST_0038"]
    title: An upstream failure is reported with its reason, root cause and next step
    verification: automated-test
    description: |
      GIVEN an upstream that answers not found, one that answers 401, one that refuses connections, and failures whose specific error is attached to a generic retry error
      WHEN the upstream is registered, ingested, or the failure translated
      THEN not found and 401 both read "repository not found or requires authentication", a refused connection reads that the upstream could not be reached, the reason comes from the attached first error when it is the specific one, the response carries reason, root cause and next step, a warning is logged, and a credential in the URL appears in none of them
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0039
    requirement_ids: ["GW_INGEST_0039"]
    title: The marketplace read shows how the last ingest ended
    verification: automated-test
    description: |
      GIVEN a registered marketplace whose upstream becomes unreadable and then readable again, and a scheduled marketplace whose upstream is deleted
      WHEN it is ingested manually, again after the upstream recovers, and the sync sweep runs over the scheduled one
      THEN the marketplace read shows failed with the time and reason after the failure, succeeded with no reason after the recovery, failed after the sweep, and the portal states the failed last ingest, when and why, on the marketplace's page
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0040
    requirement_ids: ["GW_INGEST_0040"]
    title: Registration of an unreadable upstream is refused and creates nothing
    verification: automated-test
    description: |
      GIVEN a missing repository, one answering 401, an unreachable port, an empty repository, and two readable repositories over HTTP and file
      WHEN each is registered through the API
      THEN each unreadable one is refused with the translated reason and is neither listed nor ledgered as registered, and each readable one is registered
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0041
    requirement_ids: ["GW_INGEST_0041"]
    title: A declared marketplace with an unreachable upstream is registered and reported
    verification: automated-test
    description: |
      GIVEN an estate declaring one marketplace with an unreachable upstream and one with a readable upstream
      WHEN the estate is reconciled
      THEN both are created, the unreachable one's entry names the reason, the ledger records the unreachable upstream by the reconciler, and the reconciliation completes
    revision: "0.3.0"

  - id: SVC_GW_AUDIT_0010
    requirement_ids: ["GW_AUDIT_0010"]
    title: Failed ingests are ledgered by the identity that triggered them
    verification: automated-test
    description: |
      GIVEN a marketplace whose upstream is unreadable
      WHEN an approver ingests it, and the sync sweep ingests a scheduled one whose upstream is deleted
      THEN the ledger holds an ingest-failed entry for each, by the approver and by the scheduler, whose detail names the reason
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0048
    requirement_ids: ["GW_INGEST_0048"]
    title: An administrator removes a marketplace from its settings in the portal
    verification: automated-test
    description: |
      GIVEN an administrator on a registered marketplace's settings, and a user who is not an administrator on the same page
      WHEN the administrator opens the removal confirmation, leaves the reason empty or blank, then writes a reason and confirms; and when the server refuses the removal
      THEN the confirmation names the marketplace and states the consequences, confirming is unavailable until the reason holds text, the removal is requested with the trimmed reason and the portal lands on the marketplace list without the marketplace, a refusal is shown with the confirmation still open, and the non-administrator is shown no removal control
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0049
    requirement_ids: ["GW_INGEST_0049"]
    title: The portal does not offer to remove a declared marketplace
    verification: automated-test
    description: |
      GIVEN an administrator on the settings of a marketplace that the last estate reconciliation lists as declared
      WHEN the settings are shown
      THEN the removal control is unavailable and the page states that the next reconciliation would register the name again and that the declaration has to be removed first
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0050
    requirement_ids: ["GW_INGEST_0050"]
    title: A private upstream registers and ingests with its prefix's credential
    verification: automated-test
    description: |
      GIVEN an upstream that answers 401 without the right Basic credential, a credential configured for its owner's prefix and a shorter one for its host
      WHEN it is registered and ingested, and when a prefix differing only by a trailing segment character or by case of scheme and host is matched
      THEN registration and ingestion both succeed carrying the longest prefix's credential, an upstream under no prefix is read without any, and matching honours whole segments
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0051
    requirement_ids: ["GW_INGEST_0051"]
    title: A redirect out of the prefix carries no credential
    verification: automated-test
    description: |
      GIVEN a credentialed upstream that redirects to the same host on another port, to another path on the same host, and to another credentialed prefix
      WHEN each is registered
      THEN no request outside the selected prefix carries an Authorization header, and non-canonical request paths get no credential
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0052
    requirement_ids: ["GW_INGEST_0052"]
    title: The token appears in no response, record, ledger entry or log
    verification: automated-test
    description: |
      GIVEN a credentialed upstream that refuses the token, and one whose server quotes the token in its error
      WHEN they are registered and ingested
      THEN the token is absent from every API response, the marketplace record, the ledger, the fetch log, the captured log output and the configuration's string form
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0053
    requirement_ids: ["GW_INGEST_0053"]
    title: An unusable credential entry stops startup and names the entry, not the token
    verification: automated-test
    description: |
      GIVEN credential entries with an unresolved reference, a blank token, a blank username, an http prefix to a non-loopback host, userinfo, a query, a fragment, and a duplicate prefix
      WHEN the credentials are loaded
      THEN each is refused with a message naming its position and prefix and not its token, while https and loopback http entries load
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0054
    requirement_ids: ["GW_INGEST_0054"]
    title: A clone URL with userinfo is refused and nothing is created
    verification: automated-test
    description: |
      GIVEN a readable upstream
      WHEN it is registered with user and password, or a user alone, embedded in its clone URL
      THEN registration answers 400, the upstream is never contacted, and nothing is created
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0055
    requirement_ids: ["GW_INGEST_0055"]
    title: The registration ledger entry names the credential prefix
    verification: automated-test
    description: |
      GIVEN a credentialed upstream and an anonymous one
      WHEN both are registered
      THEN the credentialed registration's ledger detail names the prefix and not the token, and the anonymous one names no credential
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0056
    requirement_ids: ["GW_INGEST_0056"]
    title: A private upstream registers and ingests with a minted installation token
    verification: automated-test
    description: |
      GIVEN an upstream that answers 401 without the installation token, a GitHub App entry for its prefix with and without an installation id, and a fake GitHub API
      WHEN it is registered and ingested
      THEN every git request under the prefix carries x-access-token and the minted token, the installation is looked up when none is configured, and both succeed
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0057
    requirement_ids: ["GW_INGEST_0057"]
    title: The token request names one repository and read-only contents
    verification: automated-test
    description: |
      GIVEN a GitHub App entry whose prefix covers an owner
      WHEN a repository under it is registered
      THEN the token request's body names that repository alone and contents read alone
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0058
    requirement_ids: ["GW_INGEST_0058"]
    title: A cached token is reused, a near-expiry one renewed, and a refused one renewed once
    verification: automated-test
    description: |
      GIVEN a fake GitHub API that issues tokens expiring in an hour, then in two minutes, then a different token the upstream wants
      WHEN the same repository is read repeatedly
      THEN an hour-long token is minted once, a two-minute one on every read, a refused cached token is renewed exactly once and the read succeeds, and a refused fresh token is reported without another mint
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0059
    requirement_ids: ["GW_INGEST_0059"]
    title: Each GitHub API refusal is reported with its own reason
    verification: automated-test
    description: |
      GIVEN a fake GitHub API that answers 404 for the installation lookup, 422, 404 and 403 for the token, 401 with and without a clock message, a closed port, and a URL with a third path segment
      WHEN each is registered
      THEN registration answers 502 with the reason for that case and nothing is created
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0060
    requirement_ids: ["GW_INGEST_0060"]
    title: An unusable GitHub App entry stops startup and names the entry, not the key
    verification: automated-test
    description: |
      GIVEN GitHub App entries with both kinds, neither, a missing or non-numeric id, a malformed, truncated, encrypted or non-RSA key, an unresolved reference, and an http or query-carrying API URL
      WHEN the credentials are loaded
      THEN each is refused with a message naming its position and prefix and not its key, while PKCS#1 and PKCS#8 keys load
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0061
    requirement_ids: ["GW_INGEST_0061"]
    title: The API is contacted only at the configured URL
    verification: automated-test
    description: |
      GIVEN a GitHub App entry whose API is a separate server from the upstream
      WHEN a repository is registered, and when a URL with a non-plain owner or repository is registered
      THEN every API request reached the configured server and none reached the upstream's host, and the non-plain name reached no API at all
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0062
    requirement_ids: ["GW_INGEST_0062"]
    title: The registration ledger entry names the GitHub App kind
    verification: automated-test
    description: |
      GIVEN a GitHub App credential and a static one
      WHEN an upstream under each is registered
      THEN the App registration's ledger detail names the prefix and the kind, and the static one names the prefix alone
    revision: "0.3.0"

  - id: SVC_GW_AUTH_0049
    requirement_ids: ["GW_AUTH_0049"]
    title: The key, assertion and installation token appear nowhere
    verification: automated-test
    description: |
      GIVEN a GitHub App entry, an upstream that refuses its token, and an API whose error quotes the token
      WHEN registrations and ingestions succeed and fail
      THEN the key, any assertion sent and any token issued are absent from every API response, the marketplace record, the ledger, the fetch log, the captured log output and the configuration's string form
    revision: "0.3.0"

  - id: SVC_GW_AUTH_0050
    requirement_ids: ["GW_AUTH_0050"]
    title: The assertion verifies against the App's key and expires within ten minutes
    verification: automated-test
    description: |
      GIVEN a GitHub App key
      WHEN an assertion is signed, twice
      THEN it verifies with the public key under RS256, names the App as issuer, is issued sixty seconds in the past, expires within ten minutes, and the two differ
    revision: "0.3.0"

  - id: SVC_GW_AUTH_0051
    requirement_ids: ["GW_AUTH_0051"]
    title: The assertion goes only to the API, never across a redirect or on a git request
    verification: automated-test
    description: |
      GIVEN a GitHub App entry, an upstream that redirects to another port and another path, and an API that redirects the token request elsewhere
      WHEN each is registered
      THEN no git request carries an assertion, no request outside the prefix carries the installation token, and the API's redirect is not followed
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0063
    requirement_ids: ["GW_INGEST_0063"]
    title: A 63-character marketplace name is accepted and a 64-character one is refused everywhere
    verification: automated-test
    description: |
      GIVEN a name of 63 permitted characters and one of 64
      WHEN each is registered as an upstream and as a hosted marketplace through the API, declared in the estate, fetched and pushed through the facade, asked about on the revocation-status check, and inserted into the marketplace table directly
      THEN the 63-character name registers, and the 64-character name is refused at every point with nothing registered, answered not-found on the facade, answered 400 on the status check, and rejected by the database
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0064
    requirement_ids: ["GW_INGEST_0064"]
    title: The name refusal names the clone path in the API and in the portal
    verification: automated-test
    description: |
      GIVEN a marketplace name that breaks the rule
      WHEN it is registered through the API, declared in the estate, or typed into the portal's registration form
      THEN the refusal and the form's hint and field error state the rule in words and that the name is the /git/<name> path clients clone, and the form's Register control stays disabled
    revision: "0.3.0"

  - id: SVC_GW_VETTING_0040
    requirement_ids: ["GW_VETTING_0040"]
    title: The lines that raised false positives raise nothing, and the payloads the rules exist for still fail
    verification: automated-test
    description: |
      GIVEN instruction files carrying, one each, the lines from a real skill repository that raised false positives, and lines carrying concealment and instruction-override payloads
      WHEN the prompt-injection vetter scans them
      THEN the first raise no finding, and each payload raises exactly one high finding of its rule at its path and line
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0041
    requirement_ids: ["GW_VETTING_0041"]
    title: Copies of one blob collapse into one group, and nothing else does
    verification: automated-test
    description: |
      GIVEN findings on the same blob and line at several paths, and findings differing in blob, line, rule, or carrying no blob; and a vetter claiming a blob id for its findings
      WHEN the findings are grouped and the chain identifies their content from the pinned tree
      THEN the copies form one group listing every location, every other finding is a group of its own, and each finding's blob is the one the pinned tree holds at its path, or none where the location names no file
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0042
    requirement_ids: ["GW_VETTING_0042"]
    title: A group waiver covers every copy of its content and nothing else
    verification: automated-test
    description: |
      GIVEN a snapshot with one file vendored at two paths and a third file carrying the same rule on different bytes
      WHEN a group waiver is recorded for the vendored group, and near-miss findings are evaluated against it
      THEN both copies are suppressed, the third file still blocks, a finding on another blob, another line, another rule, another snapshot or with no blob is not covered, a lapsed or revoked group waiver covers nothing, and a group waiver on a path scope or with a malformed blob id is refused
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0043
    requirement_ids: ["GW_VETTING_0043"]
    title: Unscanned files are one entry per reason, and a pass that skipped files says so
    verification: automated-test
    description: |
      GIVEN a snapshot with files over the size limit and binary files, and one with neither
      WHEN the secret and prompt-injection vetters scan them and the verdict is recorded and shown
      THEN each reason yields one informational entry naming the first files and counting the rest, the coverage summary on the passing verdict row and in the ledger states how many files were not scanned and why, and the snapshot with neither carries no entry and no such clause
    revision: "0.1.0"

  - id: SVC_GW_VETTING_0044
    requirement_ids: ["GW_VETTING_0044"]
    title: A vendored group is one row with every location and one waive action defaulting to the group
    verification: automated-test
    description: |
      GIVEN a snapshot whose vetting run has a group of identical content at several locations and a group at one location
      WHEN the reviewer opens the vetting surface and waives the first group
      THEN each group is one row listing its locations, each blocking group's action says what it waives, the waiver form defaults to the group, offers no path for a group of several locations, and records a waiver naming the group's blob and line
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0022
    requirement_ids: ["GW_APPROVAL_0022"]
    title: The refusal names each blocking group at its locations
    verification: automated-test
    description: |
      GIVEN a blocked snapshot with a group of twelve identical locations and a group of one
      WHEN approval is attempted and the portal shows what blocks it
      THEN the refusal names two groups, each with its rule and its path:line locations, the first ten spelled out and the rest counted, and the portal lists each group once with its locations
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0025
    requirement_ids: ["GW_APPROVAL_0025"]
    title: Every path of a snapshot wider than one page is reached folder by folder
    verification: automated-test
    description: |
      GIVEN a served snapshot and a held successor whose single directory holds more children than one page, with paths added, modified and removed
      WHEN a reviewer lists the root and that directory page by page, and asks for directories that are absent or traversal-shaped
      THEN every child is reached exactly once with its kind, size and change, removed paths included, each directory's counts match its contents, absent and traversal-shaped directories are not found, and the portal loads a folder when opened and the rest of a wide folder on request
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0026
    requirement_ids: ["GW_APPROVAL_0026"]
    title: Totals are stated over the whole set, not the page
    verification: automated-test
    description: |
      GIVEN a snapshot with more files than a listing page and more changed paths than a diff page
      WHEN the first page of the listing, a directory and the diff are read
      THEN each states the full count it pages over, the diff summary's change-type, binary and line counts are exact over the whole diff, and the portal presents those totals
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0027
    requirement_ids: ["GW_APPROVAL_0027"]
    title: A path search finds files anywhere in the snapshot
    verification: automated-test
    description: |
      GIVEN a snapshot with more files than a listing page
      WHEN a reviewer searches for a path fragment in a different case, and pages the unfiltered listing to its end
      THEN every file whose full path contains the fragment is found with the count of matches, the pages together hold every path once, and the portal shows the matches against the snapshot's total
    revision: "0.1.0"

  - id: SVC_GW_APPROVAL_0028
    requirement_ids: ["GW_APPROVAL_0028"]
    title: The diff is read to its end a page at a time, or narrowed to one path
    verification: automated-test
    description: |
      GIVEN a held snapshot with more changed paths than one diff page against the served commit
      WHEN the diff is read page by page, narrowed to one file, to one directory, and to a traversal-shaped path
      THEN the pages together hold every changed path once and each names the baseline, the narrowed reads hold exactly that file or that directory's changes and the traversal shape holds nothing, and the portal's Diff tab lists every changed file with its diff
    revision: "0.1.0"

  - id: SVC_GW_INGEST_0045
    requirement_ids: ["GW_INGEST_0045"]
    title: The inventory lists commands, agents, hooks and MCP servers from every declaration source
    verification: automated-test
    description: |
      GIVEN a snapshot whose plugins declare commands, agents, hooks and MCP servers in their default locations, in plugin manifest paths and inline configuration, in a marketplace entry, and in skill and agent frontmatter, and one plugin with a malformed hook file
      WHEN the snapshot's content inventory is read
      THEN each plugin lists every component with its declaring location, each hook carries its trigger, matcher, type and command, a manifest path that replaces a default location replaces it, a path escaping the plugin root is ignored, and the malformed file leaves only that plugin's hooks out
    revision: "0.3.0"

  - id: SVC_GW_INGEST_0046
    requirement_ids: ["GW_INGEST_0046"]
    title: The inventory shows collapsed counts per component kind that expand in place
    verification: automated-test
    description: |
      GIVEN a snapshot whose plugin has one skill, four agents and three hooks
      WHEN the reviewer opens the Inventory tab and expands the hooks
      THEN the plugin reads one count per kind it has and none for a kind it lacks, every list is collapsed, and expanding the hooks shows each trigger and command in place while the others stay collapsed
    revision: "0.3.0"

  - id: SVC_GW_VETTING_0047
    requirement_ids: ["GW_VETTING_0047"]
    title: Every auto-running hook warns with its trigger at its declaration, from every source
    verification: automated-test
    description: |
      GIVEN a snapshot whose plugins declare hooks in the default hook file, in a hook file and inline in the plugin manifest, inline in the marketplace entry, and in skill and agent frontmatter, and one snapshot with no hooks
      WHEN the chain runs
      THEN the executable-surface verdict warns with one medium finding per hook naming its trigger and command at its declaration's path:line, the snapshot without hooks passes with a coverage summary, and the vetter can be switched off like any built-in
    revision: "0.3.0"

  - id: SVC_GW_VETTING_0048
    requirement_ids: ["GW_VETTING_0048"]
    title: Download-and-execute and package runners reached by a hook block; the negatives stay silent
    verification: automated-test
    description: |
      GIVEN hooks whose command pipes a download into a shell, feeds one through substitution, runs a package runner, or launches a script (directly, in a subdirectory, or through a second script) that downloads a binary into a cache and makes it executable, including through quoting inserted into the command name; and negatives: documentation mentioning curl, a script with the same text that no hook launches, a comment line, a hook that only runs a local script, and a script that downloads without executing
      WHEN the chain runs
      THEN each positive raises one high finding at its path:line, blocks the snapshot, groups and waives like any finding, and every negative raises none
    revision: "0.3.0"

  - id: SVC_GW_VETTING_0049
    requirement_ids: ["GW_VETTING_0049"]
    title: An unparseable hook file and a binary or oversized launched file are reported
    verification: automated-test
    description: |
      GIVEN a plugin whose hook file is not valid JSON, and a hook that launches a binary file of the snapshot and one over the scan size limit
      WHEN the chain runs
      THEN each yields one medium finding naming the file, and none is passed silently
    revision: "0.3.0"
