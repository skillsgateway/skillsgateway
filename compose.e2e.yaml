# Portal e2e infrastructure: PostgreSQL + a mock OIDC identity provider.
# The gateway itself runs from the boot jar on the host (see src/main/frontend/e2e/run-e2e.sh)
# so Playwright exercises the real application with a real login redirect.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: skillsgateway
      POSTGRES_USER: skillsgateway
      POSTGRES_PASSWORD: skillsgateway
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsgateway"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The mock IdP issues a groups claim on every token so the acceptance suite
  # exercises the real claim-to-role path (GW_0098) through a real login.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.3.0
    environment:
      JSON_CONFIG: >-
        {"interactiveLogin": true,
         "tokenCallbacks": [
           {"issuerId": "default",
            "tokenExpiry": 3600,
            "requestMappings": [
              {"requestParam": "grant_type",
               "match": "*",
               "claims": {"groups": ["sg-gateway-admins"]}}
            ]}
         ]}
    ports:
      - "9090:8080"
