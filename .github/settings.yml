# Repository settings as code.
#
# Read by either of two GitHub Apps -- NEITHER IS INSTALLED ON THIS ORG, and
# **this file does nothing until one is**:
#
#   * repository-settings/app ("Settings")  -- per-repo, reads exactly this
#     path. https://github.com/repository-settings/app
#   * github/safe-settings                  -- org-scale successor, reads from
#     an admin repo and needs a GitHub App.
#     https://github.com/github/safe-settings
#
# Kept here regardless, for two reasons: it makes settings drift a reviewable
# change rather than something someone silently clicked; and if an app is ever
# installed, it applies without being rewritten first.
#
# Until then this file is documentation -- every setting below has to be applied
# by hand through the GitHub UI, and the labels created by hand or by API.
#
# THIS FILE IS IN repository-settings/app FORMAT, not safe-settings format --
# they look similar and are not interchangeable. Two concrete differences if
# this ever moves to safe-settings (which would also mean moving the file into
# an admin repo, since safe-settings reads from there, not from here):
#
#   1. labels: safe-settings nests them under `labels: { include: [...] }`
#      (and supports `exclude:`); this format takes a flat `labels: [...]`.
#   2. security: safe-settings has a `repository.security` block with
#      `enableVulnerabilityAlerts` / `enableAutomatedSecurityFixes`. There is no
#      equivalent here, so those two stay manual. Wanted state is alerts ON,
#      automated fixes OFF -- Renovate owns dependency PRs, and running both
#      bots opens duplicate PRs for the same CVE.
#
# NOT HERE, because the repo is private on a free org and the API rejects them
# -- see issue #23: rulesets/branch protection, deployment environments,
# `allow_auto_merge`, code scanning, secret scanning, GitHub Pages. The one
# exception: the wanted required-status-checks state is recorded below as a
# commented-out `branches:` block, so the check names stay in review when CI
# jobs are renamed -- it must stay commented until the plan allows it, or an
# installed settings app would fail applying it.

repository:
  has_issues: true
  has_wiki: false
  has_projects: false
  # Off (2026-08-17): a second venue for questions splits the audience while
  # the project has no outside users to answer them.
  has_discussions: false

  # Squash-only. Merge commits and rebase both produce histories that break the
  # assumption the release tooling depends on: that every commit on main is a
  # Conventional Commits subject a version can be derived from.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

  # PR_TITLE, not COMMIT_OR_PR_TITLE (GitHub's default). The default uses the
  # commit subject when a PR has exactly one commit -- so a PR whose title was
  # checked by check-semantic-pr.yml could still land with an unchecked subject
  # line. PR_TITLE means the thing that was validated is the thing that lands.
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES

  delete_branch_on_merge: true
  allow_update_branch: true

# Wanted state, NOT applied -- plan-gated (issue #23): branch protection is
# rejected on a private repo in a free org, so this stays commented out until
# the repo goes public or the org upgrades. Recorded here so a CI job rename
# has to update this list in the same review. The contexts are the CI job
# names from .github/workflows/ci.yml; all three must be required -- "Build &
# gates" alone would let a red e2e or traceability gate merge. The review
# policy (approvals, stale-review dismissal) is a separate undecided baseline,
# tracked in issue #23 -- do not fold it in here without deciding it there.
#
# branches:
#   - name: main
#     protection:
#       required_status_checks:
#         strict: false
#         contexts:
#           - "Build & gates"
#           - "Portal e2e"
#           - "Traceability & spec gates"
#       enforce_admins: null
#       required_pull_request_reviews: null
#       restrictions: null

# Referenced by .github/labeler.yml, which applies them by changed path.
# actions/labeler does NOT create labels -- it errors on any that do not exist,
# so these must exist before that workflow can work.
labels:
  # ---------------------------------------------------------------
  # Subsystems, mapped to the package layout under
  # src/main/java/io/github/jimisola/skillsgateway/. One glob per label, so
  # files moving within a subsystem do not need a change here.
  # ---------------------------------------------------------------
  - name: ingestion
    color: "1d76db"
    description: "Quarantined ingestion: upstream fetch, manifests, snapshots"
  - name: vetting
    color: "5319e7"
    description: "Vetting connectors, findings, re-vetting and quarantine"
  - name: approval
    color: "b60205"
    description: "ApprovalService and the publish path"
  - name: facade
    color: "d93f0b"
    description: "Read-only git smart-HTTP facade"
  - name: audit
    color: "0e8a16"
    description: "Append-only audit ledger, export and sinks"
  - name: auth
    color: "b60205"
    description: "PAT and OIDC authentication, tokens, security config"
  - name: persistence
    color: "bfd4f2"
    description: "Entities, repositories and schema migrations"
  - name: retention
    color: "c5def5"
    description: "Retention policy and scheduling"
  - name: storage
    color: "bfd4f2"
    description: "Git storage backends"
  - name: admin
    color: "fbca04"
    description: "Admin surface and marketplace registration"
  - name: api
    color: "1d76db"
    description: "REST API, OpenAPI and SPA routing"
  - name: webhook
    color: "d4c5f9"
    description: "Webhook dispatch and signing"
  - name: config
    color: "ededed"
    description: "Application configuration and properties"
  - name: portal
    color: "6f42c1"
    description: "React/Vite portal"

  # ---------------------------------------------------------------
  # Cross-cutting
  # ---------------------------------------------------------------
  - name: tests
    color: "c2e0c6"
    description: "Test suite"
  - name: ci
    color: "000000"
    description: "CI/CD workflows and repo tooling"
  - name: deployment
    color: "5d0811"
    description: "Dockerfile, compose files and the Helm chart"
  - name: openspec
    color: "e99695"
    description: "OpenSpec proposals, specs and archives"
  - name: reqstool
    color: "f9d0c4"
    description: "Requirements and traceability (docs/reqstool)"
  - name: dependencies
    color: "0366d6"
    description: "Dependency updates"

  # ---------------------------------------------------------------
  # Warnings, not classifications. Both are deliberately loud.
  # ---------------------------------------------------------------
  # CLAUDE.md holds changes here to a higher bar: adversarial and negative
  # tests, and the old-coder evidence discipline -- not just happy-path
  # coverage. The label makes that visible on the PR list rather than only to
  # whoever remembers.
  - name: "⚠️ TRUST BOUNDARY"
    color: "b60205"
    description: "⚠️ Touches facade auth, ApprovalService, or the registration allowlist"
  # Merging a PR that touches settings.yml does not just change a file -- once
  # an app is installed it applies to the live repository, including things no
  # diff makes obvious (merge methods, branch protection, deployment approvers).
  - name: "⚠️ REPO SETTINGS"
    color: "b60205"
    description: "⚠️ Changes .github/settings.yml -- merging APPLIES it to the live repository"

  # ---------------------------------------------------------------
  # Applied by the issue templates in skillsgateway/.github, and by Renovate
  # itself -- not by labeler.yml. Same trap as above: GitHub issue forms and
  # Renovate both silently drop a label that does not exist, so without these
  # entries those configs do nothing at all.
  # ---------------------------------------------------------------
  - name: triage
    color: "ededed"
    description: "New issue awaiting triage"
  - name: bot-renovate
    color: "5319e7"
    description: "Opened by Renovate"
  - name: bot-renovate-stop
    color: "5d0811"
    description: "Renovate: stop updating this PR (add it yourself to pin a PR)"
  - name: bot-renovate-rebase
    color: "7057ff"
    description: "Renovate: recreate this PR's branch on the next run (consumed and removed by Renovate)"
  - name: security
    color: "b60205"
    description: "Vulnerability alert / security update"
  - name: renovate-version-major
    color: "d73a4a"
    description: "Major version update (breaking risk; never auto-merged)"
  - name: renovate-version-minor
    color: "fbca04"
    description: "Minor version update"
  - name: renovate-version-patch
    color: "0e8a16"
    description: "Patch version update"
  - name: renovate-version-digest
    color: "c5def5"
    description: "Digest/SHA pin update (never auto-merged)"

  # ---------------------------------------------------------------
  # GitHub's defaults, restated so this file is the whole picture rather than a
  # diff against whatever the repo happened to start with. `duplicate`,
  # `invalid` and `wontfix` are dropped -- closing with a comment says more.
  # ---------------------------------------------------------------
  - name: bug
    color: "d73a4a"
    description: "Something isn't working"
  - name: documentation
    color: "0075ca"
    description: "Improvements or additions to documentation"
  - name: enhancement
    color: "a2eeef"
    description: "New feature or request"
  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"
  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"
  - name: question
    color: "d876e3"
    description: "Further information is requested"
  - name: accessibility
    color: "f143ab"
    description: "Barrier affecting people with disabilities"
