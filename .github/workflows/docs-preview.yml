name: Docs preview

# The rendered docs for a PR, before they merge: one self-contained HTML file
# of the whole site, surfaced as a check run on the PR. docs.yml publishes the site for
# `dev` and for releases, but both are post-merge — prose changes can't be
# reviewed from a diff. ci.yml already runs `mkdocs build --strict` on every
# PR, so the link/anchor gate exists and doesn't belong here twice.
#
# HTML rather than PDF because the docs lean on client-rendered Mermaid
# diagrams, which a PDF export would lose. Nothing is deployed and nothing
# persists: the artifact expires after 14 days.
on:
  pull_request:
    paths:
      - 'docs/manual/**'
      - 'docs/requirements.txt'
      - 'mkdocs.yml'
      - 'mkdocs-print.yml'
      - '.github/workflows/docs-preview.yml'

# Superseded by the next push — a preview of an older commit has no reviewer.
# Unlike docs.yml's group, which must never cancel: nothing here is deployed.
concurrency:
  group: docs-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Render the single-file docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The check run below. A fork PR's token is read-only whatever this says,
      # which is what that step's own guard is for.
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'

      - name: Install the documentation toolchain
        run: pip install -r docs/requirements.txt htmlark

      # The same gate contributors run locally, then the single-file cut:
      # print-site (mkdocs-print.yml) concatenates the pages into one
      # document, htmlark inlines every asset as data: URIs. Named for the
      # commit so a reviewer can tell which push they downloaded.
      - name: Render the single-file site
        id: render
        env:
          PR: ${{ github.event.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdocs build --strict
          mkdocs build -f mkdocs-print.yml -d site-print
          sed 's|\.\./|./|g' site-print/print_page/index.html > site-print/print-flat.html
          name="skills-gateway-docs-pr${PR}-$(echo "$SHA" | cut -c1-7).html"
          (cd site-print && python -m htmlark print-flat.html -o "../$name")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # archive: false uploads the file raw instead of zipping it, so the
      # download opens straight in a browser. It takes the artifact name
      # from the filename and allows exactly one file.
      - name: Upload the single-file site
        id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ steps.render.outputs.name }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      # A check run rather than a PR comment. The preview is a build output, and
      # build outputs belong in the checks list next to the build that produced
      # them: it is always in the same place, it does not push a notification to
      # everyone watching the PR on every push, and it leaves the conversation
      # for conversation. Re-running the workflow replaces the check rather than
      # editing a comment nobody was looking for.
      #
      # Skipped on fork PRs, where the token cannot write — the artifact is still
      # on the run, reachable from the workflow itself.
      - name: Publish the preview as a check run
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          NAME: ${{ steps.render.outputs.name }}
        run: |
          set -euo pipefail
          # jq rather than a string of `-f` flags: the payload is nested, and jq
          # does the escaping the summary's Markdown would otherwise need.
          jq -n \
            --arg sha "$SHA" \
            --arg url "$URL" \
            --arg name "$NAME" \
            --arg short "${SHA:0:7}" \
            '{
              name: "Docs preview",
              head_sha: $sha,
              status: "completed",
              conclusion: "success",
              details_url: $url,
              output: {
                title: "The whole docs site as one HTML file",
                summary: "[Download \($name)](\($url)) — every page concatenated into one self-contained HTML file, rendered from `\($short)`. Mermaid diagrams render on open. Nothing is deployed; the file expires after 14 days."
              }
            }' \
            | gh api -X POST "repos/${REPO}/check-runs" --input - --silent
