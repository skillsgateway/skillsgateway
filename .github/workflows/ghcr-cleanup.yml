name: GHCR cleanup

# Dispatch-only, deliberately. Nothing here runs on a schedule or a push: a
# registry deletion is not something to retry silently, and since native.yml
# no longer publishes anything but a release (see native.yml and GW_0072),
# there is no ongoing accumulation this needs to chase -- it exists to sweep
# the `sha-<sha>` and `latest` tags a prior version of the pipeline left
# behind, and as a manually-triggered safety net if one ever reappears.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview only -- log what would be deleted, delete nothing."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete non-release tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Release and release-candidate tags are bare or prerelease semantic
      # versions (GW_0109: `1.2.0`, `1.2.0-rc1`, `1.2.0-b2`, `1.2.0-a1`) and are
      # the only tags this ever protects; everything else in the tag namespace
      # (`sha-<sha>`, the old `latest`) is a leftover from before GW_0072
      # stopped publishing on a main push.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: skillsgateway
          delete-tags: 'sha-*,latest'
          exclude-tags: '[0-9]*.[0-9]*.[0-9]*'
          dry-run: ${{ inputs.dry-run }}
