# The container image: built, smoke-tested, and -- only from a release --
# published.
#
# What it builds is not a native image: ADR 0012 made the release artifact the
# Spring Boot jar on a jlink runtime.
name: Container image

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 04:30 UTC
    - cron: '30 4 * * 1'
  workflow_dispatch:
  # Releases arrive here, not through a tag trigger. A `tags:` trigger would fire
  # the moment release.yml pushed the tag -- racing the release rather than being
  # a step in it, and publishing an image before anyone approved the release. So
  # a hand-pushed tag now publishes nothing, deliberately.
  workflow_call:
    inputs:
      version:
        description: "The released version. Set only by release.yml; becomes the image tag."
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  image:
    name: Container build & smoke test
    # One job, one buildx invocation, both platforms. The two-runner matrix this
    # replaces existed because native-image compiles for the host it runs on and
    # cannot cross-compile. The jar does not care: it is the same bytes on both
    # architectures, and only the jlink runtime under it is platform-specific,
    # which buildx builds for each target platform in the same build.
    #
    # A main push and a schedule/dispatch build and smoke-test exactly what a
    # release does -- proving the image works -- but publish nothing. Only
    # release.yml (`inputs.version` set) ever reaches GHCR: the published tag
    # namespace holds released versions only, never a moving per-commit tag.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publishing runs only from release.yml (never from a push, a schedule or
      # a bare dispatch); these cover the GHCR push and the SBOM attestation.
      packages: write
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: skillsgateway
          POSTGRES_USER: skillsgateway
          POSTGRES_PASSWORD: skillsgateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillsgateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The smoke test drives the API as a real administrator, and the web
      # surface accepts nothing but OIDC. interactiveLogin is false, unlike the
      # portal e2e suite's mock: there is no browser here, so the provider has to
      # answer the authorization request with a code rather than a login form.
      # The subject is set explicitly because a non-interactive token would
      # otherwise carry none, and an id_token with no `sub` is rejected.
      oidc:
        image: ghcr.io/navikt/mock-oauth2-server:2.3.0
        env:
          JSON_CONFIG: >-
            {"interactiveLogin": false,
             "tokenCallbacks": [
               {"issuerId": "default",
                "tokenExpiry": 3600,
                "requestMappings": [
                  {"requestParam": "grant_type",
                   "match": "*",
                   "claims": {"sub": "smoke-admin", "groups": ["sg-gateway-admins"]}}
                ]}
             ]}
        ports:
          - 9090:8080
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          cache: maven

      - name: Build the jar
        # The Dockerfile packages what this produces; it does not build it. The
        # UI gate execution is skipped (no browsers here) while the UI bundle
        # itself is still built into the jar.
        run: ./mvnw --batch-mode -DskipTests -Dskip.ui.verify=true package

      # QEMU is what lets the arm64 leg of the multi-arch build run its jlink
      # stage on an amd64 runner. Only the runtime build is emulated; the jar is
      # copied in unchanged, and nothing emulated is ever measured or timed.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build the marketplace fixture
        # Plain git, built here rather than fetched: no network dependency and
        # nothing external that can drift. It is bind-mounted into the image
        # below, because the container's root filesystem is read-only and its
        # /data is a tmpfs -- a path on the runner is not otherwise reachable
        # from inside.
        run: |
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          FIXTURE="$RUNNER_TEMP/smoke-fixture"
          mkdir -p "$FIXTURE/.claude-plugin" "$FIXTURE/plugins/hello/skills/hello"
          git init -q -b main "$FIXTURE"
          cat > "$FIXTURE/.claude-plugin/marketplace.json" <<'JSON'
          {
            "name": "smoke-marketplace",
            "owner": {"name": "Smoke"},
            "plugins": [{"name": "hello", "source": "./plugins/hello", "description": "smoke"}]
          }
          JSON
          # Conformant with the Agent Skills specification the skill-conformance
          # connector pins: a fixture that tripped the vetting chain would be
          # held rather than approved, and the clone below would have nothing to
          # find.
          cat > "$FIXTURE/plugins/hello/skills/hello/SKILL.md" <<'MD'
          ---
          name: hello
          description: Says hello. Use when the container smoke test needs a well-formed skill.
          ---
          # Hello
          MD
          git -C "$FIXTURE" add -A
          git -C "$FIXTURE" -c user.name=smoke -c user.email=smoke@example.invalid \
            -c commit.gpgsign=false commit -q -m "container smoke test fixture"
          echo "SMOKE_FIXTURE=$FIXTURE" >> "$GITHUB_ENV"

      - name: Build container image
        # The runner's own platform, loaded into the daemon so the smoke test can
        # run it natively. The multi-arch publish below rebuilds from cache.
        run: docker buildx build --platform linux/amd64 --load -t skills-gateway:ci .

      - name: Smoke test container
        run: |
          # Authorization is always enforced and a gateway that grants the admin role to
          # nobody refuses to start (GW_AUTH_0026), so the smoke test names one. It never logs in
          # as it: the assertion here is that the image boots and reports healthy, and the
          # startup guard is part of booting.
          #
          # Booting is a stronger assertion than it looks on this image: the runtime under
          # the jar is a jlink module set chosen by hand, so a missing module surfaces here
          # rather than in a deployment.
          #
          # The forwarded-header strategy is set because it is the setting GW_AUTH_0029 is about,
          # and this is the one place it is asserted against the real image rather than
          # against a test context.
          #
          # The root filesystem is read-only and the data directory a tmpfs, which is the
          # shape the Helm chart deploys: a runtime that needed to write anywhere else fails
          # here rather than in a cluster.
          docker run -d --name gateway --network host \
            --read-only --tmpfs /tmp:rw,mode=1777 --tmpfs /data:rw,mode=1777 \
            -v "$SMOKE_FIXTURE:/fixture:ro" \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/skillsgateway \
            -e SPRING_DATASOURCE_USERNAME=skillsgateway \
            -e SPRING_DATASOURCE_PASSWORD=skillsgateway \
            -e SKILLSGATEWAY_ROLES_ADMINS_0=smoke-test \
            -e SERVER_FORWARDHEADERSSTRATEGY=framework \
            -e SGW_OIDC_CLIENT_ID=smoke-client \
            -e SGW_OIDC_CLIENT_SECRET=smoke-secret \
            -e SGW_OIDC_AUTHORIZATION_URI=http://localhost:9090/default/authorize \
            -e SGW_OIDC_TOKEN_URI=http://localhost:9090/default/token \
            -e SGW_OIDC_JWK_SET_URI=http://localhost:9090/default/jwks \
            -e SKILLSGATEWAY_ROLES_CLAIM=groups \
            -e SKILLSGATEWAY_ROLES_MAPPINGS_0_CLAIMVALUE=sg-gateway-admins \
            -e SKILLSGATEWAY_ROLES_MAPPINGS_0_ROLE=admin \
            -e SKILLSGATEWAY_ALLOWEDURLSCHEMES=http,https,file \
            skills-gateway:ci
          healthy=false
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
              healthy=true; break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "gateway did not become healthy"; docker logs gateway; exit 1
          fi
          echo "gateway healthy"
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' \
            -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: gateway.example.com' \
            http://localhost:8080/oauth2/authorization/idp)
          # curl's %{redirect_url} reports the Location decoded, so match both forms: the
          # assertion is about the scheme and host the gateway derived, and percent-encoding
          # is curl's presentation choice rather than anything the gateway decided.
          case "$location" in
            *redirect_uri=https://gateway.example.com/login/oauth2/code/idp* | \
            *redirect_uri=https%3A%2F%2Fgateway.example.com%2Flogin%2Foauth2%2Fcode%2Fidp*)
              echo "forwarded headers honoured on the published image" ;;
            *)
              echo "forwarded headers ignored on the published image: $location"; docker logs gateway; exit 1 ;;
          esac

      - name: Smoke test the product on the published image
        # The step above proves the image boots. This one proves it works: #293
        # shipped a release where every ingest returned 500 and a health-only
        # smoke test passed anyway. Ingestion, approval, publication and the
        # facade are the four things the product is, so the assertion is one
        # happy path through all four -- against the artifact, not the code.
        #
        # Depth belongs in the portal e2e suite. Nothing here is a second test
        # suite; it is the shipped image doing its job once.
        run: |
          set -euo pipefail
          BASE=http://localhost:8080
          JAR="$RUNNER_TEMP/cookies.txt"
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null

          fail() { echo "smoke: $1"; docker logs gateway; exit 1; }
          # Spring Security's SPA CSRF posture: the token arrives as a cookie and
          # has to come back as a header on every mutating call.
          csrf() { awk '$6 == "XSRF-TOKEN" {print $7}' "$JAR" | tail -1; }

          # A real login through the real chain: the gateway redirects to the
          # provider, the provider answers with a code, and the gateway exchanges
          # it and opens a session. Nothing here uses the dev escape hatch, so a
          # break in the OIDC chain fails this step rather than hiding behind a
          # posture no deployment runs.
          curl -sS -c "$JAR" -b "$JAR" -L -o /dev/null "$BASE/oauth2/authorization/idp"
          me=$(curl -sS -b "$JAR" -c "$JAR" "$BASE/api/me")
          echo "$me" | grep -q '"role":"admin"' || fail "login did not yield an administrator: $me"

          # 1. Register, from the bind-mounted fixture. The file scheme is off the
          # default allowlist and is enabled above purely to deliver the fixture;
          # what is asserted is the registration, not the scheme.
          code=$(curl -sS -b "$JAR" -c "$JAR" -o "$RUNNER_TEMP/register.json" -w '%{http_code}' \
            -X POST "$BASE/api/marketplaces" \
            -H 'Content-Type: application/json' -H "X-XSRF-TOKEN: $(csrf)" \
            -d '{"name":"smoke","url":"file:///fixture"}')
          [ "$code" = "201" ] || fail "register returned $code: $(cat "$RUNNER_TEMP/register.json")"

          # 2. Ingest, and insist the snapshot is held -- not approved, and not
          # rejected on a policy violation.
          curl -sS -b "$JAR" -c "$JAR" -o "$RUNNER_TEMP/snapshot.json" \
            -X POST "$BASE/api/marketplaces/smoke/ingest" -H "X-XSRF-TOKEN: $(csrf)"
          id=$(jq -r '.id' "$RUNNER_TEMP/snapshot.json")
          state=$(jq -r '.state' "$RUNNER_TEMP/snapshot.json")
          [ "$state" = "held" ] || fail "ingest produced state '$state', expected held: $(cat "$RUNNER_TEMP/snapshot.json")"

          # 3. Approve. Only this publishes; the clone below is what proves it did.
          code=$(curl -sS -b "$JAR" -c "$JAR" -o "$RUNNER_TEMP/approve.json" -w '%{http_code}' \
            -X POST "$BASE/api/snapshots/$id/approve" \
            -H 'Content-Type: application/json' -H "X-XSRF-TOKEN: $(csrf)" -d '{}')
          [ "$code" = "200" ] || fail "approve returned $code: $(cat "$RUNNER_TEMP/approve.json")"
          [ "$(jq -r '.state' "$RUNNER_TEMP/approve.json")" = "approved" ] || fail "snapshot not approved"

          # 4. Clone it back through the facade with a PAT, and read the file.
          # The facade is a different chain from the API -- PAT over Basic, no
          # session, no cookie -- so this is the one assertion that covers it.
          curl -sS -b "$JAR" -c "$JAR" -o "$RUNNER_TEMP/token.json" \
            -X POST "$BASE/api/tokens" \
            -H 'Content-Type: application/json' -H "X-XSRF-TOKEN: $(csrf)" \
            -d '{"name":"container-smoke-test"}'
          pat=$(jq -r '.token' "$RUNNER_TEMP/token.json")
          [ -n "$pat" ] && [ "$pat" != "null" ] || fail "no cleartext token issued"

          clone="$RUNNER_TEMP/smoke-clone"
          git clone -q "http://x:$pat@localhost:8080/git/smoke" "$clone" \
            || fail "facade clone failed"
          skill="$clone/plugins/hello/skills/hello/SKILL.md"
          [ -f "$skill" ] || fail "clone is missing the skill: $(find "$clone" -type f -not -path '*/.git/*')"
          grep -q '^name: hello$' "$skill" || fail "cloned skill has unexpected content: $(cat "$skill")"

          echo "the published image ingested, approved, published and served a marketplace"

      - name: Helm lint
        run: helm lint helm/skills-gateway

      # --- Publication: only the smoke-tested image, and only from release.yml.
      #
      # One build produces both platforms and pushes them as a single tagged
      # multi-arch index. The platform manifests exist in the registry only as
      # the untagged children of that index, so GHCR's tagged-versions listing
      # holds one entry per release rather than three -- the same property the
      # push-by-digest matrix this replaces was built to preserve, reached
      # without a cross-job digest handoff because there is only one job now.
      - name: Log in to GHCR
        if: inputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the multi-arch image
        if: inputs.version != ''
        id: push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/skillsgateway/skillsgateway
          docker buildx build --platform linux/amd64,linux/arm64 \
            --metadata-file metadata.json \
            --tag "$IMAGE:$VERSION" --push .
          DIGEST=$(python3 -c 'import json,sys; print(json.load(open("metadata.json"))["containerimage.digest"])')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "## Published multi-arch image"
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo "Tag: $VERSION"
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest SBOM
        if: inputs.version != ''
        uses: actions/attest-sbom@v4.1.0
        with:
          subject-name: ghcr.io/skillsgateway/skillsgateway
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: target/classes/META-INF/sbom/application.cdx.json
          push-to-registry: true

      - name: Export image
        run: docker save skills-gateway:ci | gzip > skills-gateway-image.tar.gz

      # Development-path artifacts. Actions storage is free on a public repo, so
      # these are trimmed for tidiness rather than cost -- the image is only ever
      # wanted while investigating the run that produced it. The artifacts a
      # release attaches are built and uploaded by release.yml's `package` job,
      # not here, and keep the default retention.
      - name: Upload image artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: skills-gateway-container-image
          path: skills-gateway-image.tar.gz
          retention-days: 7

      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-cyclonedx-container
          path: target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
          retention-days: 30
