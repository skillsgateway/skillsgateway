name: Native image

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 04:30 UTC
    - cron: '30 4 * * 1'
  workflow_dispatch:
  # Releases arrive here, not through a tag trigger. A `tags:` trigger would fire
  # the moment release.yml pushed the tag -- racing the release rather than being
  # a step in it, and publishing an image before anyone approved the release. So
  # a hand-pushed tag now publishes nothing, deliberately.
  workflow_call:
    inputs:
      version:
        description: "The released version. Set only by release.yml; becomes the image tag."
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    name: Native build, container & smoke test
    # native-image compiles for the host it runs on -- there is no
    # cross-compilation and no --platform flag that would make one runner
    # produce both architectures, so each platform is a real leg on its own
    # runner rather than a buildx target. GitHub's ubuntu-24.04-arm hosted
    # runner gives the arm64 leg real hardware, which is also strictly better
    # smoke-test coverage than emulation would be.
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Publishing runs only from a main push or from release.yml (never from a
      # schedule or a bare dispatch); these cover the GHCR push and the SBOM
      # attestation.
      packages: write
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: skillsgateway
          POSTGRES_USER: skillsgateway
          POSTGRES_PASSWORD: skillsgateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillsgateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@f60d4ea89f14098520aea588431217bbd9551570 # v1.6.5
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven

      - name: Build native image
        # native:compile forks the package lifecycle; the UI gate execution is
        # skipped (no browsers here) while the UI bundle itself is still built.
        run: ./mvnw --batch-mode -Pnative -DskipTests -Dskip.ui.verify=true native:compile

      - name: Build container image
        run: docker build -t skills-gateway:ci .

      - name: Smoke test container
        run: |
          # Authorization is always enforced and a gateway that grants the admin role to
          # nobody refuses to start (GW_0139), so the smoke test names one. It never logs in
          # as it: the assertion here is that the image boots and reports healthy, and the
          # startup guard is part of booting.
          docker run -d --name gateway --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/skillsgateway \
            -e SPRING_DATASOURCE_USERNAME=skillsgateway \
            -e SPRING_DATASOURCE_PASSWORD=skillsgateway \
            -e SKILLSGATEWAY_ROLES_ADMINS_0=smoke-test \
            skills-gateway:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "gateway healthy"; exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy"; docker logs gateway; exit 1

      - name: Helm lint
        run: helm lint helm/skills-gateway

      # --- Publication: only the smoke-tested image, and only from a main push
      # or from release.yml ---
      #
      # `inputs.version` is the release path: under workflow_call `github.event_name`
      # is the CALLER's event (workflow_dispatch), so a bare `== 'push'` test would
      # silently skip publication for every release. On a push, schedule or bare
      # dispatch the `inputs` context is empty, so `inputs.version` is null and the
      # second test is false -- which is what keeps a scheduled or manually
      # dispatched build from ever moving a published tag.
      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' || inputs.version != ''
        id: push
        env:
          # The released version when release.yml called us, empty on a main push.
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/skillsgateway/skillsgateway
          if [[ -n "$VERSION" ]]; then
            TAGS="$VERSION"
          else
            TAGS="sha-${SHA} latest"
          fi
          # Arch-suffixed: this is the per-platform manifest the `publish` job
          # below combines into the multi-arch index published under the
          # unsuffixed names above. Pipeline-internal, not a pinnable tag.
          for tag in $TAGS; do
            docker tag skills-gateway:ci "$IMAGE:${tag}-${SUFFIX}"
            docker push "$IMAGE:${tag}-${SUFFIX}"
          done
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${TAGS%% *}-${SUFFIX}" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "## Published image (${{ matrix.platform }})"
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo "Tags: $(echo "$TAGS" | sed "s/[^ ]*/&-${SUFFIX}/g")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest SBOM
        if: github.event_name == 'push' || inputs.version != ''
        uses: actions/attest-sbom@v4.1.0
        with:
          subject-name: ghcr.io/skillsgateway/skillsgateway
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: target/classes/META-INF/sbom/application.cdx.json
          push-to-registry: true

      - name: Export image
        run: docker save skills-gateway:ci | gzip > skills-gateway-image.tar.gz

      # Development-path artifacts. Actions storage is free on a public repo, so
      # these are trimmed for tidiness rather than cost -- the image is only ever
      # wanted while investigating the run that produced it. The artifacts a
      # release attaches are built and uploaded by release.yml's `package` job,
      # not here, and keep the default retention.
      - name: Upload image artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Suffixed: one upload per matrix leg would otherwise collide on the
          # same artifact name within a run.
          name: skills-gateway-native-image-${{ matrix.suffix }}
          path: skills-gateway-image.tar.gz
          retention-days: 7

      - name: Upload native-build SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-cyclonedx-native-${{ matrix.suffix }}
          path: target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish multi-arch manifest
    needs: native
    # Restated: this is a separate job, so `native`'s per-step publish gate
    # does not protect it. Every matrix leg "succeeds" on a schedule or a bare
    # dispatch too -- it just skips its own push and attest steps -- so
    # `needs.native.result == 'success'` alone is not enough to keep this off
    # a schedule.
    if: ${{ !cancelled() && needs.native.result == 'success' && (github.event_name == 'push' || inputs.version != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/skillsgateway/skillsgateway
          if [[ -n "$VERSION" ]]; then
            TAGS="$VERSION"
          else
            TAGS="sha-${SHA} latest"
          fi
          BASE="${TAGS%% *}"
          TAG_ARGS=()
          for tag in $TAGS; do
            TAG_ARGS+=(-t "$IMAGE:$tag")
          done
          docker buildx imagetools create "${TAG_ARGS[@]}" \
            "$IMAGE:${BASE}-amd64" "$IMAGE:${BASE}-arm64"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${BASE}" | awk '/^Digest:/{print $2}')
          {
            echo "## Published multi-arch image"
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo "Tags: $TAGS"
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
