name: Native image

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 04:30 UTC
    - cron: '30 4 * * 1'
  workflow_dispatch:
  # Releases arrive here, not through a tag trigger. A `tags:` trigger would fire
  # the moment release.yml pushed the tag -- racing the release rather than being
  # a step in it, and publishing an image before anyone approved the release. So
  # a hand-pushed tag now publishes nothing, deliberately.
  workflow_call:
    inputs:
      version:
        description: "The released version. Set only by release.yml; becomes the image tag."
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    name: Native build, container & smoke test
    # native-image compiles for the host it runs on -- there is no
    # cross-compilation and no --platform flag that would make one runner
    # produce both architectures, so each platform is a real leg on its own
    # runner rather than a buildx target. GitHub's ubuntu-24.04-arm hosted
    # runner gives the arm64 leg real hardware, which is also strictly better
    # smoke-test coverage than emulation would be.
    #
    # A main push and a schedule/dispatch build and smoke-test both platforms
    # exactly like a release does -- proving the image works -- but publish
    # nothing. Only release.yml (`inputs.version` set) ever reaches GHCR: the
    # published tag namespace holds released versions only, never a moving
    # per-commit tag.
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Publishing runs only from release.yml (never from a push, a schedule or
      # a bare dispatch); these cover the GHCR push and the SBOM attestation.
      packages: write
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: skillsgateway
          POSTGRES_USER: skillsgateway
          POSTGRES_PASSWORD: skillsgateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillsgateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven

      - name: Build native image
        # native:compile forks the package lifecycle; the UI gate execution is
        # skipped (no browsers here) while the UI bundle itself is still built.
        run: ./mvnw --batch-mode -Pnative -DskipTests -Dskip.ui.verify=true native:compile

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build container image
        run: docker buildx build --platform ${{ matrix.platform }} --load -t skills-gateway:ci .

      - name: Smoke test container
        run: |
          # Authorization is always enforced and a gateway that grants the admin role to
          # nobody refuses to start (GW_0139), so the smoke test names one. It never logs in
          # as it: the assertion here is that the image boots and reports healthy, and the
          # startup guard is part of booting.
          docker run -d --name gateway --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/skillsgateway \
            -e SPRING_DATASOURCE_USERNAME=skillsgateway \
            -e SPRING_DATASOURCE_PASSWORD=skillsgateway \
            -e SKILLSGATEWAY_ROLES_ADMINS_0=smoke-test \
            skills-gateway:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "gateway healthy"; exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy"; docker logs gateway; exit 1

      - name: Helm lint
        run: helm lint helm/skills-gateway

      # --- Publication: only the smoke-tested image, and only from release.yml.
      #
      # Each leg pushes its own platform manifest addressed by digest, never by a
      # tag -- `push-by-digest` is buildx's documented mechanism for exactly
      # this cross-job matrix shape, and it is what keeps GHCR from ever
      # recording an `-amd64`/`-arm64` tag: the `publish` job below references
      # these digests directly to build the one tagged multi-arch index a
      # consumer sees. A hand-pushed tag then deleted after the fact was
      # considered and rejected in design.md -- it risks detaching the very
      # blob the index needs, where digest-only push never creates that tag to
      # begin with.
      - name: Log in to GHCR
        if: inputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image by digest
        if: inputs.version != ''
        id: push
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/skillsgateway/skillsgateway
          docker buildx build --platform ${{ matrix.platform }} \
            --metadata-file metadata.json \
            --output type=image,name="$IMAGE",push=true,push-by-digest=true,name-canonical=true \
            .
          DIGEST=$(python3 -c 'import json,sys; print(json.load(open("metadata.json"))["containerimage.digest"])')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/digests
          echo -n "$DIGEST" > "/tmp/digests/${{ matrix.suffix }}.txt"
          {
            echo "## Pushed platform manifest (${{ matrix.platform }})"
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest
        if: inputs.version != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1

      - name: Attest SBOM
        if: inputs.version != ''
        uses: actions/attest-sbom@v4.1.0
        with:
          subject-name: ghcr.io/skillsgateway/skillsgateway
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: target/classes/META-INF/sbom/application.cdx.json
          push-to-registry: true

      - name: Export image
        run: docker save skills-gateway:ci | gzip > skills-gateway-image.tar.gz

      # Development-path artifacts. Actions storage is free on a public repo, so
      # these are trimmed for tidiness rather than cost -- the image is only ever
      # wanted while investigating the run that produced it. The artifacts a
      # release attaches are built and uploaded by release.yml's `package` job,
      # not here, and keep the default retention.
      - name: Upload image artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Suffixed: one upload per matrix leg would otherwise collide on the
          # same artifact name within a run.
          name: skills-gateway-native-image-${{ matrix.suffix }}
          path: skills-gateway-image.tar.gz
          retention-days: 7

      - name: Upload native-build SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-cyclonedx-native-${{ matrix.suffix }}
          path: target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish multi-arch manifest
    needs: native
    # Restated: this is a separate job, so `native`'s per-step publish gate does
    # not protect it. Every matrix leg "succeeds" on a push, a schedule or a
    # bare dispatch too -- it just skips its own push and attest steps -- so
    # `needs.native.result == 'success'` alone is not enough to keep this
    # confined to release.yml.
    if: ${{ !cancelled() && needs.native.result == 'success' && inputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and push the multi-arch manifest
        env:
          # `inputs.*` is workflow-scoped, so it is readable here even though
          # only `native` declared a dependency on it.
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/skillsgateway/skillsgateway
          docker buildx imagetools create -t "$IMAGE:$VERSION" \
            "$IMAGE@$(cat /tmp/digests/amd64.txt)" \
            "$IMAGE@$(cat /tmp/digests/arm64.txt)"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/{print $2}')
          {
            echo "## Published multi-arch image"
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo "Tag: $VERSION"
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
