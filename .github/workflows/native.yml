name: Native image

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Weekly, Monday 04:30 UTC
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native build, container & smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publishing runs only on push events (never schedule/dispatch); these
      # cover the GHCR push and the SBOM attestation.
      packages: write
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: skillsgateway
          POSTGRES_USER: skillsgateway
          POSTGRES_PASSWORD: skillsgateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillsgateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven

      - name: Build native image
        # native:compile forks the package lifecycle; the UI gate execution is
        # skipped (no browsers here) while the UI bundle itself is still built.
        run: ./mvnw --batch-mode -Pnative -DskipTests -Dskip.ui.verify=true native:compile

      - name: Build container image
        run: docker build -t skills-gateway:ci .

      - name: Smoke test container
        run: |
          docker run -d --name gateway --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/skillsgateway \
            -e SPRING_DATASOURCE_USERNAME=skillsgateway \
            -e SPRING_DATASOURCE_PASSWORD=skillsgateway \
            skills-gateway:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "gateway healthy"; exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy"; docker logs gateway; exit 1

      - name: Helm lint
        run: helm lint helm/skills-gateway

      # --- Publication: only the smoke-tested image, only from push events ---
      # (main pushes and v* tags; scheduled and manual runs never move a tag)

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        id: push
        run: |
          IMAGE=ghcr.io/skillsgateway/skillsgateway
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${{ github.ref_name }}"
          else
            TAGS="sha-${{ github.sha }} latest"
          fi
          for tag in $TAGS; do
            docker tag skills-gateway:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${TAGS%% *}" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "## Published image"
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo "Tags: $TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest SBOM
        if: github.event_name == 'push'
        uses: actions/attest-sbom@v3
        with:
          subject-name: ghcr.io/skillsgateway/skillsgateway
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: target/classes/META-INF/sbom/application.cdx.json
          push-to-registry: true

      - name: Export image
        run: docker save skills-gateway:ci | gzip > skills-gateway-image.tar.gz

      # Development-path artifacts. Actions storage is free on a public repo, so
      # these are trimmed for tidiness rather than cost -- the image is only ever
      # wanted while investigating the run that produced it. Release artifacts,
      # once the release flow exists, keep the default retention.
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: skills-gateway-native-image
          path: skills-gateway-image.tar.gz
          retention-days: 7

      - name: Upload native-build SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-native
          path: target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
          retention-days: 30
