name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called by release.yml so a release runs the same gates that guard main,
  # rather than a second, drifting copy of them. `uses: ./.github/workflows/ci.yml`
  # resolves against the *caller's* ref, so the gates run on the commit being
  # released -- which is the commit that then gets tagged.
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    name: Build & gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Nisse derives the Maven version from git history; shallow clones break it.
          fetch-depth: 0

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # frontend-maven-plugin unpacks its own node+pnpm into src/main/frontend/node;
      # cache the unpacked directory so the plugin skips the install on a hit.
      - name: Cache frontend-maven-plugin node
        uses: actions/cache@v6.1.0
        with:
          path: src/main/frontend/node
          key: fmp-node-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      # Storybook story tests run in their own job (#103), so this job needs
      # no browser: mvnw verify runs only the jsdom `unit` vitest project.
      - name: Build and test (Java + UI gates, packaged jar)
        run: ./mvnw --batch-mode verify

      # The traceability job joins these with the e2e job's Playwright results.
      - name: Upload traceability inputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: traceability-gates
          path: |
            target/reqstool/annotations-combined.yml
            target/surefire-reports/*.xml
            src/main/frontend/test-results/*.xml
          if-no-files-found: error

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-cyclonedx
          path: target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error

  # Storybook story tests need a real chromium plus a Vite dev server; run
  # inside `mvnw verify` they intermittently starved on the shared 2-core
  # runner (#103). A dedicated job removes the contention. Stories carry no
  # reqstool annotations, so the traceability job does not consume this job's
  # results.
  stories:
    name: Storybook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/main/frontend/pnpm-lock.yaml') }}

      - name: Install UI dependencies
        working-directory: src/main/frontend
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: src/main/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: src/main/frontend
        run: pnpm exec playwright install-deps chromium

      - name: Storybook story tests (real chromium)
        working-directory: src/main/frontend
        run: pnpm test:stories

      - name: Upload story test results on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stories-artifacts
          path: src/main/frontend/test-results
          if-no-files-found: ignore

  e2e:
    name: Portal e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Nisse derives the Maven version from git history; shallow clones break it.
          fetch-depth: 0

      # Let the Docker daemon fetch the compose images while the jar builds.
      - name: Pre-pull e2e compose images in the background
        run: nohup docker compose -f compose.e2e.yaml pull --quiet >/dev/null 2>&1 &

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache frontend-maven-plugin node
        uses: actions/cache@v6.1.0
        with:
          path: src/main/frontend/node
          key: fmp-node-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/main/frontend/pnpm-lock.yaml') }}

      - name: Install UI dependencies
        working-directory: src/main/frontend
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: src/main/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: src/main/frontend
        run: pnpm exec playwright install-deps chromium

      # Both test suites run in the gates job; here we only need the boot jar.
      - name: Package boot jar (tests run in the gates job)
        run: ./mvnw --batch-mode -DskipTests -Dskip.ui.verify=true package

      - name: Portal e2e (real login via mock OIDC IdP)
        working-directory: src/main/frontend
        run: pnpm e2e

      - name: Upload Playwright results for traceability
        uses: actions/upload-artifact@v7.0.1
        with:
          name: traceability-e2e
          path: src/main/frontend/test-results/playwright-junit.xml
          if-no-files-found: error

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-artifacts
          path: |
            src/main/frontend/test-results
            src/main/frontend/playwright-report
          if-no-files-found: ignore

  docs:
    name: Documentation (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the documentation toolchain
        run: pip install -r docs/requirements.txt

      # The same gate contributors run locally, and the same one docs.yml runs
      # before publishing -- but that one only runs after a merge, so a broken
      # internal link used to reach main before anything complained.
      - name: Build (strict)
        run: mkdocs build --strict

      # Generated headline diagrams must match their Mermaid sources: an .mmd
      # edited without regenerating its SVG pair fails here, not on the site.
      - name: Diagram manifest in sync
        run: python3 docs/diagrams/verify.py

      # Not documentation, but it wants exactly what this job already has -- a
      # checkout, Python, and a required check to fail. A label whose globs match
      # nothing is silent to actions/labeler, which is how the Java package move
      # left nineteen dead globs and no trust-boundary warning (#193).
      - name: Labeler globs match real paths
        run: python3 .github/verify-labeler.py

  traceability:
    name: Traceability & spec gates
    runs-on: ubuntu-latest
    needs: [gates, e2e]
    steps:
      - uses: actions/checkout@v7.0.1

      # Restores target/** and src/main/frontend/test-results/** from the gates job.
      - name: Download gates traceability inputs
        uses: actions/download-artifact@v8.0.1
        with:
          name: traceability-gates
          path: .

      - name: Download Playwright results
        uses: actions/download-artifact@v8.0.1
        with:
          name: traceability-e2e
          path: src/main/frontend/test-results

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'

      - name: Cache reqstool CLI
        id: reqstool-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.reqstool-venv
          key: reqstool-0.12.0-${{ runner.os }}-py3.13

      - name: Install reqstool CLI
        if: steps.reqstool-cache.outputs.cache-hit != 'true'
        run: |
          python3.13 -m venv ~/.reqstool-venv
          ~/.reqstool-venv/bin/pip install reqstool==0.12.0

      - name: Requirements traceability gate (backend + portal results)
        run: |
          ~/.reqstool-venv/bin/reqstool status local -p docs/reqstool | tee reqstool-status.txt
          grep -q '· PASS$' reqstool-status.txt

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: OpenSpec validation gate
        run: openspec validate --all --strict
