# reqstool-ai configuration
#
# This file tells reqstool-ai skills where to find your reqstool files
# and how to generate IDs for new requirements and SVCs.

# Project URN — matches the urn in your reqstool YAML files
urn: skills-gateway

# Revision string for new requirements and SVCs
revision: "0.1.0"

# System-level reqstool directory (contains the SSOT requirements and SVCs)
system:
  path: docs/reqstool

# Single-module project: the gateway service shares the system reqstool dir
# (split into system + per-service modules when more services are added)
#
# Ids are domain-prefixed (GW_<DOMAIN>_NNNN / SVC_GW_<DOMAIN>_NNNN) and minted
# manually — each domain keeps its own sequence, so there is no single counter
# for this tool to append to. req_prefix/svc_prefix are blank per the
# reqstool-conventions skill's guidance for domain-specific prefixes.
#
# Domains in use: INGEST, VETTING, AUTH, FACADE, APPROVAL, AUDIT, WEBHOOK,
# RETENTION, RELEASE, ESTATE, OBSERVABILITY, API. See ADR 0018.
modules:
  gateway:
    path: docs/reqstool
    req_prefix: ""
    svc_prefix: "SVC_"
