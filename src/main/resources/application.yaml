server:
  # An in-flight upload-pack or ingestion clone is not something to cut mid-transfer
  # (GW_FACADE_0033): SIGTERM drains rather than severing. The chart's
  # terminationGracePeriodSeconds must be at least this plus the container's own stop time.
  shutdown: graceful
  servlet:
    session:
      cookie:
        # Named rather than left to the browser: Firefox and Safari apply no default at all, so an
        # unset attribute means the session cookie rides a cross-site request in those browsers.
        # Lax, not Strict — Strict withholds the cookie on the identity provider's redirect back to
        # /login/oauth2/code/*, which is a cross-site top-level navigation, and login fails with the
        # authorization request unfound. Lax still withholds it on every cross-site POST, which is
        # the vector (GW_AUTH_0030).
        same-site: lax

spring:
  application:
    name: skills-gateway
  mvc:
    # Every refusal is an RFC 7807 document (GW_API_0007). Off by default in Boot, which is why
    # ~35 ResponseStatusException call sites were answering with an empty body and no content type
    # while the reference page documented ProblemDetail: the reason text the portal shows a user
    # never reached it. The @ExceptionHandler methods already returned ProblemDetail; this is what
    # makes the other two routes to a refusal agree with them.
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        # Placeholders rather than absent values, so the registration always
        # exists and a gateway with none of these set still starts; real
        # deployments override the SGW_OIDC_* environment variables.
        registration:
          idp:
            client-id: ${SGW_OIDC_CLIENT_ID:change-me}
            client-secret: ${SGW_OIDC_CLIENT_SECRET:change-me}
            scope: ${SGW_OIDC_SCOPE:openid}
            authorization-grant-type: authorization_code
            # {baseUrl} is the request as the container sees it; behind a TLS-terminating
            # proxy that is only right with server.forward-headers-strategy set (GW_AUTH_0029).
            # The variable states the registered URI outright when it is not.
            redirect-uri: ${SGW_OIDC_REDIRECT_URI:{baseUrl}/login/oauth2/code/idp}
        provider:
          idp:
            # A shared registration's `sub` is an opaque per-application id, so this has to be
            # settable or every grant and ledger row names a string no human can resolve.
            user-name-attribute: ${SGW_OIDC_USER_NAME_ATTRIBUTE:sub}
            authorization-uri: ${SGW_OIDC_AUTHORIZATION_URI:https://idp.invalid/authorize}
            token-uri: ${SGW_OIDC_TOKEN_URI:https://idp.invalid/token}
            jwk-set-uri: ${SGW_OIDC_JWK_SET_URI:https://idp.invalid/jwks}

skills-gateway:
  data-dir: data

scalar:
  enabled: true
  path: /docs
  url: /v3/api-docs
  theme: purple

# Local observability is opt-in: the LGTM dev service and OpenTelemetry export are
# both off unless the "observability" profile is active (application-observability.yaml).
# This keeps `./mvnw verify` and the e2e suite free of an extra container and of any
# OTLP export attempts.
arconia:
  dev:
    services:
      lgtm:
        enabled: false
  otel:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,sbom
  endpoint:
    health:
      # Separate liveness from readiness (GW_FACADE_0034). Without this both probes read the
      # aggregate, so a PostgreSQL or object-store outage failed *liveness* and the orchestrator
      # restarted pods that were working correctly and waiting for a dependency to come back.
      probes:
        enabled: true
      group:
        # Liveness is "this JVM is still itself". No dependency belongs here: a restart cannot
        # fix somebody else's database.
        liveness:
          include: livenessState
        # Readiness is "send me traffic", which a gateway that cannot reach its database or its
        # object store should not be. This is where a dependency outage belongs, and taking a pod
        # out of the endpoints is recoverable in a way that killing it is not.
        readiness:
          include: readinessState,db,gitStorage
