# Default values for skills-gateway.

image:
  repository: skills-gateway
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# External PostgreSQL — enterprise deployments bring their own database.
postgresql:
  host: ""
  port: 5432
  database: skillsgateway
  username: skillsgateway
  # Name of an existing Secret with key `password` for the database user.
  existingSecret: ""

# OIDC identity provider for the web/admin surface (GW_0011).
oidc:
  clientId: ""
  # Name of an existing Secret with key `client-secret`.
  existingSecret: ""
  authorizationUri: ""
  tokenUri: ""
  jwkSetUri: ""
  # Claim that names the principal. A shared app registration's `sub` is an
  # opaque per-application id, so set this to a readable claim there.
  userNameAttribute: "sub"
  # Comma-separated scopes to request; widen when the provider needs a scope to
  # emit group or role claims.
  scope: "openid"
  # Expected ID-token issuer. Unset means the issuer is not checked at all —
  # on a multi-tenant endpoint that is the tenant boundary left open.
  issuer: ""

# Git storage (/data). emptyDir by default; set an existing PVC for durability.
persistence:
  existingClaim: ""

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
