apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skills-gateway.fullname" . }}
  labels:
    {{- include "skills-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "skills-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.config }}
      annotations:
        # Roll the pods when the layered configuration changes: a mounted
        # ConfigMap is refreshed in place, but the estate is reconciled at
        # startup, so without a restart the new configuration is never read.
        checksum/config: {{ toYaml .Values.config | sha256sum }}
      {{- end }}
      labels:
        {{- include "skills-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "skills-gateway.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: skills-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ required "postgresql.host is required" .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.postgresql.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgresql.existingSecret is required" .Values.postgresql.existingSecret }}
                  key: password
            - name: SGW_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: SGW_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "oidc.existingSecret is required" .Values.oidc.existingSecret }}
                  key: client-secret
            - name: SGW_OIDC_AUTHORIZATION_URI
              value: {{ .Values.oidc.authorizationUri | quote }}
            - name: SGW_OIDC_TOKEN_URI
              value: {{ .Values.oidc.tokenUri | quote }}
            - name: SGW_OIDC_JWK_SET_URI
              value: {{ .Values.oidc.jwkSetUri | quote }}
            - name: SGW_OIDC_USER_NAME_ATTRIBUTE
              value: {{ .Values.oidc.userNameAttribute | quote }}
            - name: SGW_OIDC_SCOPE
              value: {{ .Values.oidc.scope | quote }}
            {{- if .Values.oidc.issuer }}
            - name: SKILLSGATEWAY_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            {{- end }}
            {{- if .Values.config }}
            # Layered on top of the application.yaml inside the image; the
            # image keeps the defaults, this file overrides them. `optional:`
            # keeps the container starting if the mount is ever absent.
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "optional:file:/etc/skills-gateway/"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The exact /actuator/health path is the only unauthenticated
          # actuator endpoint; liveness/readiness subpaths would be
          # redirected to the IdP.
          volumeMounts:
            - name: data
              mountPath: /data
            # The root filesystem is read-only, so the one path the runtime
            # still needs to write -- temporary files, including JGit's -- is
            # provided explicitly.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.config }}
            - name: config
              mountPath: /etc/skills-gateway
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- include "skills-gateway.storageVolume" . | nindent 10 }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "skills-gateway.configMapName" . }}
        {{- end }}
